# Xray-core, the relay Lumen runs for a profile whose proxy is a VLESS, VMess, Trojan or Shadowsocks
# link (docs/TUNNEL.md, "Links"). Built from source by scripts/build-xray.sh — never downloaded as a
# binary — and put into the app by `XRAY=1 scripts/build-app.sh` as Contents/MacOS/LumenXray.
#
# The tag is pinned to its commit (a tag can be moved; the commit cannot), the Go toolchain to its
# version and its bytes (below), and the result to its SHA-256 for each architecture: the same
# source, toolchain and flags give the same bytes on any host (CGO off, -trimpath, no build id), so a
# build anywhere — CI's macOS runner, a Linux machine, the release Mac — must come out as recorded
# here, or build-xray.sh fails.
#
# The Go toolchain is Go's own module of it — golang.org/toolchain v0.0.1-go<GO_VERSION>.<os>-<arch>,
# the very archive `GOTOOLCHAIN=go<GO_VERSION>` fetches — downloaded by build-xray.sh from Go's module
# proxy, checked against the SHA-256 below for the host that builds, and kept in its cache: the
# building Mac needs no Go of its own (nor Homebrew). Each SHA-256 was taken of the archive whose h1:
# Go's checksum database (sum.golang.org, a public append-only log) records for that module, which is
# quoted beside it; any other bytes are refused.
#
# To move to a new Xray or Go: change the tag, the commit and the Go version below, and the toolchain
# lines (`scripts/build-xray.sh --toolchain-lines` prints them for a new GO_VERSION, each checked
# against sum.golang.org), then run `scripts/build-xray.sh --record` (it prints the new SHA-256 lines
# of Xray and the notices' diff), review the upstream changes (docs/TUNNEL.md, "Updating Xray"), and
# commit this file with the notices.
