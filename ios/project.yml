# Lumen for iPhone (stage 2, branch claude/ios-app, never merged). `xcodegen generate` writes
# Lumen.xcodeproj from this file; the project itself is not kept in git.
name: Lumen
options:
  bundleIdPrefix: io.lumenbrowser
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: ru
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  LumenCore:
    path: LumenCore
targets:
  Lumen:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Lumen
        excludes:
          - "Resources/**"
          - "Info.plist"
      - path: Lumen/Resources
        buildPhase: resources
    dependencies:
      - package: LumenCore
    info:
      path: Lumen/Info.plist
      properties:
        CFBundleDisplayName: Lumen
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.lumenbrowser.ios
        TARGETED_DEVICE_FAMILY: "1"
    postBuildScripts:
      # Debug builds (the tests') only: the proxy check asks the testbed's geolocation service,
      # http://geo.lumentest, through the proxy — plain http, which App Transport Security refuses an
      # app's own URLSession (CI run 5). Release keeps ATS whole for the app's requests; web pages
      # are NSAllowsArbitraryLoadsInWebContent in both.
      - name: "Debug only: the testbed's geolocation service over http"
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          [ "$CONFIGURATION" = "Debug" ] || exit 0
          plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          pb() { /usr/libexec/PlistBuddy -c "$1" "$plist"; }
          pb "Delete :NSAppTransportSecurity:NSExceptionDomains" 2>/dev/null || true
          pb "Add :NSAppTransportSecurity:NSExceptionDomains dict"
          pb "Add :NSAppTransportSecurity:NSExceptionDomains:geo.lumentest dict"
          pb "Add :NSAppTransportSecurity:NSExceptionDomains:geo.lumentest:NSExceptionAllowsInsecureHTTPLoads bool true"
  LumenUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: LumenUITests
    dependencies:
      - target: Lumen
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.lumenbrowser.ios.uitests
        TEST_TARGET_NAME: Lumen
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Lumen:
    build:
      targets:
        Lumen: all
        LumenUITests: [test]
    test:
      config: Debug
      targets:
        - LumenUITests
