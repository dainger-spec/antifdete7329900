# Lumen for iPhone (stage 2, branch claude/ios-app, never merged). `xcodegen generate` writes
# Lumen.xcodeproj from this file; the project itself is not kept in git.
name: Lumen
options:
  bundleIdPrefix: io.lumenbrowser
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: ru
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  LumenCore:
    path: LumenCore
targets:
  Lumen:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Lumen
        excludes:
          - "Resources/**"
          - "Info.plist"
      - path: Lumen/Resources
        buildPhase: resources
    dependencies:
      - package: LumenCore
    info:
      path: Lumen/Info.plist
      properties:
        CFBundleDisplayName: Lumen
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        ITSAppUsesNonExemptEncryption: false
        # The Lumen account (the server's CONTRACT.md §2, §7.2): the server, the site, and the keys
        # documents of rights are trusted by — key id -> base64 of the raw Ed25519 public key. The
        # server signs every document with one key, so a release carries the same key(s) as the Mac
        # release (the lead, 10 November): given at build time, as there — ENTITLEMENT_PUBLIC_KEYS,
        # the build phase below; a Release build without it does not build. A test's stand-in key
        # comes with the test (DEBUG builds only), never from this file.
        PBAccountServerURL: https://api.lumenbrowser.io
        PBAccountSiteURL: https://lumenbrowser.io
        PBEntitlementPublicKeys: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.lumenbrowser.ios
        TARGETED_DEVICE_FAMILY: "1"
    postBuildScripts:
      # Debug builds (the tests') only: the proxy check asks the testbed's geolocation service,
      # http://geo.lumentest, through the proxy — plain http, which App Transport Security refuses an
      # app's own URLSession (CI run 5) — and the account's requests go to the testbed's stand-in for
      # the account server, http://account.lumentest. Release keeps ATS whole for the app's requests;
      # web pages are NSAllowsArbitraryLoadsInWebContent in both.
      - name: "Debug only: the testbed's geolocation service and account server over http"
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          [ "$CONFIGURATION" = "Debug" ] || exit 0
          plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          pb() { /usr/libexec/PlistBuddy -c "$1" "$plist"; }
          pb "Delete :NSAppTransportSecurity:NSExceptionDomains" 2>/dev/null || true
          pb "Add :NSAppTransportSecurity:NSExceptionDomains dict"
          pb "Add :NSAppTransportSecurity:NSExceptionDomains:geo.lumentest dict"
          pb "Add :NSAppTransportSecurity:NSExceptionDomains:geo.lumentest:NSExceptionAllowsInsecureHTTPLoads bool true"
          pb "Add :NSAppTransportSecurity:NSExceptionDomains:account.lumentest dict"
          pb "Add :NSAppTransportSecurity:NSExceptionDomains:account.lumentest:NSExceptionAllowsInsecureHTTPLoads bool true"
      # The keys documents of rights are trusted by, as the Mac release takes them (scripts/build-app.sh):
      #   xcodebuild … -configuration Release ENTITLEMENT_PUBLIC_KEYS="<key id>=<base64>[,<key id>=<base64>]"
      # (`lumen-api pubkey` on the owner's server). A Release build that is given none stops here: it
      # could sign nobody in. A Debug build needs none.
      - name: "The keys of the documents of rights (ENTITLEMENT_PUBLIC_KEYS)"
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          keys="${ENTITLEMENT_PUBLIC_KEYS:-}"
          if [ -z "$keys" ]; then
            [ "$CONFIGURATION" = "Release" ] || exit 0
            echo "error: a Release build needs ENTITLEMENT_PUBLIC_KEYS=<key id>=<base64>[,...]: the owner's key(s), the same as the Mac release's (lumen-api pubkey)" >&2
            exit 1
          fi
          plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          /usr/libexec/PlistBuddy -c "Delete :PBEntitlementPublicKeys" "$plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :PBEntitlementPublicKeys dict" "$plist"
          old_ifs="$IFS"; IFS=','
          for entry in $keys; do
            id="${entry%%=*}"; key="${entry#*=}"
            /usr/libexec/PlistBuddy -c "Add :PBEntitlementPublicKeys:$id string $key" "$plist"
          done
          IFS="$old_ifs"
  LumenUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: LumenUITests
    dependencies:
      - target: Lumen
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.lumenbrowser.ios.uitests
        TEST_TARGET_NAME: Lumen
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Lumen:
    build:
      targets:
        Lumen: all
        LumenUITests: [test]
    test:
      config: Debug
      targets:
        - LumenUITests
