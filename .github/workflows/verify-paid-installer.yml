name: Paid website installer 0.1.20
on:
  push:
    branches: [codex/verify-paid-installer-0.1.20]
permissions: {}
jobs:
  production-download:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check official website with the Lumen production test account
        env:
          TEST_EMAIL: ${{ secrets.LUMEN_E2E_EMAIL }}
          TEST_PASSWORD: ${{ secrets.LUMEN_E2E_PASSWORD }}
        shell: python
        run: |
          import hashlib, json, os, urllib.parse, urllib.request, urllib.error
          site = 'https://lumenbrowser.io'
          api = 'https://api.lumenbrowser.io/v1'
          checksum = '95c090fde7655e21e1e35f912fbb30d8b26574f37077214996ec1a1a3c8145b3'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args): return None
          client = urllib.request.build_opener(NoRedirect())
          def post(url, body, content_type, token=None):
              headers = {'User-Agent': 'Lumen', 'Origin': site, 'Content-Type': content_type}
              if token: headers['Authorization'] = 'Bearer ' + token
              req = urllib.request.Request(url, data=body, headers=headers, method='POST')
              return client.open(req, timeout=90)
          def installer(fields):
              return post(site+'/installer', urllib.parse.urlencode(fields).encode(), 'application/x-www-form-urlencoded')
          import time
          for attempt in range(65):
              req=urllib.request.Request(site+'/en/download?release=0.1.20', headers={'User-Agent':'Lumen', 'Cache-Control':'no-cache'})
              with client.open(req,timeout=10) as page:
                  ready = b'data-installer="0.1.20"' in page.read()
              if ready:
                  try:
                      with installer({'key':'invalid-release-check'}): pass
                  except urllib.error.HTTPError as e:
                      if e.code == 403: break
              time.sleep(5)
          else: raise RuntimeError('Production website has not switched to 0.1.20')
          try:
              with installer({}): raise RuntimeError('missing credentials accepted')
          except urllib.error.HTTPError as e:
              assert e.code == 401, 'unexpected signed-out status '+str(e.code)
          print('Signed-out request refused with HTTP 401')
          with post(api+'/auth/login', json.dumps({'email': os.environ['TEST_EMAIL'], 'password': os.environ['TEST_PASSWORD']}).encode(), 'application/json') as r:
              session = json.load(r).get('sessionToken')
              assert session, 'Test account sign-in needs another factor'
          try:
              req = urllib.request.Request(api+'/account',headers={'Authorization':'Bearer '+session,'User-Agent':'Lumen'})
              with client.open(req,timeout=20) as r:
                  license = json.load(r)['license']
                  print('Production test license:',license.get('plan'),license.get('status'))
                  assert license.get('plan') in ('personal','pro','team') and license.get('status')=='active', 'Test account has no current paid plan'
              with installer({'session': session, 'lang':'ru', 'view':'page'}) as page:
                  assert page.status == 200 and 'no-store' in page.headers.get('Cache-Control','')
                  html = page.read().decode()
                  assert 'Lumen-0.1.20.dmg' in html and checksum in html
              print('Paid page served by production')
              with installer({'session':session}) as image:
                  assert image.status == 200 and 'no-store' in image.headers.get('Cache-Control','')
                  assert image.headers.get('Content-Disposition','').endswith('"Lumen-0.1.20.dmg"')
                  digest = hashlib.sha256()
                  size = 0
                  while block := image.read(1024*1024):
                      digest.update(block)
                      size += len(block)
                  assert size == 48948659 and digest.hexdigest() == checksum, 'Paid file mismatch'
                  print('Production paid download verified',size,digest.hexdigest())
          finally:
              with post(api+'/auth/logout',b'{}','application/json',session): pass
      - name: Prepare the browser driver
        run: npm install --no-audit --no-fund --ignore-scripts playwright-core@1.58.2
      - name: Sign in and download using the actual website buttons
        env:
          TEST_EMAIL: ${{ secrets.LUMEN_E2E_EMAIL }}
          TEST_PASSWORD: ${{ secrets.LUMEN_E2E_PASSWORD }}
        run: |
          export CHROME_BIN="$(command -v google-chrome)"
          node --input-type=module <<'JS'
          import { chromium } from 'playwright-core';
          import { createHash } from 'node:crypto';
          import assert from 'node:assert/strict';
          const browser = await chromium.launch({executablePath:process.env.CHROME_BIN});
          const context = await browser.newContext({acceptDownloads:true, locale:'ru-RU'});
          const page = await context.newPage();
          page.on('request', async r=>{
            if (new URL(r.url()).pathname!='/installer') return;
            const headers=await r.allHeaders();
            const body=new URLSearchParams(r.postData()||'');
            console.log('Installer request',r.method(),body.get('view')||'file','session present',Boolean(body.get('session')),'origin',headers.origin,'fetch-site',headers['sec-fetch-site']);
          });
          page.on('response',r=>{
            const path=new URL(r.url()).pathname;
            if(path==='/installer'||path==='/assets/installer.js') console.log('Installer response',path,r.status(),r.headers()['content-type'],r.headers()['content-disposition']||'no attachment');
          });
          page.on('requestfailed',r=>{if(new URL(r.url()).pathname==='/installer') console.log('Installer navigation ended:',r.failure()?.errorText);});
          page.on('pageerror',e=>console.log('Browser script exception',e.name));
          let token;
          try {
            await page.goto('https://lumenbrowser.io/ru/login', {waitUntil:'domcontentloaded'});
            assert.equal(new URL(page.url()).origin,'https://lumenbrowser.io');
            await page.locator('#email').fill(process.env.TEST_EMAIL);
            await page.locator('#password').fill(process.env.TEST_PASSWORD);
            await page.locator('form').filter({has:page.locator('#password')}).locator('button[type=submit]').click();
            await page.waitForURL(/\/ru\/account(?:\.html)?(?:[?#]|$)/,{timeout:25000});
            token = await page.evaluate(()=>JSON.parse(sessionStorage.getItem('lumen-session')).token);
            assert.ok(token);
            await page.locator('[data-get] a.primary').click();
            await page.locator('[data-installer="0.1.20"]').click();
            await page.getByRole('heading',{name:'Загрузка Lumen для Mac'}).waitFor();
            const [download] = await Promise.all([page.waitForEvent('download',{timeout:60000}),page.getByRole('button',{name:'Скачать установщик'}).click()]);
            assert.equal(download.suggestedFilename(),'Lumen-0.1.20.dmg');
            const hash=createHash('sha256');
            let size=0;
            for await(const chunk of await download.createReadStream()) { size+=chunk.length;hash.update(chunk); }
            assert.equal(size,48948659);
            assert.equal(hash.digest('hex'),'95c090fde7655e21e1e35f912fbb30d8b26574f37077214996ec1a1a3c8145b3');
            console.log('Browser passed: sign-in form, account button, protected installer page, signed DMG downloaded and verified.');
          } finally {
            if(token) await context.request.post('https://api.lumenbrowser.io/v1/auth/logout',{headers:{Authorization:'Bearer '+token},data:{},maxRedirects:0});
            await browser.close();
          }
          JS
