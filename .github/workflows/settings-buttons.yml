name: Native Safari settings buttons
on:
  push:
    branches: [codex/settings-click-audit]
permissions:
  contents: read
jobs:
  controls:
    strategy:
      fail-fast: false
      matrix:
        runner: [xcode-27, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {path: qa, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {path: app, ref: f2b2fcb58f9e51e56b834a38fd980e9938d6d1f8, persist-credentials: false}
      - name: Instrument disposable build
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Sources/PrivacyBrowser/Browser/WindowProbe.swift')
          s=p.read_text(); needle='                checked.append(label)'; assert s.count(needle)==1
          p.write_text(s.replace(needle,Path('../qa/checks/settings-buttons.swift.txt').read_text()+needle))
          e=Path('Sources/PrivacyBrowser/Browser/ProfileProcess.swift')
          s=e.read_text(); k='static let inheritedEnvironment: Set<String> = ['; assert s.count(k)==1
          e.write_text(s.replace(k, k+'"LUMEN_QA_SKIP",'))
          r=Path('Sources/PrivacyBrowser/App/ReleaseCheck.swift')
          s=r.read_text().replace('addingTimeInterval(25)','addingTimeInterval(300)')
          r.write_text(s)
          PY
          ACCOUNT_SERVER_URL=https://example.invalid ENTITLEMENT_PUBLIC_KEYS="63a9a50f8cc6f129=bOCnaE4nVmmeqieu9CNIo0AY86OOYqe65OwSJbTwYn0=" CONFIG=debug OVPN=0 XRAY=0 VM=0 NE=0 CAM=0 SANDBOX=0 APP_DIR=build/button-audit scripts/build-app.sh
      - name: Press settings controls
        working-directory: app
        timeout-minutes: 24
        run: |
          python3 ../qa/checks/settings-sweep.py build/button-audit/Lumen.app/Contents/MacOS/Lumen
          grep '^BUTTON ' buttons.log
          grep '^RELEASE-CHECK .*Safari Settings:' buttons.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settings-${{ matrix.runner }}
          path: |
            app/buttons.log
            app/stack-*.log
