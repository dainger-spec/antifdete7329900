name: iOS app (stage 2)

# Lumen for iPhone (claude/ios-app, never merged): the core's tests, then the end-to-end tests of a
# person's path on the iOS Simulator — every planted fault in ios/scripts/faults.tsv first (each must
# make its test fail), then the green run. Screenshots of what the tests saw are in the artifact.
# The minimum-version check (does not install below iOS 18) is ios-floor.yml.
on:
  push:
    branches: [claude/ios-app]
    paths:
      - "ios/**"
      - "!ios/scripts/install-floor.sh"
      - "!ios/**/*.md"
  workflow_dispatch:
    inputs:
      os:
        description: runner image
        default: xcode-27
      ios:
        description: iOS runtime (newest, or a version such as 17.5)
        default: newest
      suite:
        description: one suite only — "core" (the core's tests alone, a few minutes), "core,build" (and the app built), or a test class; empty runs them all. "RealServerTests" — the sign-in against the real account server with the test account (secrets LUMEN_E2E_EMAIL, LUMEN_E2E_PASSWORD); by hand only
        default: ""

jobs:
  app:
    # Six jobs side by side, each with its own simulator and testbed; each keeps the order — the
    # reds of its suite first, then its green run.
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(inputs.suite && format('["{0}"]', inputs.suite) || '["core,SessionsTests,ProxyCheckTests,FreeTierTests,LanguageTests", "BrowserTests", "ProxyTests", "SettingsTests", "RelayTests", "AccountTests"]') }}
    name: Lumen iOS — ${{ matrix.suite }} (${{ inputs.os || 'xcode-27' }}, iOS ${{ inputs.ios || 'newest' }})
    runs-on: ${{ inputs.os || 'xcode-27' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      # The real account server, by hand only: the protocol first (a minute), then the app itself.
      # The test account is the repository's secret; no other suite is given it.
      - name: The real account server — sign-in, document, renewal, sign-out
        if: matrix.suite == 'RealServerTests'
        env:
          LUMEN_E2E_EMAIL: ${{ secrets.LUMEN_E2E_EMAIL }}
          LUMEN_E2E_PASSWORD: ${{ secrets.LUMEN_E2E_PASSWORD }}
        run: |
          set -o pipefail
          mkdir -p build/ios-app
          python3 ios/scripts/real_server.py | tee build/ios-app/real-server.txt
      - name: Build and test (red runs first)
        env:
          SUITE: ${{ matrix.suite }}
          TEST_RUNNER_LUMEN_E2E_EMAIL: ${{ matrix.suite == 'RealServerTests' && secrets.LUMEN_E2E_EMAIL || '' }}
          TEST_RUNNER_LUMEN_E2E_PASSWORD: ${{ matrix.suite == 'RealServerTests' && secrets.LUMEN_E2E_PASSWORD || '' }}
          TEST_RUNNER_LUMEN_E2E_REQUIRED: ${{ matrix.suite == 'RealServerTests' && '1' || '' }}
        run: ios/scripts/ci.sh build/ios-app "${{ inputs.ios || 'newest' }}"
      # The repository is public, and an artifact is not masked the way the log is: before anything
      # of the real server's run is uploaded, the test account's address and password are wiped from
      # every file, and what could picture them (screenshots, the testbed's records) is left out.
      - name: Wipe the test account from what is uploaded
        if: always() && matrix.suite == 'RealServerTests'
        env:
          LUMEN_E2E_EMAIL: ${{ secrets.LUMEN_E2E_EMAIL }}
          LUMEN_E2E_PASSWORD: ${{ secrets.LUMEN_E2E_PASSWORD }}
        run: |
          rm -rf build/ios-app/screens build/ios-app/testbed
          python3 ios/scripts/wipe_secrets.py build/ios-app LUMEN_E2E_EMAIL LUMEN_E2E_PASSWORD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          # What a person needs to see why a check failed: the logs, the testbed's events and the
          # screenshots — not the result bundles (over a gigabyte).
          name: ios-app-${{ github.run_number }}-${{ strategy.job-index }}
          path: |
            build/ios-app/*.txt
            build/ios-app/*.log
            build/ios-app/testbed
            build/ios-app/screens
          if-no-files-found: warn
