# claude/measure-automation-input — never merged. What a page sees of input an app sends into its
# own web view, by each route (AppKit to the window or the view, Quartz into the view, posted to the
# process, posted at the HID level) and in each window state (key, another window key, another app
# active, off every screen) — before the automation's shared mechanism is chosen (the lead, 9 November).
name: Automation input routes (measurement)
on:
  push:
    branches: ['claude/measure-automation-input']
jobs:
  measure:
    name: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, xcode-27]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: The machine
        run: sw_vers; system_profiler SPDisplaysDataType | grep -E "Resolution|Display Type|Main Display" || true
      - name: Input routes × window states
        if: false
        timeout-minutes: 15
        run: |
          mkdir -p out build/AIProbe.app/Contents/MacOS out
          swiftc -o build/AIProbe.app/Contents/MacOS/ai-probe measure/automation_input/probe.swift
          printf '%s' '<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd"><plist version="1.0"><dict><key>CFBundleIdentifier</key><string>io.lumenbrowser.measure.aiprobe</string><key>CFBundleExecutable</key><string>ai-probe</string><key>CFBundleName</key><string>AIProbe</string><key>CFBundlePackageType</key><string>APPL</string><key>NSPrincipalClass</key><string>NSApplication</string></dict></plist>' > build/AIProbe.app/Contents/Info.plist
          codesign -s - --force build/AIProbe.app
          build/AIProbe.app/Contents/MacOS/ai-probe "$PWD/measure/automation_input/page.html" > out/probe.txt 2>&1 || echo "probe exited $?"
          python3 measure/automation_input/analyse.py out/probe.txt
      - name: Round 2 — the window route with each fix, and the focus answered in this process
        if: false
        timeout-minutes: 15
        run: |
          mkdir -p out build/AIProbe2.app/Contents/MacOS
          swiftc -o build/AIProbe2.app/Contents/MacOS/ai-probe2 measure/automation_input/probe2.swift
          printf '%s' '<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd"><plist version="1.0"><dict><key>CFBundleIdentifier</key><string>io.lumenbrowser.measure.aiprobe2</string><key>CFBundleExecutable</key><string>ai-probe2</string><key>CFBundleName</key><string>AIProbe2</string><key>CFBundlePackageType</key><string>APPL</string><key>NSPrincipalClass</key><string>NSApplication</string></dict></plist>' > build/AIProbe2.app/Contents/Info.plist
          codesign -s - --force build/AIProbe2.app
          build/AIProbe2.app/Contents/MacOS/ai-probe2 "$PWD/measure/automation_input/page.html" > out/probe2.txt 2>&1 || echo "probe2 exited $?"
          python3 measure/automation_input/analyse2.py out/probe2.txt
      - name: Round 3 — wheel place, first click in the background, moves with the cursor away, a covered window
        if: false
        timeout-minutes: 15
        run: |
          mkdir -p out build/AIProbe3.app/Contents/MacOS
          swiftc -o build/AIProbe3.app/Contents/MacOS/ai-probe3 measure/automation_input/probe3.swift
          printf '%s' '<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd"><plist version="1.0"><dict><key>CFBundleIdentifier</key><string>io.lumenbrowser.measure.aiprobe3</string><key>CFBundleExecutable</key><string>ai-probe3</string><key>CFBundleName</key><string>AIProbe3</string><key>CFBundlePackageType</key><string>APPL</string><key>NSPrincipalClass</key><string>NSApplication</string></dict></plist>' > build/AIProbe3.app/Contents/Info.plist
          codesign -s - --force build/AIProbe3.app
          build/AIProbe3.app/Contents/MacOS/ai-probe3 "$PWD/measure/automation_input/page.html" > out/probe3.txt 2>&1 || echo "probe3 exited $?"
          python3 measure/automation_input/analyse2.py out/probe3.txt
      - name: Round 4 — the pointer's place and the wheel's window answered in this process
        if: false
        timeout-minutes: 15
        run: |
          mkdir -p out build/AIProbe4.app/Contents/MacOS
          swiftc -o build/AIProbe4.app/Contents/MacOS/ai-probe4 measure/automation_input/probe4.swift
          printf '%s' '<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd"><plist version="1.0"><dict><key>CFBundleIdentifier</key><string>io.lumenbrowser.measure.aiprobe4</string><key>CFBundleExecutable</key><string>ai-probe4</string><key>CFBundleName</key><string>AIProbe4</string><key>CFBundlePackageType</key><string>APPL</string><key>NSPrincipalClass</key><string>NSApplication</string></dict></plist>' > build/AIProbe4.app/Contents/Info.plist
          codesign -s - --force build/AIProbe4.app
          build/AIProbe4.app/Contents/MacOS/ai-probe4 "$PWD/measure/automation_input/page.html" > out/probe4.txt 2>&1 || echo "probe4 exited $?"
          python3 measure/automation_input/analyse2.py out/probe4.txt
      - name: Round 5 — moves to the tracking area's owner, the wheel at the window's own point
        timeout-minutes: 15
        run: |
          mkdir -p out build/AIProbe5.app/Contents/MacOS
          swiftc -o build/AIProbe5.app/Contents/MacOS/ai-probe5 measure/automation_input/probe5.swift
          printf '%s' '<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd"><plist version="1.0"><dict><key>CFBundleIdentifier</key><string>io.lumenbrowser.measure.aiprobe5</string><key>CFBundleExecutable</key><string>ai-probe5</string><key>CFBundleName</key><string>AIProbe5</string><key>CFBundlePackageType</key><string>APPL</string><key>NSPrincipalClass</key><string>NSApplication</string></dict></plist>' > build/AIProbe5.app/Contents/Info.plist
          codesign -s - --force build/AIProbe5.app
          build/AIProbe5.app/Contents/MacOS/ai-probe5 "$PWD/measure/automation_input/page.html" > out/probe5.txt 2>&1 || echo "probe5 exited $?"
          python3 measure/automation_input/analyse2.py out/probe5.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automation-input-${{ matrix.runner }}
          path: out
