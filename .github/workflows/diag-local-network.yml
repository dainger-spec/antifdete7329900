name: diag — who brings up the local network question
# A diagnosis, on a scratch branch only (the full pipeline, 14 November). The second run of this
# found the window after DirectConnectorTests' test of private addresses alone, which on a Mac
# opens no socket but its own — and reads address literals through the system's resolver. Here,
# with the literals read as written: that test alone, every test as the pipeline runs them, and
# the resolver asked one literal of a local network on a runner of its own (the cause, shown).
on:
  push:
    branches: ['claude/zen-bohr-2xzxfp']
jobs:
  diag:
    runs-on: macos-26
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        what: [private-fixed, every-test, resolver-literal, resolver-literal-numeric]
    steps:
      - uses: actions/checkout@v4
      - name: The windows before
        run: |
          mkdir -p shots
          cat > /tmp/windows.swift <<'SWIFT'
          import CoreGraphics
          import Foundation
          let list = CGWindowListCopyWindowInfo([.optionOnScreenOnly], kCGNullWindowID) as? [[String: Any]] ?? []
          for window in list {
              let owner = window[kCGWindowOwnerName as String] as? String ?? "?"
              let layer = window[kCGWindowLayer as String] as? Int ?? 0
              if layer > 2_000_000_000 { continue }
              print("WINDOW \(owner) | layer \(layer)")
          }
          SWIFT
          swiftc -O /tmp/windows.swift -o /tmp/windows
          cat > /tmp/resolve.swift <<'SWIFT'
          import Darwin
          // getaddrinfo of one address literal of a local network, AF_UNSPEC; with "numeric", as written.
          var hints = addrinfo()
          hints.ai_family = AF_UNSPEC
          hints.ai_socktype = SOCK_STREAM
          hints.ai_flags = CommandLine.arguments.contains("numeric") ? (AI_NUMERICSERV | AI_NUMERICHOST) : AI_NUMERICSERV
          for host in ["192.168.1.10", "169.254.169.254"] {
              var list: UnsafeMutablePointer<addrinfo>?
              print(host, getaddrinfo(host, "80", &hints, &list))
              if list != nil { freeaddrinfo(list) }
          }
          SWIFT
          swiftc -O /tmp/resolve.swift -o /tmp/resolve
          sleep 5
          echo "== before"; /tmp/windows | sort | uniq -c
      - name: What is tried
        run: |
          date -u +%T
          case '${{ matrix.what }}' in
            private-fixed) swift test --filter 'DirectConnectorTests/testAPrivateAddressIsTakenOnlyWhereItGoesIntoATunnel' 2>&1 | grep -E 'Executed [0-9]+ tests|error:' | tail -3 ;;
            every-test) swift test 2>&1 | grep -E 'Executed [0-9]+ tests|error:' | tail -3 ;;
            resolver-literal) /tmp/resolve ;;
            resolver-literal-numeric) /tmp/resolve numeric ;;
          esac
          date -u +%T
          sleep 20
          echo "== after"; /tmp/windows | sort | uniq -c
          if /tmp/windows | grep -q UserNotificationCenter; then echo "VERDICT ${{ matrix.what }}: THE QUESTION IS ON SCREEN"; else echo "VERDICT ${{ matrix.what }}: no question"; fi
          screencapture -x "shots/${{ matrix.what }}.png"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag-${{ matrix.what }}
          path: shots
