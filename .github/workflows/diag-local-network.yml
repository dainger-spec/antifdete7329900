name: diag — who brings up the local network question
# A diagnosis, on a scratch branch only: which test makes macOS ask the runner's person "Allow … to
# find devices on local networks?" (the full pipeline, 14 November). The first run of this found
# the window after the eighth of DirectConnectorTests; here each suspect runs alone on a runner of
# its own, and the windows are listed fifteen seconds after it.
on:
  push:
    branches: ['claude/zen-bohr-2xzxfp']
jobs:
  diag:
    runs-on: macos-26
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: nowhere
            args: "--filter DirectConnectorTests/testADestinationThatIsNotThereIsRefusedAtOnce"
          - name: private
            args: "--filter DirectConnectorTests/testAPrivateAddressIsTakenOnlyWhereItGoesIntoATunnel"
          - name: proxy-gone
            args: "--filter DirectConnectorTests/testAProxyThatRefusesOrIsNotThereIsSaidSo"
          - name: first-others
            args: "--filter DirectConnectorTests/(testAConnectionIsCarried|testAFailureSays|testAGuestWithoutAProxy|testALocalAddressIsToldApart|testANameIsResolved)"
          - name: all-but-the-first-eight
            args: "--skip DirectConnectorTests/(testAConnectionIsCarried|testADestinationThatIsNotThere|testAFailureSays|testAGuestWithoutAProxy|testALocalAddressIsToldApart|testANameIsResolved|testAPrivateAddressIsTaken|testAProxyThatRefuses)"
    steps:
      - uses: actions/checkout@v4
      - name: The tests built, and the windows before
        run: |
          mkdir -p shots
          cat > /tmp/windows.swift <<'SWIFT'
          import CoreGraphics
          import Foundation
          let list = CGWindowListCopyWindowInfo([.optionOnScreenOnly], kCGNullWindowID) as? [[String: Any]] ?? []
          for window in list {
              let owner = window[kCGWindowOwnerName as String] as? String ?? "?"
              let layer = window[kCGWindowLayer as String] as? Int ?? 0
              if layer > 2_000_000_000 { continue }
              print("WINDOW \(owner) | layer \(layer)")
          }
          SWIFT
          swiftc -O /tmp/windows.swift -o /tmp/windows
          swift build --build-tests 2>&1 | tail -1
          sleep 10
          echo "== before"; /tmp/windows | sort | uniq -c
          /tmp/windows | grep -c UserNotificationCenter || true
      - name: The suspect, alone
        run: |
          date -u +%T
          swift test --skip-build ${{ matrix.args }} 2>&1 | grep -E "Executed [0-9]+ tests|error:" | tail -3 || true
          date -u +%T
          sleep 15
          echo "== after ${{ matrix.name }}"; /tmp/windows | sort | uniq -c
          if /tmp/windows | grep -q UserNotificationCenter; then echo "VERDICT ${{ matrix.name }}: THE QUESTION IS ON SCREEN"; else echo "VERDICT ${{ matrix.name }}: no question"; fi
          screencapture -x "shots/${{ matrix.name }}.png"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag-${{ matrix.name }}
          path: shots
