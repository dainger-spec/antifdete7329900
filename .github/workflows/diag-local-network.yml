name: diag — who brings up the local network question
# A diagnosis, on a scratch branch only: which step of the pipeline's start makes macOS ask the
# runner's person "Allow … to find devices on local networks?" (the full pipeline, 14 November).
# The windows on screen are listed after each step and each VMNetCore test; a change names it.
on:
  push:
    branches: ['claude/zen-bohr-2xzxfp']
jobs:
  diag:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: The windows at the start
        run: |
          mkdir -p shots
          cat > /tmp/windows.swift <<'SWIFT'
          import CoreGraphics
          import Foundation
          let list = CGWindowListCopyWindowInfo([.optionOnScreenOnly], kCGNullWindowID) as? [[String: Any]] ?? []
          for window in list {
              let owner = window[kCGWindowOwnerName as String] as? String ?? "?"
              let layer = window[kCGWindowLayer as String] as? Int ?? 0
              let bounds = window[kCGWindowBounds as String] as? [String: Any] ?? [:]
              print("WINDOW \(owner) | layer \(layer) | \(bounds["Width"] ?? 0)x\(bounds["Height"] ?? 0)")
          }
          SWIFT
          swiftc -O /tmp/windows.swift -o /tmp/windows
          echo "== at the start"; /tmp/windows | sort | uniq -c
          screencapture -x shots/0-start.png
      - name: The tests built
        run: |
          swift build --build-tests 2>&1 | tail -2
          echo "== after the build"; /tmp/windows | sort | uniq -c
          screencapture -x shots/1-built.png
      - name: Each VMNetCore test, and the windows after it
        run: |
          swift test list --skip-build 2>/dev/null | grep '^VMNetCoreTests\.' > /tmp/tests.txt || true
          wc -l < /tmp/tests.txt
          before="$(/tmp/windows | sort | uniq -c)"
          n=0
          while read -r name; do
            swift test --skip-build --filter "^${name}\$" >/dev/null 2>&1 || echo "FAILED $name"
            now="$(/tmp/windows | sort | uniq -c)"
            if [ "$now" != "$before" ]; then
              n=$((n + 1))
              echo "CHANGED AFTER $name"
              diff <(echo "$before") <(echo "$now") || true
              screencapture -x "shots/2-after-$n.png"
              before="$now"
            fi
          done < /tmp/tests.txt
          echo "== after the VMNetCore tests"; /tmp/windows | sort | uniq -c
      - name: The machines' tests of the core
        run: |
          swift test --skip-build --filter 'VMGuestScriptTests|VMProfileTests|VMGuestToolsTests|VMLibraryTests|VMDownloadTests' >/dev/null 2>&1 || echo "a test failed"
          echo "== after the machines' core tests"; /tmp/windows | sort | uniq -c
          screencapture -x shots/3-vm-core.png
      - name: Every test
        run: |
          swift test --skip-build >/dev/null 2>&1 || echo "a test failed"
          echo "== after every test"; /tmp/windows | sort | uniq -c
          screencapture -x shots/4-all-tests.png
      - name: The build with the machines' helper
        run: |
          VM=check SANDBOX=0 scripts/build-app.sh >/dev/null 2>&1; echo "build status $?"
          echo "== after the build with VM=check"; /tmp/windows | sort | uniq -c
          screencapture -x shots/5-vm-check.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag-shots
          path: shots
