# claude/measure-disguise-e2e — a measurement branch, never merged: a person's path in an iPhone
# view with the full disguise (the default since 8 November): the same mouse clicks in it, in an
# iPhone view without the disguise ("no script's trace") and in a Mac profile; per site, the input
# listeners the page adds, what each click brings it, and whether it acts. tiktok.com, Google,
# m.youtube.com and the check's own page.
name: iPhone full disguise, a person's path (measurement)
on:
  push:
    branches: ['claude/measure-disguise-e2e']
jobs:
  input:
    name: Input — ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, xcode-27]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: The machine
        run: |
          sw_vers
          defaults read /Applications/Safari.app/Contents/Info.plist CFBundleShortVersionString || true
      - name: Build the app without the App Sandbox (profiles in processes of their own)
        timeout-minutes: 30
        run: NE=check SANDBOX=0 APP_DIR=build/unsandboxed scripts/build-app.sh
      - name: Clicks — the check's page, tiktok.com, Google, m.youtube.com — full disguise, without it, and in a Mac profile
        timeout-minutes: 80
        run: |
          python3 scripts/input_check.py --app build/unsandboxed/Lumen.app --out build/input \
            --profiles mobile,mobile-engine,mac \
            --sites 'pb-test:touch,https://www.tiktok.com/,https://www.google.com/search?q=lumen,https://m.youtube.com/'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: disguise-e2e-${{ matrix.runner }}
          path: build/input
          if-no-files-found: warn
