name: CI — full

# The full pipeline (the owner, 3 November): every check, measurement, inventory and snapshot, on
# macOS 26 and 27 — once a day, on request (Actions › CI — full › Run workflow), and on a pushed tag
# full/<anything>, which runs it on that tag's commit: `git tag full/<sha12> <sha> && git push origin
# full/<sha12>`. release.sh releases only a commit this pipeline passed (scripts/full_run_gate.py).
# The fast pipeline (.github/workflows/ci.yml) runs on every push; everything it checks is here too
# (scripts/check_ci_split.py).
# GitHub starts a schedule only from the repository's default branch, and with that branch's code: the
# same file is on it (claude/macos-privacy-browser-prototype-0ns2oj, the owner, 4 November), and there
# the schedule only starts this pipeline on claude/redesign (the job `nightly`): the checks then run on
# that branch's newest commit, as a run of its own on that commit, which release.sh's gate counts. On
# a schedule every other job is skipped; on request or on a tag the checks run on the commit asked for.
on:
  workflow_dispatch:
  schedule:
    - cron: '41 1 * * *'
  push:
    tags: ['full/**']

env:
  # The self-test's checks a GitHub runner cannot make, by the beginnings of their names: no real
  # key event reaches a page there (a person's typing into AutoFill is not shown; the AutoFill
  # world is driven directly), and Safari fetches neither a page's touch icon nor its OpenSearch
  # description there. Each is still a SKIP line with its reason and in the summary; under
  # PB_SELFTEST_STRICT any other check skipped on the runner fails the step.
  # And no ad hoc signature opens the data-protection keychain, even with the app group (run 646):
  # the keychain between profiles is shown on the build signed for release (release.sh's release
  # check), here only the entitlements are.
  # No geolocation service is asked unless a check sets one (ProxyGeoLookup.services): a profile
  # with no proxy follows where it exits, and the runners keep GMT while their address is elsewhere.
  PB_GEO_SERVICES_OFF: "1"
  PB_SELFTEST_EXPECTED_SKIPS: "passwords: a person's own clicks and keys|ended page: an iPhone view's page, loaded: the page gets a click|ended page: after Reload, the cover hidden again: the page gets a click|Safari chrome: its touch icon|Safari chrome: its OpenSearch description|keychain between profiles"


jobs:
  nightly:
    # The schedule's own run, from the default branch: it starts this pipeline on claude/redesign (a
    # workflow_dispatch made with this run's token starts a run, unlike other events it makes), and
    # does nothing else. That run checks claude/redesign's newest commit under its own SHA.
    name: The nightly run, started on claude/redesign
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Start the full pipeline on claude/redesign
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run full.yml --repo "$GITHUB_REPOSITORY" --ref claude/redesign
          echo "started on claude/redesign, at $(gh api "repos/$GITHUB_REPOSITORY/commits/claude/redesign" --jq .sha)"
  core-linux:
    if: github.event_name != 'schedule'
    name: Core tests (Linux, swift-crypto)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - run: swift test

  shims:
    if: github.event_name != 'schedule'
    name: JavaScript shim tests (Node)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: TZ=America/New_York node scripts/test-shims.mjs
      # The same tests under JavaScriptCore, the engine Safari runs: own-property order, error
      # messages and function text differ from V8 in ways a page can see.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - run: TZ=America/New_York bun scripts/test-shims.mjs
      # ru and en hold the same keys with the same format specifiers, every L("key") exists, and no
      # text a user reads is written into the code (scripts/check_localization.py).
      - name: Localization is complete in both languages
        run: python3 scripts/check_localization.py
      # Nothing of the user's (profile names, proxy hosts, addresses, paths, error texts) is
      # written to the system log in clear (scripts/check_log_privacy.py).
      - name: Log lines keep the user's data private
        run: python3 scripts/check_log_privacy.py
      # No check of the self-test stops after a note without skip() or check(): a check that
      # cannot be made is a counted SKIP, never a quiet INFO (scripts/check_selftest_skips.py).
      - name: The self-test never stops a check quietly
        run: python3 scripts/check_selftest_skips.py
      # Nothing in the app asks the system to open an address, a file or an app except through
      # SystemOpen, which a profile's process is refused (scripts/check_system_opens.py). Its
      # self-check first: the scan must find each forbidden form planted for it.
      - name: Nothing is handed to the system except through SystemOpen
        run: python3 scripts/check_system_opens.py --self-check && python3 scripts/check_system_opens.py
      # A profile's data is deleted by one path, called only from the person's Delete: not signing
      # out, not another account, not a sync (the owner, 3 November; scripts/check_deletion_paths.py).
      - name: Deletion paths — a profile's data only by the person's Delete
        run: python3 scripts/check_deletion_paths.py --self-check && python3 scripts/check_deletion_paths.py
      # A license key bought without registration is the whole account: its text, and the server's
      # tokens', come out only where a request or the vault needs them (scripts/check_account_key.py).
      - name: The account's key and tokens are text only where they must be
        run: python3 scripts/check_account_key.py --self-check && python3 scripts/check_account_key.py
      # A release's publication on dl.lumenbrowser.io (scripts/r2_publish.sh), against a local R2 that
      # checks every request's signature and every upload's SHA-256 as R2 does: uploaded, read back
      # from the public address and compared, a published version never replaced, R2's keys never on
      # curl's command line (scripts/test_r2_publish.sh). Then no secret of a release in the
      # repository (scripts/check_secrets.py): its planted ones found first.
      - name: A release's publication, download.json as the website reads it, the site's minimum macOS, and no secret in the repository
        run: scripts/test_r2_publish.sh && scripts/test_download_json.sh && scripts/test_site_minimum.sh && scripts/test_safari_reference.sh && python3 scripts/check_secrets.py --self-check && python3 scripts/check_secrets.py
      # The two pipelines as the owner set them (3 November): ci.yml once per commit, only checks that
      # fail it; full.yml daily, on request and on a tag full/…, every check of the fast one besides its
      # own (scripts/check_ci_split.py, its planted faults found first).
      - name: The fast pipeline holds only checks that fail it, the full one every check of it
        run: python3 scripts/check_ci_split.py --self-check && python3 scripts/check_ci_split.py
      # release.sh releases only a commit the full pipeline passed: its gate against saved answers of
      # GitHub's API — none, running, failed, another commit, the fast pipeline's, not GitHub's: no.
      - name: A release only on a commit the full pipeline passed (its gate, against saved answers)
        run: scripts/test_full_run_gate.sh
      # No release while the server signs no automation into the documents of rights (the owner and
      # the lead, 9 November): the gate against made-up vectors — the decision shown: yes; the server's
      # vectors before the field and every departure from the decision: no — and release.sh, asked for
      # a signed release, stopping on the app's copy of the vectors while they show none.
      - name: No release while the server's vectors show no automation signed by plan (the gate and release.sh's stop)
        run: scripts/test_automation_plan_gate.sh

  macos-27:
    if: github.event_name != 'schedule'
    name: macOS 27 — the self-test on the newest macOS (preview image; fails the build only on a certificate fetched outside the proxy)
    # GitHub's xcode-27 image runs macOS 27.0.1 with Safari 27.0.1 and Xcode 27 (its SDK): what a
    # user who updated has. The macOS job below (macos-26) is the one that gates the build; this one
    # reports what changes on the next macOS before users meet it, and fails nothing but one thing:
    # this Mac fetching for a certificate outside a profile's proxy (scripts/certificate_leak_check.py).
    # Every other step goes on whatever it finds, and has a limit of its own, so that none can run
    # the job out of its time.
    runs-on: xcode-27
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: The machine
        continue-on-error: true
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          defaults read /Applications/Safari.app/Contents/Info.plist CFBundleShortVersionString || true
      - name: Build the app without the App Sandbox (the build that runs profiles in Safari's window)
        continue-on-error: true
        timeout-minutes: 30
        # NE=check: the app holds the app group, as an NE=1 build holds the app's keychain, and its
        # profiles must not (the self-test's keychain check).
        run: NE=check SANDBOX=0 APP_DIR=build/unsandboxed scripts/build-app.sh
      - name: The Settings window on macOS 27, as the person gets it (the control must fail)
        # The same check as the macOS 26 job's: SwiftUI's Settings scene drew the title bar's band in
        # another grey here, and hiding the toolbar did not take it away here (CI run 596).
        continue-on-error: true
        timeout-minutes: 10
        run: scripts/settings_window_check.sh build/unsandboxed/Lumen.app build/settings-window-27
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settings-window-macos27
          path: build/settings-window-27
          if-no-files-found: ignore
      - name: The disk image's window on macOS 27 — made here, does it show its picture? (reported)
        # As on macOS 26 (scripts/make_dmg.sh, scripts/dmg_window_shot.sh), on the macOS 0.1.1's image
        # was made on (the owner's Mac kept Finder's own icon view in it, no picture). Before the
        # self-test: in run 672 its permission dialogs (local network, microphone) were still on the
        # screen and covered a quarter of the window captured after it.
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        run: |
          mkdir -p build/egress27/dmg-window
          scripts/make_dmg.sh build/unsandboxed/Lumen.app build/dmg27/Lumen.dmg 2>&1 | tee build/egress27/dmg-window/make-dmg.txt
          scripts/dmg_window_shot.sh build/dmg27/Lumen.dmg build/egress27/dmg-window --both
      - name: Self-test against WebKit 27 (unsandboxed), inside a capture of every packet leaving the machine
        id: selftest27
        continue-on-error: true
        timeout-minutes: 45
        env:
          PB_SELFTEST_STRICT: "1"
          # The interface in Russian, this Mac's language English: the check of dates in the
          # person's language can only tell the two apart so. Until the interface took this Mac's
          # language (1 November) the self-test ran in Russian by the old default; run 594 then
          # skipped that check, which the strict run refuses.
          PRIVACYBROWSER_LANG: ru
        run: |
          set -o pipefail
          python3 scripts/selftest_proxy.py --http 18080 --socks 18081 --http-auth 18082 --http6 18083 --socks2 18084 --socks-auth 18085 \
            --tls-control 18086 --canary 18087 --silent 18088 --socks-udp 18089 &
          PROXY_PID=$!
          for attempt in $(seq 1 40); do nc -z 127.0.0.1 18081 && break; sleep 0.5; done
          export PB_SELFTEST_HTTP_PROXY_PORT=18080 PB_SELFTEST_SOCKS_PROXY_PORT=18081 PB_SELFTEST_HTTP_AUTH_PROXY_PORT=18082 PB_SELFTEST_HTTP6_PROXY_PORT=18083
          export PB_SELFTEST_SOCKS2_PROXY_PORT=18084 PB_SELFTEST_SOCKS_AUTH_PROXY_PORT=18085
          export PB_SELFTEST_TLS_CONTROL_PORT=18086 PB_SELFTEST_CANARY_PORT=18087 PB_SELFTEST_SILENT_PROXY_PORT=18088 PB_SELFTEST_SOCKS_UDP_PROXY_PORT=18089
          mkdir -p build/egress27
          export PB_SELFTEST_SHOTS="$PWD/build/egress27/history-shots"
          # The surfaces for the comparison with this Mac's Safari below.
          export PB_SELFTEST_SURFACE_OUT="$PWD/build/egress27/surface"
          sudo tcpdump -i pktap,all -k NP -n -tt -l 'not host 127.0.0.1 and not host ::1' \
            > build/egress27/capture.txt 2> build/egress27/tcpdump.err &
          sleep 2
          status=0
          build/unsandboxed/Lumen.app/Contents/MacOS/Lumen --self-test | tee build/egress27/selftest.txt || status=1
          sudo pkill -INT -f "tcpdump -i pktap" || true
          sleep 2
          kill $PROXY_PID || true
          echo "::group::egress capture"
          python3 scripts/egress_check.py --capture build/egress27/capture.txt \
            --selftest-log build/egress27/selftest.txt --tcpdump-errors build/egress27/tcpdump.err || status=1
          echo "::endgroup::"
          exit $status
      - name: A certificate fetched for outside a profile's proxy on macOS 27 (fails the build)
        # The self-test's AIA and OCSP canaries in its capture, its control seen; a run that cannot
        # tell runs the certificate check again alone, with names of its own; still nothing to tell
        # by fails too (scripts/certificate_leak_check.py). The one step of this job that fails it.
        if: always()
        timeout-minutes: 12
        run: |
          python3 scripts/certificate_leak_check.py --capture build/egress27/capture.txt \
            --selftest-log build/egress27/selftest.txt --app build/unsandboxed/Lumen.app \
            --out build/egress27/certificate-leak
      - name: What failed on macOS 27, and the certificate checks
        if: always()
        continue-on-error: true
        run: |
          log=build/egress27/selftest.txt
          grep -E '^(SELFTEST [A-Z]*:|INFO macOS|INFO WebKit [0-9])' $log 2>/dev/null | head -3 | sed 's/^/::notice title=macOS 27 self-test::/' || true
          grep '^FAIL' $log 2>/dev/null | head -7 | cut -c1-1500 | sed 's/^/::notice title=macOS 27 self-test - failed::/' || true
          grep '^SELFTEST SKIPPED' $log 2>/dev/null | cut -c1-600 | sed 's/^/::warning title=macOS 27 self-test - skipped::/' || true
          {
            echo "### Self-test on macOS 27"
            summary="$(grep -h "^SELFTEST [A-Z]*:" $log 2>/dev/null | head -1)"
            echo "    ${summary:-no summary line: the self-test did not finish}"
            grep -h "^SELFTEST SKIPPED" $log 2>/dev/null | cut -c1-600 | sed 's/^SELFTEST SKIPPED /- /' || true
          } >> "$GITHUB_STEP_SUMMARY"
          # The XPC services that started while a profile ran in Safari's chrome, and what they held open.
          grep '^INFO XPC service' $log 2>/dev/null | head -6 | cut -c1-1500 | sed 's/^/::notice title=macOS 27 - XPC services::/' || true
      - name: The certificate checks on macOS 27
        if: always()
        continue-on-error: true
        run: |
          grep -E '^(PASS|FAIL) certificates' build/egress27/selftest.txt 2>/dev/null | head -10 | cut -c1-1000 \
            | sed 's/^/::notice title=macOS 27 - certificates::/' || true
      - name: What crashed on macOS 27, if anything (crash reports)
        if: always()
        continue-on-error: true
        run: |
          mkdir -p build/egress27/crashes
          shopt -s nullglob
          # *Name*: a fault the process lived through is ExcUserFault_<process>-….ips (the owner's
          # Mac, 1 November: WebKit's UI side refusing a message, EXC_GUARD namespace 31), which a
          # Name* pattern never found.
          for report in ~/Library/Logs/DiagnosticReports/*Lumen*.ips ~/Library/Logs/DiagnosticReports/*com.apple.WebKit*.ips \
                        /Library/Logs/DiagnosticReports/*Lumen*.ips /Library/Logs/DiagnosticReports/*com.apple.WebKit*.ips; do
            cp "$report" build/egress27/crashes/ 2>/dev/null || sudo cp "$report" build/egress27/crashes/
          done
          sudo chmod -R a+r build/egress27/crashes 2>/dev/null || true
          python3 scripts/crash_summary.py build/egress27/crashes/*.ips | tee build/egress27/crashes/summary.txt
          grep -E '^(CRASH|FAULT)' build/egress27/crashes/summary.txt | grep -v '^CRASH none' | head -16 | cut -c1-300 | sed 's/^/::warning title=macOS 27 - crash::/' || true
          # The search's control: the self-test's exception checks end two processes on purpose (an
          # exception nothing catches, on the queue PBExceptionCheck.background; and the control's,
          # under ExceptionLog.runCheck on the main thread), and macOS writes a report of each — or,
          # macOS 27, of one of the two, 0.6 s apart (CI run 649 kept the first, 650 the second).
          # Neither among the reports found, the search is looking under another name.
          if ! grep -qE "crashed thread PBExceptionCheck\.background|ExceptionLog\.runCheck" build/egress27/crashes/summary.txt; then
            echo "::error title=macOS 27 - crash reports SKIPPED::no report of the self-test's deliberate crashes (the queue PBExceptionCheck.background, or the control's under ExceptionLog.runCheck) is among those found: the search for crash reports is blind to this app's processes"
            echo "### macOS 27 - crash reports SKIPPED: the deliberate crash's report was not found" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # A message WebKit's UI side refused from one of its processes, as the log names it.
          sudo log show --style compact --last 3h --predicate 'eventMessage CONTAINS[c] "invalid message" AND process != "log"' 2>/dev/null \
            | grep -iv '^timestamp' | grep -v ' log\[[0-9]' | head -40 | tee build/egress27/crashes/invalid-messages.txt || true
          cut -c1-400 build/egress27/crashes/invalid-messages.txt | head -8 | sed 's/^/::warning title=macOS 27 - WebKit refused a message::/' || true
          if [ -s build/egress27/crashes/invalid-messages.txt ]; then
            { echo "### macOS 27 - WebKit refused a message"; cut -c1-400 build/egress27/crashes/invalid-messages.txt | head -20 | sed 's/^/    /'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      # macOS 27, the owner's: Safari and apps run the same WebKit here (measured: Safari 27.0.1 and the
      # system WebKit.framework both 22625.1.29.11.28), so a profile can be this Safari, and must be.
      - name: Compare the fingerprint surface with this Mac's real Safari on macOS 27 (fails the build)
        if: always()
        timeout-minutes: 10
        run: |
          sudo safaridriver --enable || echo "::warning::safaridriver --enable failed"
          # The step's shell is bash -e: the script's own exit would end it before the case below
          # reads it (b56fa52: ENGINES DIFFER, exit 4, failed the step it was to warn in).
          code=0
          python3 scripts/safari_reference.py --compare build/egress27/surface/surface-macos.json --out build/egress27/safari-surface.json || code=$?
          case "$code" in
            0) ;;
            1) echo "::error title=macOS 27 - fingerprint differs from this Mac's Safari::a must-match key differs from Safari, and a plain Safari window (no WebDriver) says what WebDriver said, or could not be read" ;;
            2) echo "::error title=macOS 27 - Safari not driven::Safari could not be driven, or its probe came back incomplete: nothing was compared" ;;
            3) echo "::error title=macOS 27 - WebDriver only::every differing key reads in a plain Safari window as the profile has it: the comparison's method differs from Safari, not the profile" ;;
            4) echo "::warning title=macOS 27 - Safari runs a WebKit of its own::nothing was compared"; exit 0 ;;
            *) echo "::error::safari_reference.py exited $code" ;;
          esac
          exit $code
      - name: The network guard's probe on macOS 27 — whom macOS counts WebKit's WebRTC request for
        # As on macOS 26 (scripts/guard_probe_check.py): every packet of the probe's request sent
        # by another process and counted for the probe's pid, and the kernel's table as the guard
        # reads it agreeing with the capture. It fails the run: macOS 27.0.1 is the owner's, and this
        # step, only reported, went green in full run #3 while the table it read was empty.
        if: always()
        timeout-minutes: 8
        run: python3 scripts/guard_probe_check.py --app build/unsandboxed/Lumen.app --out build/egress27/guard-probe
      - name: Lumen --guard-diagnose on macOS 27, where no guard runs — it starts, says where it stops, and does not pass (reported)
        # As on macOS 26 (scripts/guard_diagnose_check.sh): the owner's diagnosis of the guard, run
        # as far as it goes without one. Reported, as this job is.
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        run: scripts/guard_diagnose_check.sh build/unsandboxed
      - name: A jump to a fragment in a profile with a proxy (a measurement)
        if: always()
        continue-on-error: true
        run: |
          grep '^INFO fragment jump' build/egress27/selftest.txt 2>/dev/null | head -8 | cut -c1-1000 \
            | sed 's/^/::notice title=macOS 27 - measured::/' || true
      - name: A jump to a fragment — the same document, in Safari 27 and in a profile? (a measurement)
        # scripts/fragment_check.py: one page of this Mac sets location.hash and says whether its
        # document survived, in this Mac's Safari and in a profile (this app's window, Safari's).
        if: always()
        continue-on-error: true
        timeout-minutes: 12
        run: |
          set +e
          python3 scripts/fragment_check.py --app build/unsandboxed/Lumen.app | tee build/egress27/fragment.txt
          grep '^FRAGMENT' build/egress27/fragment.txt | head -9 | cut -c1-600 | sed 's/^/::notice title=macOS 27 - fragment jump::/'
          exit 0
      - name: What Safari 27's chrome brings into a profile's process (an inventory)
        if: always()
        continue-on-error: true
        timeout-minutes: 6
        run: |
          set +e
          build/unsandboxed/Lumen.app/Contents/MacOS/LumenProfile --safari-inventory > build/egress27/safari-inventory.txt 2> build/egress27/safari-inventory.err
          echo "exit $?"
          grep -E '^(INVENTORY|LS) ' build/egress27/safari-inventory.txt | head -10 | cut -c1-500 | sed 's/^/::notice title=macOS 27 - Safari inventory::/'
          grep -E '^XPC [^ ]*Safari' build/egress27/safari-inventory.txt | head -10 | cut -c1-600 | sed 's/^/::notice title=macOS 27 - XPC services of Safari frameworks::/'
          echo "::group::the inventory"; cat build/egress27/safari-inventory.txt; echo "::endgroup::"
          exit 0
      - name: Safari 27's menu, every item chosen in a profile's own process (docs/SAFARI_MENU.md)
        # What each item of the menu bar does there: a crash, an exception, a window, a panel, a
        # request to open something outside, a service started, a write in the real Safari's places
        # (scripts/menu_walk.py), compared with docs/menu-walk/safari-<major>.json: an item that does
        # something else, or a write in the real Safari's places by the profile — in the file trace,
        # or in the real Safari's own preferences, read before and after with sentinels set
        # (cfprefsd's writes are not in the trace) — fails the step, not the job.
        if: always()
        continue-on-error: true
        timeout-minutes: 30
        run: |
          major="$(defaults read /Applications/Safari.app/Contents/Info.plist CFBundleShortVersionString | cut -d. -f1)"
          python3 scripts/menu_walk.py --app build/unsandboxed/Lumen.app --out build/egress27/menu-walk \
            --title "macOS 27 - Safari's menu" --record "docs/menu-walk/safari-$major.json" --check \
            --ignore "$HOME/Library/Logs:$HOME/actions-runner:$HOME/runners" --safari-sentinels
      - name: macOS 27 - a scenario's run in Safari 27's window — its click on the button it aimed at (reported)
        # scripts/scenario_safari_check.sh, as in the macOS 26 job: fails the step, not the job.
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        run: TITLE="macOS 27 - a scenario in Safari's window" scripts/scenario_safari_check.sh build/unsandboxed/Lumen.app build/egress27/scenario-safari
      - name: macOS 27 - a profile's data through signing out, into other accounts and back (it must fail when lost)
        # scripts/account_switch_check.py, as in the macOS 26 job, with its control.
        if: always()
        timeout-minutes: 20
        run: |
          python3 -u scripts/account_switch_check.py --app build/unsandboxed/Lumen.app --out build/egress27/account-switch
          python3 -u scripts/account_switch_check.py --app build/unsandboxed/Lumen.app --out build/egress27/account-switch/control --control
      - name: Safari 27's question about the default browser — as built, and declared a browser (a measurement)
        if: always()
        continue-on-error: true
        timeout-minutes: 4
        run: scripts/default_browser_check.sh build/unsandboxed/Lumen.app build/egress27/default-browser "macOS 27 - default browser"
      - name: Safari 27's paths at its start and on about:blank — empty paths, app groups, bookmarks (a measurement)
        # The owner's Mac, 31 October: Safari's bookmarks database "at (null)". Who asks for a file
        # URL with no path at Safari's start and on about:blank, with the frames that asked; the app
        # groups asked for; Safari's own log about bookmarks, its tab collection and downloads
        # (SafariPathsCheck). Never fails the build. It does not reach Safari's app-link banner
        # tracker (no page loads in it): that one is the self-test's "Safari's app-link banner
        # tracker" group, in a profile's own process.
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        run: |
          set +e
          build/unsandboxed/Lumen.app/Contents/MacOS/LumenProfile --paths-check > build/egress27/paths-check.txt 2>/dev/null
          echo "exit $?"; cat build/egress27/paths-check.txt
          grep '^PATHS-CHECK' build/egress27/paths-check.txt | grep -v '^PATHS-CHECK log ' | head -16 | cut -c1-900 | sed 's/^/::notice title=macOS 27 - paths in a profile process::/'
          # A run that saw nothing (Safari's window did not open) says so: SKIPPED, on the job's page and in its summary.
          if grep -q '^PATHS-CHECK SKIPPED' build/egress27/paths-check.txt; then
            grep '^PATHS-CHECK SKIPPED' build/egress27/paths-check.txt | sed 's/^/::warning title=macOS 27 - paths in a profile process - SKIPPED::/'
            grep '^PATHS-CHECK SKIPPED' build/egress27/paths-check.txt | sed 's/^/### macOS 27 - paths in a profile process: /' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0
      - name: Safari 27's history inside a profile's process (a measurement)
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        run: |
          set +e
          # A run that dies leaves a crash report: which one is new since here, and its summary.
          since="$(mktemp)"
          build/unsandboxed/Lumen.app/Contents/MacOS/LumenProfile --history-check > build/egress27/history-check.txt 2>/dev/null
          echo "exit $?"; cat build/egress27/history-check.txt
          grep '^HISTORY-CHECK' build/egress27/history-check.txt | head -12 | cut -c1-500 | sed 's/^/::notice title=macOS 27 - history in a profile process::/'
          build/unsandboxed/Lumen.app/Contents/MacOS/LumenProfile --history-check --in-process-fallback > build/egress27/history-check-fallback.txt 2>/dev/null
          echo "exit $?"; cat build/egress27/history-check-fallback.txt
          grep '^HISTORY-CHECK' build/egress27/history-check-fallback.txt | head -12 | cut -c1-500 | sed 's/^/::notice title=macOS 27 - history in a profile process (fallback)::/'
          find ~/Library/Logs/DiagnosticReports /Library/Logs/DiagnosticReports -name '*Lumen*.ips' -newer "$since" 2>/dev/null \
            | while read -r report; do python3 scripts/crash_summary.py "$report" | head -60; done
          exit 0
      - name: What follows the SDK on macOS 27 — the build as made, and a copy that declares Xcode 27's SDK (a measurement)
        if: always()
        continue-on-error: true
        timeout-minutes: 6
        run: |
          scripts/sdk_check.sh build/unsandboxed/Lumen.app build/egress27/sdk-check "macOS 27 - SDK behaviors" \
            "$(xcrun --show-sdk-version)" build/egress27/sdk-check/ui
      - name: WebKit's features in a profile's web views as Safari has them, on macOS 27 (reported)
        # As on macOS 26, where it fails the build (scripts/engine_features_check.py); this job fails
        # the build only on a certificate fetched outside a profile's proxy.
        if: always()
        continue-on-error: true
        timeout-minutes: 6
        run: |
          python3 scripts/engine_features_check.py --app build/unsandboxed/Lumen.app \
            --out build/egress27/engine-features --title "macOS 27 - WebKit's features as Safari's"
      - name: From which declared SDK this Mac fetches a certificate's address outside a profile's proxy, on macOS 27 (a measurement)
        # Run 451: clean with 14.0 to 14.4, the AIA canary fetched with every SDK from 15.0 to 27.0
        # (26.5, what an Xcode 26 build declares, among them) and with WebKit's switch. Kept on the
        # edges: 14.4, 15.0, 26.5 and this Xcode's — each with names of its own, its control seen —
        # and the certificate check's own lines on how the trust came (scripts/aia_variants.py).
        # Never fails the build.
        if: always()
        continue-on-error: true
        timeout-minutes: 15
        run: |
          python3 scripts/aia_variants.py --app build/unsandboxed/Lumen.app \
            --sdk "14.4,15.0,26.5,$(xcrun --show-sdk-version)" \
            --out build/egress27/aia-variants --title "macOS 27 - AIA variants"
      - name: Which SDK SwiftPM writes into an executable on macOS 27 (a measurement)
        if: always()
        continue-on-error: true
        timeout-minutes: 6
        run: scripts/swiftpm_sdk_probe.sh build/egress27/swiftpm-sdk "macOS 27 - SwiftPM's SDK version"
      - name: Safari 27's File › Export › Bookmarks… in a profile's process (a measurement)
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        run: |
          set +e
          build/unsandboxed/Lumen.app/Contents/MacOS/LumenProfile --export-check > build/egress27/export-check.txt 2>/dev/null
          echo "exit $?"; cat build/egress27/export-check.txt
          grep '^EXPORT-CHECK' build/egress27/export-check.txt | head -20 | cut -c1-500 | sed 's/^/::notice title=macOS 27 - export in a profile process::/'
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: macos-27-selftest
          path: build/egress27
          if-no-files-found: ignore

  macos:
    if: github.event_name != 'schedule'
    name: macOS build, core tests, WebKit self-test
    # The newest macOS and Xcode: WebKit enables several features only for apps linked against
    # the current SDK (Trusted Types, …), and the Safari comparison should see the same engine
    # and feature set a user of the current macOS gets.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test
      - name: Build sandboxed app (default)
        run: APP_DIR=build/sandboxed scripts/build-app.sh
      - name: Build unsandboxed app, and the network guard extension (unsigned, NE=check)
        # The extension needs a provisioned team to be signed and loaded (NE=1); CI compiles it
        # against this SDK and lays out its bundle so its plists are checked.
        run: NE=check SANDBOX=0 APP_DIR=build/unsandboxed scripts/build-app.sh
      - name: The account's keychain before the app first runs (a measurement, compared at the end)
        # Before the release check: it runs the app too, and its keychain check keeps items of its
        # own while it looks (in run 662 it stopped before removing them). What the app leaves in the
        # keychain from here to the menu walk is compared in "What the app left in the account's
        # keychain" (scripts/keychain_check.py).
        run: python3 scripts/keychain_check.py snapshot build/keychain/before.json || true
      - name: Release, dry run (no Apple account, a throwaway update key)
        # scripts/release.sh end to end: the app built without the App Sandbox with an update feed and
        # keys, signed (ad hoc, the hardened runtime), its signature read back, then the release gate —
        # Safari's pieces, and a profile started as the app starts one opening in Safari's own window
        # (Lumen --release-check) — then zipped, the zip signed with Ed25519, the appcast made and
        # signed, both checked with the app's own code (pbupdate verify). Notarization and stapling
        # are skipped and said so.
        run: VERSION=0.1.1 BUILD=2 OUT=build/release scripts/release.sh
      - name: The disk image's window as a person sees it, light and dark — it must show its picture, and its control must not
        # The owner, 3 November: 0.1.1's window had its icons and its size and no picture while
        # make_dmg.sh said it was laid out. The dry run's image opened in Finder, its window captured
        # in both appearances and compared point by point with the picture the image carries
        # (scripts/dmg_window_shot.sh, scripts/dmg_background_check.py); what its .DS_Store holds and
        # what Finder answers are said with it (scripts/dmg_facts.py). The control: the same app laid
        # out without its picture (make_dmg.sh --no-picture) must fail the same check.
        timeout-minutes: 12
        run: |
          scripts/dmg_window_shot.sh build/release/Lumen-0.1.1.dmg build/dmg-window --both
          scripts/make_dmg.sh build/release/app/Lumen.app build/dmg-control/Lumen-no-picture.dmg --no-picture
          scripts/dmg_window_shot.sh build/dmg-control/Lumen-no-picture.dmg build/dmg-window/control --both --expect not-shown
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dmg-window
          path: build/dmg-window
          if-no-files-found: ignore
      - name: The disk image as someone downloads it — the control (not notarized, so Gatekeeper must refuse it)
        # scripts/download_check.sh on the dry run's image, marked as a browser marks a download: a
        # check that cannot fail proves nothing, and an image signed ad hoc is the one it must fail
        # on. After a real release, .github/workflows/download-check.yml runs the same check on the
        # published image with --expect accepted, on runners that have never seen Lumen.
        # With --shots, what a person does too: the image double-clicked, the app opened from
        # Applications, the screen after each — what the control's person would be told.
        timeout-minutes: 10
        run: scripts/download_check.sh build/release/Lumen-0.1.1.dmg --expect rejected --shots build/download-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: download-check-control
          path: build/download-shots
          if-no-files-found: ignore
      - name: The release gate fails where Safari's chrome is not hosted (its controls)
        # A gate that cannot fail proves nothing. The sandboxed build, and the release with Safari's
        # chrome turned off for the profile's process (--control), must each come back FAIL, for
        # their own reason; and release.sh must refuse SANDBOX=1 before it builds anything.
        run: |
          status=0
          out=$(build/sandboxed/Lumen.app/Contents/MacOS/Lumen --release-check 2>&1) \
            && { echo "::error title=Release gate::the sandboxed build passed the release check"; status=1; }
          echo "$out" | grep '^RELEASE-CHECK' || echo "$out" | tail -n 20
          echo "$out" | grep -F 'runs in the App Sandbox' >/dev/null \
            || { echo "::error title=Release gate::the sandboxed build did not fail for the sandbox"; status=1; }
          out=$(build/release/app/Lumen.app/Contents/MacOS/Lumen --release-check --control 2>&1) \
            && { echo "::error title=Release gate::the control (Safari's chrome off) passed the release check"; status=1; }
          echo "$out" | grep '^RELEASE-CHECK' || echo "$out" | tail -n 20
          echo "$out" | grep -F "window is the app's own" >/dev/null \
            || { echo "::error title=Release gate::the control did not fail for its window"; status=1; }
          # A build without an account server (every development build) is never released: its
          # license would not be checked (CONTRACT §2, §7.2).
          out=$(build/unsandboxed/Lumen.app/Contents/MacOS/Lumen --release-check 2>&1) \
            && { echo "::error title=Release gate::a build without an account server passed the release check"; status=1; }
          echo "$out" | grep '^RELEASE-CHECK' || echo "$out" | tail -n 20
          echo "$out" | grep -F 'no account server in this build' >/dev/null \
            || { echo "::error title=Release gate::the build without an account server did not fail for it"; status=1; }
          # The release's own app, changed in one thing each (a copy, signed again ad hoc): with no key
          # for the documents of rights it could accept no license; trusting the development server's
          # key, anyone could sign one. Both must fail, each for its reason (the owner, 2 November: a
          # release refuses to be made with the license's check off, as without Safari's window).
          gate() {
            local name="$1" change="$2" expected="$3" copy="build/release-gate-$1/Lumen.app"
            rm -rf "build/release-gate-$name"; mkdir -p "build/release-gate-$name"
            ditto build/release/app/Lumen.app "$copy"
            /usr/libexec/PlistBuddy -c "$change" "$copy/Contents/Info.plist"
            codesign --force --sign - --preserve-metadata=entitlements,flags,runtime "$copy" 2>&1 | tail -n 2
            out=$("$copy/Contents/MacOS/Lumen" --release-check 2>&1) \
              && { echo "::error title=Release gate::the release with $name passed the release check"; status=1; }
            echo "$out" | grep '^RELEASE-CHECK' || echo "$out" | tail -n 20
            echo "$out" | grep -F "$expected" >/dev/null \
              || { echo "::error title=Release gate::the release with $name did not fail for it"; status=1; }
          }
          gate "no-keys" "Delete :PBEntitlementPublicKeys" "no keys of the documents of rights"
          # The release's own app with its profile's executable signed with the app group — what an
          # NE=1 build's app carries — must not start a profile at all: every profile would share the
          # app's keychain (ProfileExecutable.swift). The manager reads the signature before a start.
          copy="build/release-gate-profile-keychain/Lumen.app"
          rm -rf build/release-gate-profile-keychain; mkdir -p build/release-gate-profile-keychain
          ditto build/release/app/Lumen.app "$copy"
          codesign -d --entitlements - --xml "$copy/Contents/MacOS/LumenProfile" > build/release-gate-profile-keychain/entitlements.plist 2>/dev/null
          /usr/libexec/PlistBuddy -c "Add :com.apple.security.application-groups array" \
            -c "Add :com.apple.security.application-groups:0 string XXXXXXXXXX.io.lumenbrowser.Lumen" \
            build/release-gate-profile-keychain/entitlements.plist
          codesign --force --options runtime --timestamp=none --identifier io.lumenbrowser.Lumen \
            --entitlements build/release-gate-profile-keychain/entitlements.plist --sign - "$copy/Contents/MacOS/LumenProfile" 2>&1 | tail -n 2
          codesign --force --sign - --preserve-metadata=entitlements,flags,runtime "$copy" 2>&1 | tail -n 2
          out=$("$copy/Contents/MacOS/Lumen" --release-check 2>&1) \
            && { echo "::error title=Release gate::a profile's executable with the app's keychain passed the release check"; status=1; }
          echo "$out" | grep '^RELEASE-CHECK' || echo "$out" | tail -n 20
          echo "$out" | grep -F "keychain of its own" >/dev/null \
            || { echo "::error title=Release gate::the profile's executable with the app's keychain did not fail for it"; status=1; }
          gate "development-key" "Add :PBEntitlementPublicKeys:445c6300da0205b1 string /+/sbiH55nmy+2gRqQz12E0spl9L/YDWvjnecaN2M1c=" \
            "the development server's key"
          # The start check (release.sh's step 1b) passes the release's app, and fails an executable that
          # does not answer: one killed at its start — what the owner's Mac showed of 0.1.1 with the
          # network guard (Killed: 9, 137) — and one that ends at once without a word. Neither is the
          # kernel's own refusal: this runner's kernel enforces no code signature — it started an ad hoc
          # copy carrying an application identifier (run 666) and a copy whose app's executable had its
          # signature taken off (run 667), the two controls tried before these, which therefore could
          # not fail. The start check's verdict on a signature the kernel refuses is taken on the
          # owner's Mac (docs/TUNNEL.md, the hardware checklist's step 0).
          scripts/start_check.sh build/release/app/Lumen.app/Contents/MacOS/Lumen "the release's app" \
            || { echo "::error title=Start check::the release's own app did not pass the start check"; status=1; }
          rm -rf build/start-check-control; mkdir -p build/start-check-control
          printf '#!/bin/sh\nkill -KILL $$\n' > build/start-check-control/killed
          printf '#!/bin/sh\nexit 0\n' > build/start-check-control/silent
          chmod +x build/start-check-control/killed build/start-check-control/silent
          for control in killed silent; do
            if scripts/start_check.sh "build/start-check-control/$control" "the control ($control at its start)"; then
              echo "::error title=Start check::the start check passed an executable that does not answer ($control)"; status=1
            fi
          done
          # This runner's kernel, said: does it run the release's app with its signature taken off?
          copy="build/start-check-unsigned/Lumen.app"
          rm -rf build/start-check-unsigned; mkdir -p build/start-check-unsigned
          ditto build/release/app/Lumen.app "$copy"
          codesign --remove-signature "$copy/Contents/MacOS/Lumen" || true
          csrutil status 2>/dev/null || true
          if scripts/start_check.sh "$copy/Contents/MacOS/Lumen" "an unsigned copy (a measurement)" >/dev/null 2>&1; then
            echo "::notice title=Start check, measured::this runner's kernel ran the app's executable with its signature taken off: it enforces no code signature, and no refusal by signature can be shown here"
          else
            echo "::notice title=Start check, measured::this runner's kernel refused the app's executable with its signature taken off"
          fi
          if SANDBOX=1 VERSION=0.1.1 BUILD=2 OUT=build/release-sandboxed scripts/release.sh > build/release-sandboxed.log 2>&1; then
            echo "::error title=Release gate::release.sh made a release of the sandboxed build"; status=1
          fi
          grep -F 'a release is never the sandboxed build' build/release-sandboxed.log \
            || { echo "::error title=Release gate::release.sh did not refuse SANDBOX=1 for the sandbox"; cat build/release-sandboxed.log; status=1; }
          exit $status
      - name: download.json as the website reads it, written under any locale (its controls)
        # 0.1.1's said "sizeMB": 17,5 on the owner's Mac, whose locale writes a decimal comma; this
        # runner's locale is English, so the check reads the file, not the environment. Here macOS's
        # own Russian locale shows the old line's comma, and the file release.sh wrote is read back.
        run: |
          scripts/test_download_json.sh
          minimum="$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' build/release/app/Lumen.app/Contents/Info.plist)"
          python3 scripts/download_json.py check build/release/download.json --dmg build/release/Lumen-0.1.1.dmg --minimum-system "$minimum"
          # The macOS the app needs is the one the site states and CI tests (docs/UPDATES.md §6): 26.
          [[ "$minimum" == 26.0 ]] || { echo "::error title=Minimum macOS::the app needs macOS $minimum, not 26.0"; exit 1; }
          # The live site, said (a release stops on a disagreement; here it is a notice either way).
          python3 scripts/site_minimum_check.py --minimum "$minimum" --site https://lumenbrowser.io \
            || echo "::notice title=Minimum macOS::the live site's minimum macOS was not confirmed from this runner"
      - name: The release gate reads every line, not one PASS among them (its controls)
        # release.sh takes the release check's verdict through scripts/release_check_gate.sh: the
        # app's exit status and every line. Outputs made up for the purpose, each with the verdict the
        # gate must give — the keychain between profiles failing after the window's PASS among them,
        # which release.sh's earlier reading (any PASS line at all) would have let through to a release.
        run: |
          status=0
          verdict() {  # <accept|refuse> <exit status> <what the case is> <lines…>
            local expected="$1" code="$2" what="$3" got
            shift 3
            printf '%s\n' "$@" > build/release-gate-case.txt
            if scripts/release_check_gate.sh build/release-gate-case.txt "$code" 2>/dev/null; then got=accept; else got=refuse; fi
            if [[ "$got" == "$expected" ]]; then
              echo "OK $expected: $what"
            else
              echo "::error title=Release gate::the gate would $got where it must $expected: $what"
              status=1
            fi
          }
          window="RELEASE-CHECK PASS a profile in a process of its own (pid 4242), its window Safari's own chrome"
          verdict accept 0 "a dry run: the window shown, the keychain not shown in this build" \
            "RELEASE-CHECK INFO io.lumenbrowser.Lumen 0.1.0 (1)" "$window" \
            "RELEASE-CHECK INFO not shown in this build: keychain between profiles: … the data-protection keychain takes no item from the app itself here"
          verdict accept 0 "the team's build: the window and the three keychain checks shown" "$window" \
            "RELEASE-CHECK PASS keychain: a profile's process holds none of the entitlements that give a keychain" \
            "RELEASE-CHECK PASS keychain: the account's login keychain is closed to a profile's process" \
            "RELEASE-CHECK PASS keychain between profiles: an item one profile tries to keep … is not kept"
          verdict refuse 1 "the login keychain open to a profile, after the window's PASS" "$window" \
            "RELEASE-CHECK PASS keychain: a profile's process holds none of the entitlements that give a keychain" \
            "RELEASE-CHECK FAIL keychain: the account's login keychain is closed to a profile's process: profile A kept an item"
          verdict refuse 1 "the keychain between profiles failed after the window's PASS" "$window" \
            "RELEASE-CHECK FAIL keychain between profiles: profile A kept an item in the data-protection keychain: it has the app's keychain"
          verdict refuse 0 "a FAIL line, whatever the exit status" "$window" \
            "RELEASE-CHECK FAIL keychain: profile A's process holds com.apple.application-identifier: it is given the app's keychain"
          verdict refuse 1 "an exit status not 0, whatever the lines" "$window" "RELEASE-CHECK PASS keychain between profiles: …"
          verdict refuse 1 "the check ran out of time after the window" "$window" "RELEASE-CHECK FAIL the check did not finish in 4 minutes"
          verdict refuse 0 "no line for the profile's window" "RELEASE-CHECK INFO io.lumenbrowser.Lumen 0.1.0 (1)" \
            "RELEASE-CHECK PASS keychain between profiles: …"
          verdict refuse 1 "the profile did not start" \
            "RELEASE-CHECK FAIL the profile did not start: the profile's executable is signed with a keychain of its own"
          verdict refuse 0 "nothing at all" ""
          exit $status
      - name: A relaxation beside the network extension's right — refused by the build (its controls)
        # On 3 November 0.1.1 with the network guard was killed by the kernel at its start on macOS
        # 27.0.1: its app's executable held library validation off beside the network extension's
        # right (docs/TUNNEL.md, "What the kernel kills"). scripts/relaxation_check.sh, which
        # build-app.sh and release.sh run, must let the builds made here through and refuse every copy
        # holding a listed relaxation beside the right — and let one with allow-jit through (measured:
        # it started); build-app.sh must refuse 0.1.1's pairing and leave no bundle behind. It reads
        # signatures only: it runs whatever the release gate above found, and this runner's kernel,
        # which enforces no code signature, cannot show what it guards against.
        if: ${{ !cancelled() }}
        run: |
          status=0
          for app in build/release/app/Lumen.app build/unsandboxed/Lumen.app build/sandboxed/Lumen.app; do
            scripts/relaxation_check.sh "$app" || { echo "::error title=Relaxation check::$app was refused"; status=1; }
          done
          # The layout, read from the signatures: the app's own executable keeps library validation on,
          # LumenProfile has it off (Safari's frameworks load only there).
          for app in build/release/app/Lumen.app build/unsandboxed/Lumen.app; do
            codesign -d --entitlements - --xml "$app/Contents/MacOS/Lumen" > build/layout-app.plist 2>/dev/null || true
            codesign -d --entitlements - --xml "$app/Contents/MacOS/LumenProfile" > build/layout-profile.plist 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Print :com.apple.security.device.camera" build/layout-app.plist >/dev/null 2>&1 \
              || { echo "::error title=Layout::$app: the app's entitlements were not read"; status=1; }
            if /usr/libexec/PlistBuddy -c "Print :com.apple.security.cs.disable-library-validation" build/layout-app.plist >/dev/null 2>&1; then
              echo "::error title=Layout::$app: the app's own executable is signed with library validation off"; status=1
            fi
            /usr/libexec/PlistBuddy -c "Print :com.apple.security.cs.disable-library-validation" build/layout-profile.plist >/dev/null 2>&1 \
              || { echo "::error title=Layout::$app: LumenProfile keeps library validation on (Safari's frameworks would not load)"; status=1; }
          done
          # Copies of the release's app, one executable signed again ad hoc with the right — and with
          # what is named. relax <copy> <executable> <refused|passes> <the key a refusal names, or -> [keys added]
          relax() {
            local name="$1" executable="$2" expect="$3" named="$4"; shift 4
            local dir="build/relaxation-$name" copy="build/relaxation-$name/Lumen.app" key out result=0
            rm -rf "$dir"; mkdir -p "$dir"; ditto build/release/app/Lumen.app "$copy"
            codesign -d --entitlements - --xml "$copy/Contents/MacOS/$executable" > "$dir/entitlements.plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :com.apple.developer.networking.networkextension array" \
              -c "Add :com.apple.developer.networking.networkextension:0 string content-filter-provider-systemextension" "$dir/entitlements.plist"
            for key in "$@"; do
              /usr/libexec/PlistBuddy -c "Delete :$key" "$dir/entitlements.plist" >/dev/null 2>&1 || true
              /usr/libexec/PlistBuddy -c "Add :$key bool true" "$dir/entitlements.plist"
            done
            if [[ "$executable" == Lumen ]]; then
              codesign --force --options runtime --timestamp=none --entitlements "$dir/entitlements.plist" --sign - "$copy" 2>&1 | tail -n 1
            else
              codesign --force --options runtime --timestamp=none --identifier io.lumenbrowser.Lumen \
                --entitlements "$dir/entitlements.plist" --sign - "$copy/Contents/MacOS/$executable" 2>&1 | tail -n 1
              codesign --force --sign - --preserve-metadata=entitlements,flags,runtime "$copy" 2>&1 | tail -n 1
            fi
            out=$(scripts/relaxation_check.sh "$copy" 2>&1) || result=$?
            echo "-- $name: $executable signed with the right${1:+ and $*}: exit $result"
            echo "$out" | sed 's/^/   /'
            if [[ "$expect" == refused ]]; then
              [[ $result != 0 ]] || { echo "::error title=Relaxation check::the copy $name was let through"; status=1; }
              [[ "$out" == *"Contents/MacOS/$executable holds $named beside com.apple.developer.networking.networkextension"* ]] \
                || { echo "::error title=Relaxation check::the copy $name was not refused for $named"; status=1; }
            else
              [[ $result == 0 ]] || { echo "::error title=Relaxation check::the copy $name was refused"; status=1; }
            fi
          }
          # Measured on the owner's Mac: killed beside the right.
          relax dlv Lumen refused com.apple.security.cs.disable-library-validation com.apple.security.cs.disable-library-validation
          relax unsigned-memory Lumen refused com.apple.security.cs.allow-unsigned-executable-memory com.apple.security.cs.allow-unsigned-executable-memory
          relax dyld-environment Lumen refused com.apple.security.cs.allow-dyld-environment-variables com.apple.security.cs.allow-dyld-environment-variables
          # Not measured, refused all the same.
          relax page-protection Lumen refused com.apple.security.cs.disable-executable-page-protection com.apple.security.cs.disable-executable-page-protection
          relax debugger Lumen refused com.apple.security.cs.debugger com.apple.security.cs.debugger
          # LumenProfile holds library validation off: the right must never be given to it.
          relax profile LumenProfile refused com.apple.security.cs.disable-library-validation
          # Measured on the owner's Mac: started — the right alone (the layout chosen), and allow-jit beside it.
          relax right-alone Lumen passes -
          relax jit Lumen passes - com.apple.security.cs.allow-jit
          # The build itself: Resources/PrivacyBrowser-NoSandbox.entitlements given what 0.1.1's app was
          # signed with — library validation off beside the right. build-app.sh must refuse the build
          # and leave no bundle behind. The file is put back however this ends.
          base=Resources/PrivacyBrowser-NoSandbox.entitlements
          trap 'git checkout -- "$base"' EXIT
          /usr/libexec/PlistBuddy -c "Add :com.apple.security.cs.disable-library-validation bool true" \
            -c "Add :com.apple.developer.networking.networkextension array" \
            -c "Add :com.apple.developer.networking.networkextension:0 string content-filter-provider-systemextension" "$base"
          if SANDBOX=0 APP_DIR=build/relaxation-build scripts/build-app.sh > build/relaxation-build.log 2>&1; then
            echo "::error title=Relaxation check::build-app.sh made a build whose app holds library validation off beside the right"; status=1
          fi
          grep -E '^error:' build/relaxation-build.log || tail -n 20 build/relaxation-build.log
          grep -F "Contents/MacOS/Lumen holds com.apple.security.cs.disable-library-validation beside com.apple.developer.networking.networkextension" build/relaxation-build.log >/dev/null \
            || { echo "::error title=Relaxation check::build-app.sh did not refuse the build for library validation off beside the right"; status=1; }
          [[ ! -e build/relaxation-build/Lumen.app ]] \
            || { echo "::error title=Relaxation check::the refused build was left in place"; status=1; }
          git checkout -- "$base"
          trap - EXIT
          git diff --quiet -- "$base" || { echo "::error title=Relaxation check::the entitlements file was not put back"; status=1; }
          exit $status
      - name: Updates end to end (a local feed and a new build; sandboxed and unsandboxed)
        # scripts/update_check.py: the old build's own updater against a local HTTPS feed — no request
        # with checks off (packet capture), an older build never offered, a stale and a forged appcast
        # and a changed archive refused, nothing installed while a profile with a window and a warm-up
        # without one run — then the quit path, the gate, the real installer: the swap, the new build
        # started, the old build's data opened by the new one. Its own bundle id (dev.local.PBUpdateCheck).
        # Early in the job, and not stopping it: a failure fails the job at its end ("Updates end to end, result").
        id: updates
        continue-on-error: true
        timeout-minutes: 30
        run: |
          status=0
          for variant in sandboxed unsandboxed; do
            echo "::group::updates, $variant"
            python3 scripts/update_check.py --variant $variant --out build/update-$variant || status=1
            echo "::endgroup::"
          done
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: update-check
          path: |
            build/update-*/run.txt
            build/update-*/verify.txt
            build/update-*/requests.json
            build/update-*/capture.txt
            build/update-*/*.json
          if-no-files-found: ignore
      - name: The interface's language as the app starts — plain, -AppleLanguages, open --args, a choice, an earlier version's write
        # Until 1 November it was Russian whatever the Mac or the command line said (the owner's
        # `open … --args -AppleLanguages "(en)"`; CI run 577). Each case names the language it wants.
        timeout-minutes: 10
        run: scripts/interface_language_check.sh build/unsandboxed/Lumen.app
      - name: The Settings window as the person gets it — the window server's picture read for a band; the control must fail
        # The UI snapshots draw SettingsView in a window of their own: not the Settings scene's
        # window, and none of what the window server adds — a grey band of the title bar was invisible
        # to them (the owner, 2 November). This opens the real one as ⌘, does, in the light and the
        # dark appearance; the control takes the fix back and must fail (scripts/settings_window_check.sh).
        timeout-minutes: 10
        run: scripts/settings_window_check.sh build/unsandboxed/Lumen.app build/settings-window
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settings-window
          path: build/settings-window
          if-no-files-found: ignore
      - name: UI snapshots for design review, and clicks through the transparent title bar
        # The app's screens rendered with sample data (UISnapshots.swift) in both UI languages, uploaded
        # as the ui-snapshots artifact. A click that does not reach its button, a real sheet that
        # does not fit in the narrowest Profiles window, or the list blank after a profile came back,
        # fails the job at the end.
        id: ui
        continue-on-error: true
        timeout-minutes: 10
        run: |
          set -o pipefail
          status=0
          mkdir -p build/ui-snapshots
          for lang in en ru; do
            PRIVACYBROWSER_LANG=$lang build/unsandboxed/Lumen.app/Contents/MacOS/Lumen --render-ui-snapshots "$PWD/build/ui-snapshots/$lang" \
              | tee "build/ui-snapshots/$lang.log" || status=1
          done
          # The sheet in the narrowest window, and its control, as notices on the job (by "sheet": the
          # edge checks' lines say "window" too).
          grep -hE '^(PASS|FAIL|WARN) .*sheet' build/ui-snapshots/en.log | grep -v 'click' | head -4 | cut -c1-400 \
            | sed 's/^/::notice title=UI snapshots - a sheet in the narrowest window::/' || true
          # The list after a profile comes back (blank until scrolled, the owner 1 November), and its control.
          grep -hE '^(PASS|FAIL|WARN) list-return' build/ui-snapshots/*.log | head -6 | cut -c1-400 \
            | sed 's/^/::notice title=UI snapshots - the list after a profile comes back::/' || true
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-snapshots
          path: build/ui-snapshots
          if-no-files-found: ignore
      - name: Self-test against real WebKit (sandboxed and unsandboxed)
        env:
          # A check skipped on this runner fails the step, but for the ones this runner cannot make
          # (each said with its reason in the self-test's own SKIP line and summary).
          PB_SELFTEST_STRICT: "1"
          # The interface in Russian, this Mac's language English: the check of dates in the
          # person's language can only tell the two apart so. Until the interface took this Mac's
          # language (1 November) the self-test ran in Russian by the old default; run 594 then
          # skipped that check, which the strict run refuses.
          PRIVACYBROWSER_LANG: ru
        run: |
          set -o pipefail
          export PB_SELFTEST_HTTP_PROXY_PORT=18080 PB_SELFTEST_SOCKS_PROXY_PORT=18081 PB_SELFTEST_HTTP_AUTH_PROXY_PORT=18082 PB_SELFTEST_HTTP6_PROXY_PORT=18083
          export PB_SELFTEST_SOCKS2_PROXY_PORT=18084 PB_SELFTEST_SOCKS_AUTH_PROXY_PORT=18085
          export PB_SELFTEST_TLS_CONTROL_PORT=18086 PB_SELFTEST_CANARY_PORT=18087 PB_SELFTEST_SILENT_PROXY_PORT=18088 PB_SELFTEST_SOCKS_UDP_PROXY_PORT=18089
          mkdir -p build/egress
          status=0
          # What a release declares: Xcode 26 writes SDK 26.5 into the executables, and with 15.0 or
          # newer this Mac fetches a certificate's missing intermediate outside a profile's proxy
          # (docs/ISOLATION_AND_LIMITATIONS.md §2; the step "From which declared SDK…" below measures
          # the build as made). Releases declare 14.0 (Xcode 27's SwiftPM; scripts/release.sh refuses
          # 15 and newer), so the build without the App Sandbox — the one inside the capture and the
          # file trace — runs as a copy declaring 14.0. Up to run 524 it ran as made, 26.5, whose fetch
          # the capture never saw (the cache above); run 524 saw it. The sandboxed build still runs as
          # made: a re-signed copy is another app to its container, which already holds the build's data.
          python3 - <<'PY'
          import os, subprocess, sys
          sys.path.insert(0, "scripts")
          from aia_variants import BINARY, copy_declaring, declared_sdk
          app, folder = "build/unsandboxed/Lumen.app", "build/release-sdk/unsandboxed"
          os.makedirs(folder, exist_ok=True)
          entitlements = os.path.join(folder, "entitlements.plist")
          with open(entitlements, "wb") as handle:
              handle.write(subprocess.run(["codesign", "-d", "--entitlements", "-", "--xml", app], capture_output=True).stdout)
          copy = copy_declaring(app, "14.0", folder, entitlements)
          if not copy or declared_sdk(os.path.join(copy, BINARY))[1] != "14.0":
              sys.exit(f"::error::no copy of {app} declaring SDK 14.0 could be made")
          print(f"unsandboxed: as built {declared_sdk(os.path.join(app, BINARY))}, the self-test's copy {declared_sdk(os.path.join(copy, BINARY))}")
          PY
          for variant in sandboxed unsandboxed; do
            # A proxy of its own for each build, its certificates naming addresses no earlier run
            # asked for (--aia-tag): the intermediate this Mac fetched for the sandboxed build's
            # control stayed in its cache, and the unsandboxed build's capture then saw neither the
            # control nor would it have seen the canary (macOS 26, every run up to 523).
            python3 scripts/selftest_proxy.py --http 18080 --socks 18081 --http-auth 18082 --http6 18083 --socks2 18084 --socks-auth 18085 \
              --tls-control 18086 --canary 18087 --silent 18088 --socks-udp 18089 --aia-tag "${variant:0:1}$(date +%s)" &
            PROXY_PID=$!
            # The proxy makes its TLS certificates before it listens.
            for attempt in $(seq 1 40); do nc -z 127.0.0.1 18081 && break; sleep 0.5; done
            echo "::group::self-test ($variant)"
            # The surface dump goes to the repository folder, which only the unsandboxed build may write.
            if [ "$variant" = unsandboxed ]; then
              export PB_SELFTEST_SURFACE_OUT="$PWD/build/surface-$variant"
              # The History window as the window server shows it (the self-test keeps its pictures).
              export PB_SELFTEST_SHOTS="$PWD/build/egress/history-shots"
              # Everything that leaves this machine while the unsandboxed self-test runs, with the
              # process each packet belongs to (pktap): scripts/egress_check.py reads it below.
              sudo tcpdump -i pktap,all -k NP -n -tt -l 'not host 127.0.0.1 and not host ::1' \
                > build/egress/capture.txt 2> build/egress/tcpdump.err &
              # And every file-system call of the app's processes and of WebKit's, for
              # scripts/disk_check.py: nothing may be written where the real Safari keeps its data.
              # One fs_usage for all three (the kernel trace is exclusive: a second one gets
              # "ktrace_start: Resource busy" and sees nothing).
              # LumenProfile: a profile's own process (ProfileExecutable), by its own name.
              sudo fs_usage -w -f filesys Lumen LumenProfile com.apple.WebKit cfprefsd > build/egress/fs.txt 2>&1 &
              sleep 2
              # A preferences file cfprefsd writes through a directory descriptor, as it writes every
              # one: disk_check.py must name it, or the trace is blind to cfprefsd again.
              mkdir -p "$PWD/build/egress/trace-canary"
              defaults write "$PWD/build/egress/trace-canary/PBTraceCanary" Canary -string "$(date +%s)"
            fi
            app="build/$variant/Lumen.app"
            if [ "$variant" = unsandboxed ]; then app="build/release-sdk/unsandboxed/Lumen.app"; fi
            "$app/Contents/MacOS/Lumen" --self-test | tee "build/egress/selftest-$variant.txt" || status=1
            echo "::endgroup::"
            kill $PROXY_PID || true
            wait $PROXY_PID 2>/dev/null || true
          done
          sudo pkill -INT -f "tcpdump -i pktap" || true
          sudo pkill -INT -f "fs_usage -w" || true
          sleep 2
          echo "::group::egress capture around the Safari-chrome check"
          python3 scripts/egress_check.py --capture build/egress/capture.txt \
            --selftest-log build/egress/selftest-unsandboxed.txt --tcpdump-errors build/egress/tcpdump.err || status=1
          echo "::endgroup::"
          echo "::group::files written while a profile ran in Safari's chrome"
          python3 scripts/disk_check.py --trace build/egress/fs.txt \
            --selftest-log build/egress/selftest-unsandboxed.txt --canary "$PWD/build/egress/trace-canary/PBTraceCanary.plist" || status=1
          echo "::endgroup::"
          exit $status
      - name: What crashed, if a process of the app or WebKit's crashed (crash reports)
        # A profile's own process that dies leaves the self-test only "the profile quit
        # unexpectedly"; macOS writes what happened to a crash report. Summarized here (the crashed
        # thread's frames), and the reports themselves go into the fingerprint-surfaces artifact.
        if: always()
        run: |
          mkdir -p build/crashes
          shopt -s nullglob
          # *Name*: a fault the process lived through is ExcUserFault_<process>-….ips (the owner's
          # Mac, 1 November: WebKit's UI side refusing a message, EXC_GUARD namespace 31), which a
          # Name* pattern never found.
          for report in ~/Library/Logs/DiagnosticReports/*Lumen*.ips ~/Library/Logs/DiagnosticReports/*com.apple.WebKit*.ips \
                        /Library/Logs/DiagnosticReports/*Lumen*.ips /Library/Logs/DiagnosticReports/*com.apple.WebKit*.ips; do
            cp "$report" build/crashes/ 2>/dev/null || sudo cp "$report" build/crashes/
          done
          sudo chmod -R a+r build/crashes 2>/dev/null || true
          python3 scripts/crash_summary.py build/crashes/*.ips | tee build/crashes/summary.txt
          grep -E '^(CRASH|FAULT)' build/crashes/summary.txt | grep -v '^CRASH none' | head -16 | cut -c1-300 | sed 's/^/::warning title=crash::/' || true
          # The search's control: the self-test's exception checks end two processes on purpose (an
          # exception nothing catches, on the queue PBExceptionCheck.background; and the control's,
          # under ExceptionLog.runCheck on the main thread), and macOS writes a report of each — or,
          # macOS 27, of one of the two, 0.6 s apart (CI run 649 kept the first, 650 the second).
          # Neither among the reports found, the search is looking under another name.
          if ! grep -qE "crashed thread PBExceptionCheck\.background|ExceptionLog\.runCheck" build/crashes/summary.txt; then
            echo "::error title=crash reports SKIPPED::no report of the self-test's deliberate crashes (the queue PBExceptionCheck.background, or the control's under ExceptionLog.runCheck) is among those found: the search for crash reports is blind to this app's processes"
            echo "### Crash reports SKIPPED: the deliberate crash's report was not found" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # A message WebKit's UI side refused from one of its processes, as the log names it.
          sudo log show --style compact --last 3h --predicate 'eventMessage CONTAINS[c] "invalid message" AND process != "log"' 2>/dev/null \
            | grep -iv '^timestamp' | grep -v ' log\[[0-9]' | head -40 | tee build/crashes/invalid-messages.txt || true
          cut -c1-400 build/crashes/invalid-messages.txt | head -8 | sed 's/^/::warning title=WebKit refused a message::/' || true
          if [ -s build/crashes/invalid-messages.txt ]; then
            { echo "### WebKit refused a message"; cut -c1-400 build/crashes/invalid-messages.txt | head -20 | sed 's/^/    /'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: The account's key in a crash report (a process holding it crashes on purpose; the control's report must hold it)
        # The self-test looks for the key in the log, the diagnostics ZIP and the automation API's
        # answers; a crash report is written by macOS after the process is gone (scripts/key_crash_check.py).
        timeout-minutes: 10
        run: python3 scripts/key_crash_check.py build/unsandboxed/Lumen.app/Contents/MacOS/Lumen
      - name: Safari's private classes and methods the hosted chrome relies on
        # SafariChrome.expectedPieces: a macOS whose Safari renamed or removed one fails here, by name,
        # instead of a profile's window quietly degrading on a user's Mac. After the self-test, so
        # that a missing piece never hides what the self-test would have measured.
        if: always()
        run: build/unsandboxed/Lumen.app/Contents/MacOS/LumenProfile --check-safari-chrome
      - name: What Safari's chrome brings into a profile's process (an inventory, never fails the build)
        # SafariChromeInventory.swift: Safari's menu as a profile's window has it, LaunchServices'
        # answers with a home of its own, the classes around AutoFill, history and export, and the
        # methods that wait. In the artifact (fingerprint-surfaces), and the menu's File items here.
        if: always()
        continue-on-error: true
        timeout-minutes: 6
        run: |
          set +e
          build/unsandboxed/Lumen.app/Contents/MacOS/LumenProfile --safari-inventory > build/safari-inventory.txt 2> build/safari-inventory.err
          echo "exit $?"
          grep -E '^(INVENTORY|LS) ' build/safari-inventory.txt | head -10 | cut -c1-500 | sed 's/^/::notice title=Safari inventory::/'
          grep -E '^XPC [^ ]*Safari' build/safari-inventory.txt | head -10 | cut -c1-600 | sed 's/^/::notice title=XPC services of Safari frameworks::/'
          grep -E '^MENU [^|]*(File|Файл|History|История|Bookmarks|Закладки) ' build/safari-inventory.txt | head -10 | cut -c1-400 \
            | sed 's/^/::notice title=Safari inventory - menu::/'
          echo "::group::the inventory"; cat build/safari-inventory.txt; echo "::endgroup::"
          exit 0
      - name: Safari's menu, every item chosen in a profile's own process (docs/SAFARI_MENU.md)
        # What each item of the menu bar does there: a crash, an exception, a window, a panel, a
        # request to open something outside, a service started, a write in the real Safari's places
        # (scripts/menu_walk.py), compared with docs/menu-walk/safari-<major>.json: a walk that does
        # not get to the end, an item that does something else, or a write in the real Safari's
        # places by the profile — in the file trace, or in the real Safari's own preferences, read
        # before and after with sentinels set (cfprefsd's writes are not in the trace) — fails the
        # build. A Safari with no record yet (a new major version) only writes one, into the run's
        # artifact.
        if: always()
        timeout-minutes: 30
        run: |
          major="$(defaults read /Applications/Safari.app/Contents/Info.plist CFBundleShortVersionString | cut -d. -f1)"
          python3 scripts/menu_walk.py --app build/unsandboxed/Lumen.app --out build/menu-walk \
            --title "Safari's menu" --record "docs/menu-walk/safari-$major.json" --check \
            --ignore "$HOME/Library/Logs:$HOME/actions-runner:$HOME/runners" --safari-sentinels
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: menu-walk
          path: build/menu-walk
          if-no-files-found: ignore
      - name: A scenario's run in Safari's window — its click on the button it aimed at, as the page saw it
        # scripts/scenario_safari_check.sh (Lumen --scenario-safari-check): a profile started without
        # a window, as the scenario editor's Run starts one, runs a scenario on the self-test proxy's
        # form in a window of Safari's opened for the run. The page's own record must hold a trusted
        # click on the button inside the button's box (the viewport's place in Safari's web view,
        # which may run under the toolbar, found right), the button must count it and the field hold
        # what was typed. The owner, 10 November: a run in a window of the app's own is not Safari.
        if: always()
        timeout-minutes: 10
        run: scripts/scenario_safari_check.sh build/unsandboxed/Lumen.app build/scenario-safari
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scenario-safari
          path: build/scenario-safari
          if-no-files-found: ignore
      - name: The license's renewals, as the account server sees them (they must fail when broken)
        # scripts/license_renewal_check.py: a stand-in account server on 127.0.0.1 answers the
        # device's renewal with documents signed by a key made for the run, and keeps every request.
        # The development build is started as a person starts it: the server must be asked at each
        # start, again while it runs when the document asks, with the app's version, this Mac's name
        # as its label and — through the app's own model, a vault opened and a profile made — the
        # real number of profiles; a renewal the server refuses must be said in the app's own log;
        # and the control, an address where nothing listens, must fail the check. The owner, 3
        # November: one renewal in nine hours, and silence in the log.
        timeout-minutes: 25
        run: python3 scripts/license_renewal_check.py --app build/unsandboxed/Lumen.app --out build/license-renewal
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: license-renewal
          path: build/license-renewal
          if-no-files-found: ignore
      - name: A profile's data through signing out, into other accounts and back (it must fail when lost)
        # The owner, 3 November: a person's history, cookies and saved logins gone from every profile
        # after signing out, into other accounts and back. scripts/account_switch_check.py: the app
        # quit between steps; two profiles with history, logins, bookmarks; a site in each that keeps
        # a cookie, localStorage and IndexedDB and says what it finds; a first account, a second, a
        # third with export only, the first again. Every step measured; the control removes the
        # profiles' data at the first sign-out and must fail the check.
        if: always()
        timeout-minutes: 20
        run: |
          python3 -u scripts/account_switch_check.py --app build/unsandboxed/Lumen.app --out build/account-switch
          python3 -u scripts/account_switch_check.py --app build/unsandboxed/Lumen.app --out build/account-switch/control --control
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: account-switch
          path: build/account-switch
          if-no-files-found: ignore
      - name: What the app left in the account's keychain (a measurement)
        # The release check, the self-test of both builds and the menu walk ran between the two
        # snapshots: every item that appeared in the account's default keychain, by its attributes,
        # never its secret. A snapshot that could not show an item of its own is SKIPPED, and one
        # not taken (a step before it failed) is said so (scripts/keychain_check.py).
        if: always()
        continue-on-error: true
        run: |
          python3 scripts/keychain_check.py snapshot build/keychain/after.json
          python3 scripts/keychain_check.py compare build/keychain/before.json build/keychain/after.json
      - name: Safari's question about the default browser — as built, and declared a browser (a measurement)
        # Whether -[GeneralPreferences _defaultWebBrowserMayHaveChanged], which threw on a nil when ⌘,
        # opened Safari's settings in a profile's window, throws because the app is no http/https
        # handler (SafariChrome.runDefaultBrowserCheck). Never fails the build.
        if: always()
        continue-on-error: true
        timeout-minutes: 4
        run: scripts/default_browser_check.sh build/unsandboxed/Lumen.app build/default-browser "default browser"
      - name: Safari's paths at its start and on about:blank — empty paths, app groups, bookmarks (a measurement)
        # The owner's Mac, 31 October: Safari's bookmarks database "at (null)". Who asks for a file
        # URL with no path at Safari's start and on about:blank, with the frames that asked; the app
        # groups asked for; Safari's own log about bookmarks, its tab collection and downloads
        # (SafariPathsCheck). Never fails the build. It does not reach Safari's app-link banner
        # tracker (no page loads in it): that one is the self-test's "Safari's app-link banner
        # tracker" group, in a profile's own process.
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        run: |
          set +e
          build/unsandboxed/Lumen.app/Contents/MacOS/LumenProfile --paths-check > build/paths-check.txt 2>/dev/null
          echo "exit $?"; cat build/paths-check.txt
          grep '^PATHS-CHECK' build/paths-check.txt | grep -v '^PATHS-CHECK log ' | head -16 | cut -c1-900 | sed 's/^/::notice title=paths in a profile process::/'
          # A run that saw nothing (Safari's window did not open) says so: SKIPPED, on the job's page and in its summary.
          if grep -q '^PATHS-CHECK SKIPPED' build/paths-check.txt; then
            grep '^PATHS-CHECK SKIPPED' build/paths-check.txt | sed 's/^/::warning title=paths in a profile process - SKIPPED::/'
            grep '^PATHS-CHECK SKIPPED' build/paths-check.txt | sed 's/^/### paths in a profile process: /' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0
      - name: Safari's history inside a profile's process (a measurement)
        # Whether Safari's History service's own code runs in a profile's process, with its database
        # in the profile's home (SafariHistoryCheck). Never fails the build.
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        run: |
          set +e
          # A run that dies leaves a crash report: which one is new since here, and its summary.
          since="$(mktemp)"
          build/unsandboxed/Lumen.app/Contents/MacOS/LumenProfile --history-check > build/history-check.txt 2>/dev/null
          echo "exit $?"; cat build/history-check.txt
          grep '^HISTORY-CHECK' build/history-check.txt | head -12 | cut -c1-500 | sed 's/^/::notice title=history in a profile process::/'
          build/unsandboxed/Lumen.app/Contents/MacOS/LumenProfile --history-check --in-process-fallback > build/history-check-fallback.txt 2>/dev/null
          echo "exit $?"; cat build/history-check-fallback.txt
          grep '^HISTORY-CHECK' build/history-check-fallback.txt | head -12 | cut -c1-500 | sed 's/^/::notice title=history in a profile process (fallback)::/'
          find ~/Library/Logs/DiagnosticReports /Library/Logs/DiagnosticReports -name '*Lumen*.ips' -newer "$since" 2>/dev/null \
            | while read -r report; do python3 scripts/crash_summary.py "$report" | head -60; done
          exit 0
      - name: What follows the SDK — the build as made (this Xcode's SDK), and a copy that declares SDK 14 (a measurement)
        # Whether window.trustedTypes and the window's other interfaces, the screen's visible frame
        # (screen.availHeight) and the app's own screens follow the SDK the executable declares, and
        # whether WebKit's switch (SDKBehaviors) puts a page where Safari's is. Never fails the build.
        if: always()
        continue-on-error: true
        timeout-minutes: 6
        run: |
          # Xcode 26 builds declare their SDK (26.5); the copy declares what an Xcode 27 build does (14.0).
          scripts/sdk_check.sh build/unsandboxed/Lumen.app build/sdk-check "SDK behaviors" \
            14.0 build/sdk-check/ui
      - name: WebKit's features in a profile's web views as Safari has them — as built, and declaring 14.0 (fails the build)
        # The features the SDK's behaviors change, set one by one as Safari has them
        # (SafariEngineFeatures; runs 495, 497, 500). Fails when a feature the behaviors change is
        # not set as Safari has it, or a page in a profile's web view differs from one with every
        # behavior on (scripts/engine_features_check.py): for this build (Xcode 26 declares 26.5)
        # and a copy declaring what an Xcode 27 build does, 14.0 — the releases' SDK.
        if: always()
        timeout-minutes: 8
        run: |
          python3 scripts/engine_features_check.py --app build/unsandboxed/Lumen.app --copy-sdk 14.0 \
            --out build/engine-features --title "WebKit's features as Safari's"
      - name: From which declared SDK this Mac fetches a certificate's address outside a profile's proxy (a measurement)
        # As on macOS 27 (scripts/aia_variants.py): as built (this Xcode's SDK), every behavior on,
        # and a copy declaring 14.0. On macOS 26 the capture has not yet seen the control's fetch, so
        # each variant says whether it can tell. Never fails the build.
        if: always()
        continue-on-error: true
        timeout-minutes: 15
        run: |
          python3 scripts/aia_variants.py --app build/unsandboxed/Lumen.app --sdk "14.0" \
            --out build/sdk-check/aia-variants --title "AIA variants"
      - name: Which SDK SwiftPM writes into an executable (a measurement)
        if: always()
        continue-on-error: true
        timeout-minutes: 6
        run: scripts/swiftpm_sdk_probe.sh build/sdk-check/swiftpm "SwiftPM's SDK version"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdk-check
          path: build/sdk-check
          if-no-files-found: ignore
      - name: Safari's File › Export › Bookmarks… in a profile's process (a measurement)
        # Where its save panel opens in a process whose home is the profile's, what Safari's
        # exporter is given, and what it writes where (SafariExportCheck). Never fails the build.
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        run: |
          set +e
          build/unsandboxed/Lumen.app/Contents/MacOS/LumenProfile --export-check > build/export-check.txt 2>/dev/null
          echo "exit $?"; cat build/export-check.txt
          grep '^EXPORT-CHECK' build/export-check.txt | head -20 | cut -c1-500 | sed 's/^/::notice title=export in a profile process::/'
          exit 0
      - name: Compare the fingerprint surface with this Mac's real Safari (safaridriver)
        run: |
          sudo safaridriver --enable || echo "::warning::safaridriver --enable failed"
          # The step's shell is bash -e: the script's own exit would end it before the case below
          # reads it (b56fa52: ENGINES DIFFER, exit 4, failed the step it was to warn in).
          code=0
          python3 scripts/safari_reference.py --compare build/surface-unsandboxed/surface-macos.json --out build/safari-surface.json || code=$?
          # The script tells the outcomes apart itself (scripts/test_safari_reference.sh); each fails
          # the step under its own name, none passes.
          case "$code" in
            0) ;;
            1) echo "::error title=Fingerprint differs from this Mac's Safari::a must-match key differs from Safari, and a plain Safari window (no WebDriver) says what WebDriver said, or could not be read" ;;
            2) echo "::error title=Safari not driven::Safari could not be driven on this runner, or its probe came back incomplete: nothing was compared" ;;
            3) echo "::error title=WebDriver only::every differing key reads in a plain Safari window as the profile has it: the comparison's method differs from Safari, not the profile" ;;
            # Safari with a WebKit of its own (Safari updated beyond the WebKit this Mac gives apps):
            # no profile can be this Safari here; the profile names its own engine's Safari (else 1).
            4) echo "::warning title=Safari runs a WebKit of its own::no profile can be this Safari on this runner, so nothing was compared; the profile names the Safari of the engine it runs"; exit 0 ;;
            *) echo "::error::safari_reference.py exited $code" ;;
          esac
          exit $code
      - name: Leak check — does QUIC or WebRTC go around a profile's proxy?
        # Real forwarding proxies on this runner and a profile without one as the control; see
        # scripts/leak_check.py. Fails only on traffic seen going around a proxy (a site that is
        # down makes it inconclusive, not red).
        if: always()
        timeout-minutes: 10
        run: python3 scripts/leak_check.py --app build/unsandboxed/Lumen.app --out build/leaks
      - name: The network guard's probe — whom macOS counts WebKit's WebRTC request for (docs/TUNNEL.md, "Attribution")
        # The guard holds a profile by the process each flow is counted for, not the one that opened
        # it (WebKit's network process). `Lumen --guard-probe` inside a capture of its STUN address
        # (TEST-NET-3, never routed): every packet must be sent by another process and counted for
        # the probe's pid, and at least one must be seen. Then the checker's own control: the same
        # capture compared with a pid that is not the probe's must fail. The kernel's table of
        # sockets, read by the app's own code while the probe runs (what the guard reads for each
        # flow, SocketTable), must agree with the capture's proc and eproc; read as if no socket were
        # delegated, it must not.
        if: always()
        timeout-minutes: 8
        run: |
          python3 scripts/guard_probe_check.py --app build/unsandboxed/Lumen.app --out build/guard-probe
          if python3 scripts/guard_probe_check.py --app build/unsandboxed/Lumen.app --out build/guard-probe-control --expect-pid 1; then
            echo "::error::the probe check passed with a pid that is not the probe's: it shows nothing"; exit 1
          fi
          # The kernel's table as the guard reads it (Lumen --socket-owners), read as if no socket were
          # delegated: it must disagree with the capture's eproc, or the comparison shows nothing.
          if python3 scripts/guard_probe_check.py --app build/unsandboxed/Lumen.app --out build/guard-probe-table-control --table-ignores-delegation; then
            echo "::error::the kernel's table read without delegation agreed with the capture: the table's comparison shows nothing"; exit 1
          fi
      - name: Lumen --guard-diagnose where no guard runs — it starts, says where it stops, and does not pass
        # The owner's diagnosis of the guard (GuardDiagnosis.swift) measures on a Mac with the guard
        # installed; here no extension can load. The app as built must say it has no guard; a copy
        # with the extension laid inside (ad hoc) must name it, read systemextensionsctl and the
        # filter's configuration, say it cannot ask a guard signed by no team, and print its answers.
        # A crash, a hang (60 s), a pass, or a section left out fails this (scripts/guard_diagnose_check.sh).
        if: always()
        timeout-minutes: 5
        run: scripts/guard_diagnose_check.sh build/unsandboxed
      - name: Live fingerprinting pages in Safari and in profiles (report, never fails the build)
        # The same pages and scripts in this Mac's Safari and in on-screen profile windows of the
        # same size: probe, window geometry, request header order, TLS/HTTP2 (tls.peet.ws),
        # deviceinfo.me, CreepJS. Third-party sites change and go down, so this only reports.
        if: always()
        continue-on-error: true
        timeout-minutes: 25
        run: python3 scripts/live_compare.py --app build/unsandboxed/Lumen.app --out build/live
      - name: What sites see — a new profile's snapshot next to this Mac's Safari, as the panel takes it
        # The sandboxed build: its snapshot's listener (127.0.0.1, network.server) is the one under
        # test, and its profiles are in this app's own window. Safari is asked to open the page as
        # for a user; one that does not answer is a warning. After the egress capture, where
        # Safari's own traffic would count.
        if: always()
        timeout-minutes: 8
        run: |
          set +e
          build/sandboxed/Lumen.app/Contents/MacOS/Lumen --what-sites-see-check | tee build/what-sites-see.txt
          code=${PIPESTATUS[0]}
          # The summary as notices on the job, readable without the log (ten at most per step).
          grep "^WHAT-SITES-SEE" build/what-sites-see.txt | head -10 | cut -c1-1500 \
            | sed 's/^/::notice title=What sites see - this app'"'"'s window without a proxy::/'
          if [ "$code" = "2" ]; then echo "::warning::Safari did not answer the What-sites-see page on this runner"; exit 0; fi
          exit $code
      - name: What sites see — a profile with a proxy in Safari's window (the build without the App Sandbox)
        # What a customer's profile is: a process of its own showing Safari's window, an HTTP proxy
        # in its settings, WebRTC off. The proxy, 127.0.0.1:9, answers nothing: the measuring page
        # is on this Mac and loads directly, and the lookup of the proxy's location gets no answer,
        # so the profile keeps this Mac's language and time zone, as Safari does. Fails when the
        # window would not be Safari's.
        if: always()
        timeout-minutes: 8
        run: |
          set +e
          build/unsandboxed/Lumen.app/Contents/MacOS/Lumen --what-sites-see-check --safari-window --proxy 127.0.0.1:9 \
            | tee build/what-sites-see-safari-window-proxy.txt
          code=${PIPESTATUS[0]}
          grep "^WHAT-SITES-SEE" build/what-sites-see-safari-window-proxy.txt | head -10 | cut -c1-1500 \
            | sed 's/^/::notice title=What sites see - Safari'"'"'s window with a proxy::/'
          if [ "$code" = "2" ]; then echo "::warning::Safari did not answer the What-sites-see page on this runner"; exit 0; fi
          exit $code
      - name: What sites see — a profile without a proxy in Safari's window (the build without the App Sandbox)
        # Next to the step before: what the window changes, apart from what the proxy does.
        if: always()
        timeout-minutes: 8
        run: |
          set +e
          build/unsandboxed/Lumen.app/Contents/MacOS/Lumen --what-sites-see-check --safari-window \
            | tee build/what-sites-see-safari-window.txt
          code=${PIPESTATUS[0]}
          grep "^WHAT-SITES-SEE" build/what-sites-see-safari-window.txt | head -10 | cut -c1-1500 \
            | sed 's/^/::notice title=What sites see - Safari'"'"'s window without a proxy::/'
          if [ "$code" = "2" ]; then echo "::warning::Safari did not answer the What-sites-see page on this runner"; exit 0; fi
          exit $code
      - name: A jump to a fragment — the same document, in Safari and in a profile? (a measurement)
        # scripts/fragment_check.py; next to the macOS 27 job's same step (WebKit 27 made a new
        # document of such a jump in the self-test's web views).
        if: always()
        continue-on-error: true
        timeout-minutes: 12
        run: |
          set +e
          python3 scripts/fragment_check.py --app build/unsandboxed/Lumen.app | tee build/fragment.txt
          grep '^FRAGMENT' build/fragment.txt | head -9 | cut -c1-600 | sed 's/^/::notice title=fragment jump::/'
          exit 0
      - name: Apple Pay, Payment Request and Web Push — what their calls answer in Safari and in a profile (a measurement)
        # scripts/payments_check.py: one HTTPS page of this Mac (a throwaway authority, trusted for
        # the run and removed after; its key deleted once it has signed), whose own script is the
        # only one measuring; in Safari, and in new profiles with a proxy — as they ship, in this
        # app's window and in Safari's, and with WebKit's own switches for them on and the
        # profile's scripts in the page's world, in a world of their own, or none
        # (PaymentsCheck.swift). For the parity rule (ISOLATION §2); it never fails the build.
        if: always()
        continue-on-error: true
        timeout-minutes: 25
        run: |
          set +e
          python3 scripts/payments_check.py --app build/unsandboxed/Lumen.app --trust system --out build/payments \
            | tee build/payments.txt
          code=${PIPESTATUS[0]}
          grep "^PAYMENTS-SUMMARY" build/payments.txt | head -10 | cut -c1-2000 \
            | sed 's/^/::notice title=Payments and push - summary::/'
          if [ "$code" != "0" ]; then echo "::warning::payments_check.py exited $code (1: a variant did not report; 2: Safari did not; 3: every side reported, but the throwaway authority was not removed)"; fi
          grep "^PAYMENTS the throwaway authority" build/payments.txt | head -2 | cut -c1-600 \
            | sed 's/^/::notice title=Payments and push - the throwaway authority::/' || true
          exit 0
      - name: Apple Pay, Payment Request and Web Push — the answers
        if: always()
        run: |
          grep "^PAYMENTS-CALLS" build/payments.txt 2>/dev/null | head -10 | cut -c1-4000 \
            | sed 's/^/::notice title=Payments and push - answers::/' || true
      - name: Apple Pay, Payment Request and Web Push — the window's own properties only one side has
        if: always()
        run: |
          grep "^PAYMENTS-NAMES" build/payments.txt 2>/dev/null | head -10 | cut -c1-4000 \
            | sed 's/^/::notice title=Payments and push - window names::/' || true
      - name: The window's own properties a profile without a proxy lacks, by name (a measurement)
        # Without a proxy a profile in Safari's window has 1019 of Safari's 1044: WebRTC's 23 and
        # two more, which only a count named so far. The same page as the step above, the profile
        # without a proxy, over HTTP on 127.0.0.1 (a secure context too): trusting the step above's
        # throwaway authority a second time hung for 120 s in CI run 436, and names need no
        # certificate.
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        run: |
          set +e
          python3 scripts/payments_check.py --app build/unsandboxed/Lumen.app --http --out build/payments-direct \
            --proxy none --variants shipped-safari-window | tee build/payments-direct.txt
          grep "^PAYMENTS-NAMES" build/payments-direct.txt | head -5 | cut -c1-4000 \
            | sed 's/^/::notice title=Window names - Safari'"'"'s window without a proxy::/'
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fingerprint-surfaces
          path: |
            build/surface-sandboxed
            build/surface-unsandboxed
            build/safari-surface.json
            build/live
            build/leaks
            build/egress
            build/payments
            build/payments-direct
            build/crashes
            build/safari-inventory.txt
          if-no-files-found: ignore
      - name: App Sandbox container migration (unsandboxed data → sandboxed first launch)
        run: |
          # Separate bundle ID so the sandbox container does not exist yet.
          BUNDLE_ID=dev.local.PBMigrationCheck SANDBOX=0 APP_DIR=build/migration-old scripts/build-app.sh
          BUNDLE_ID=dev.local.PBMigrationCheck APP_DIR=build/migration-new scripts/build-app.sh
          # Writes a real vault into the runner's unsandboxed vault folder: CI only (see SelfTest.migrationStep).
          # Its profile's website data (a cookie, localStorage, IndexedDB) holds this token, which the
          # sandboxed build must read back from its container's layout.
          export PB_SELFTEST_MIGRATION_TOKEN="pbmigration$(date +%s)"
          PB_SELFTEST_MIGRATION=1 build/migration-old/Lumen.app/Contents/MacOS/Lumen --selftest-write-vault
          build/migration-new/Lumen.app/Contents/MacOS/Lumen --selftest-read-vault
          test ! -e "$HOME/Library/Application Support/PrivacyBrowser/vault.json" || { echo "vault was not moved"; exit 1; }
      - name: The product renamed — a vault of the last build named PrivacyBrowser opens in Lumen, its profile's website data with it
        # The rename (bundle ID dev.local.PrivacyBrowser → io.lumenbrowser.Lumen, executable
        # PrivacyBrowser → Lumen) leaves the vault's folder its name, ~/Library/Application Support/
        # PrivacyBrowser, which is where Lumen without the App Sandbox looks; what changes under a
        # profile is where WebKit keeps its website data, by bundle ID. The build of the last commit
        # before the rename — PrivacyBrowser.app, its own default bundle ID, as the owner's installs
        # are — writes a real vault into the runner's vault folder, with a profile whose cookie,
        # localStorage and IndexedDB it seals; the Lumen build opens that vault in place, restores the
        # profile's website data under its own bundle ID and reads the token back through WebKit.
        run: |
          set -euo pipefail
          old=194828b3dfa0a6c00059e03cbb84a454c4c2881c
          git fetch --no-tags --depth=1 origin "$old"
          git worktree add --detach build/old-identity-src "$old"
          (cd build/old-identity-src && SANDBOX=0 APP_DIR="$PWD/../old-identity" scripts/build-app.sh)
          app=build/old-identity/PrivacyBrowser.app
          old_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")"
          new_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' build/unsandboxed/Lumen.app/Contents/Info.plist)"
          echo "the last build named PrivacyBrowser: $old_id; Lumen: $new_id"
          [ "$old_id" = dev.local.PrivacyBrowser ] && [ "$new_id" = io.lumenbrowser.Lumen ] \
            || { echo "::error::the two builds are not the old and the new identity ($old_id, $new_id)"; exit 1; }
          vault="$HOME/Library/Application Support/PrivacyBrowser"
          test ! -e "$vault/vault.json" || { echo "::error::a vault is already in $vault"; exit 1; }
          export PB_SELFTEST_MIGRATION_TOKEN="pbrename$(date +%s)"
          PB_SELFTEST_MIGRATION=1 "$app/Contents/MacOS/PrivacyBrowser" --selftest-write-vault
          build/unsandboxed/Lumen.app/Contents/MacOS/Lumen --selftest-read-vault
          rm -rf "$vault"
          git worktree remove --force build/old-identity-src
      - uses: actions/upload-artifact@v4
        with:
          name: Lumen.app
          path: build/sandboxed/Lumen.app
      - name: Updates end to end, result
        if: always() && steps.updates.outcome == 'failure'
        run: |
          echo "::error::the end-to-end update scenarios failed; see the step \"Updates end to end\" and the update-check artifact"
          exit 1
      - name: UI snapshot checks
        if: always() && steps.ui.outcome == 'failure'
        run: |
          echo "::error::the UI snapshot step failed (a capture was not written, a click did not reach its button, a sheet did not fit its window, a window's own background showed at its edge, or the profile list was blank after a profile came back); see its log"
          exit 1
      - name: The self-test's notes (what it measured, skipped, or could not show on this runner)
        # Its INFO lines, last in the log, so that they can be read without the whole log.
        if: always()
        run: |
          for variant in sandboxed unsandboxed; do
            echo "--- self-test notes ($variant)"
            grep -h "^INFO" "build/egress/selftest-$variant.txt" | cut -c1-400 || true
          done
          # Every check the self-test could not make, on this runner or in that build: on the job's
          # page and in its summary, never only in the log.
          for variant in sandboxed unsandboxed; do
            log="build/egress/selftest-$variant.txt"
            grep -h "^SELFTEST [A-Z]*:" "$log" 2>/dev/null | head -1 | sed "s/^/::notice title=self-test ($variant)::/" || true
            grep -h "^SELFTEST SKIPPED" "$log" 2>/dev/null | cut -c1-600 | sed "s/^/::warning title=self-test ($variant) - skipped::/" || true
            {
              echo "### Self-test ($variant)"
              summary="$(grep -h "^SELFTEST [A-Z]*:" "$log" 2>/dev/null | head -1)"
              echo "    ${summary:-no summary line: the self-test did not finish}"
              grep -h "^SELFTEST SKIPPED" "$log" 2>/dev/null | cut -c1-600 | sed 's/^SELFTEST SKIPPED /- /' || true
            } >> "$GITHUB_STEP_SUMMARY"
          done
          # What real input reached on this runner, as notices on the job (readable without the log).
          grep -h "^INFO \(paste as typed\|what sites see\|password AutoFill\)" build/egress/selftest-unsandboxed.txt \
            | head -8 | cut -c1-300 | sed 's/^/::notice title=self-test::/' || true
          # The XPC services that started while a profile ran in Safari's chrome, and what they held open.
          grep -h "^INFO XPC service" build/egress/selftest-unsandboxed.txt \
            | head -6 | cut -c1-1500 | sed 's/^/::notice title=self-test - XPC services::/' || true
          # Measured next to the macOS 27 job's same lines.
          grep -h "^INFO fragment jump" build/egress/selftest-unsandboxed.txt \
            | head -8 | cut -c1-1000 | sed 's/^/::notice title=self-test - measured::/' || true
