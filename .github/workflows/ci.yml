name: CI

# A reproduction branch only, never merged (the owner, 3 November: a person's history, cookies and
# saved logins gone from every profile after signing out of the account, into other accounts and
# back). The product's own CI does not run here: the app is built as CI builds it, then the account
# switch check measures every profile's data at each step (scripts/account_switch_check.py).
on:
  push:

jobs:
  account-switch:
    name: Account switch — ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, xcode-27]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: The machine
        run: sw_vers
      - name: Build the app without the App Sandbox (the release's kind)
        run: SANDBOX=0 APP_DIR=build/unsandboxed scripts/build-app.sh
      - name: The account switch — a profile's data at every step
        run: python3 -u scripts/account_switch_check.py --app build/unsandboxed/Lumen.app --out build/account-switch
      - name: The control — the person's loss made at the first sign-out, the check must fail
        if: always()
        run: python3 -u scripts/account_switch_check.py --app build/unsandboxed/Lumen.app --out build/account-switch/control --control
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: account-switch-${{ matrix.runner }}
          path: build/account-switch
          if-no-files-found: ignore
