name: CI

# MEASUREMENT BRANCH (claude/measure-dmg): the disk image the website offers — can Finder lay out
# its window on a CI runner (AppleScript), how the window looks in the light and the dark
# appearance (Finder writes the icons' names black or white), and what Gatekeeper says of an
# image that is not notarized (the control a clean-system check must reject).

on:
  push:

jobs:
  dmg:
    name: Disk image — ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, xcode-27]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: The machine
        run: |
          sw_vers
          defaults read -g AppleInterfaceStyle 2>/dev/null || echo "appearance: light"
      - name: Build the app without the App Sandbox
        timeout-minutes: 30
        run: SANDBOX=0 APP_DIR=build/unsandboxed scripts/build-app.sh
      - name: The background picture
        run: |
          mkdir -p build/dmg-shots
          build/unsandboxed/Lumen.app/Contents/MacOS/Lumen --render-dmg-background build/dmg-shots/background
          ls -la build/dmg-shots/background
      - name: The disk image (Finder's layout optional here)
        timeout-minutes: 10
        run: |
          set +e
          time scripts/make_dmg.sh build/unsandboxed/Lumen.app build/Lumen-test.dmg --layout optional
          echo "exit $?"
          ls -la build/Lumen-test.dmg
      - name: The window, light and dark
        continue-on-error: true
        timeout-minutes: 10
        run: |
          set +e
          shot() {
            hdiutil attach build/Lumen-test.dmg -readonly -noverify > build/dmg-shots/attach-$1.txt
            sleep 2; open /Volumes/Lumen; sleep 4
            screencapture -x build/dmg-shots/screen-$1.png; echo "screencapture $1: $?"
            osascript -e 'tell application "Finder" to get bounds of window 1' 2>&1 | sed "s/^/bounds $1: /"
            hdiutil detach /Volumes/Lumen -force -quiet
          }
          shot light
          defaults write -g AppleInterfaceStyle -string Dark
          killall Finder; sleep 4
          shot dark
          defaults delete -g AppleInterfaceStyle
          killall Finder
          ls -la build/dmg-shots
      - name: Gatekeeper on an image that is not notarized (quarantined as a browser would)
        continue-on-error: true
        run: |
          set +e
          cp build/Lumen-test.dmg build/Lumen-quarantined.dmg
          xattr -w com.apple.quarantine "0083;$(printf %x "$(date +%s)");Safari;$(uuidgen)" build/Lumen-quarantined.dmg
          spctl --assess --type open --context context:primary-signature --verbose=4 build/Lumen-quarantined.dmg; echo "spctl dmg: $?"
          xcrun stapler validate build/Lumen-quarantined.dmg; echo "stapler: $?"
          command -v syspolicy_check && { syspolicy_check distribution build/unsandboxed/Lumen.app; echo "syspolicy_check: $?"; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dmg-shots-${{ matrix.runner }}
          path: build/dmg-shots
          if-no-files-found: ignore
