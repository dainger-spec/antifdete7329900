name: CI

on:
  push:
  pull_request:

jobs:
  core-linux:
    name: Core tests (Linux, swift-crypto)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - run: swift test

  shims:
    name: JavaScript shim tests (Node)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: TZ=America/New_York node scripts/test-shims.mjs
      # Every test again on the shim as a worker's blob gets it: one line, made by the shim from its
      # own text (a mistake there would break the page's workers, not only the shim).
      - run: TZ=America/New_York SHIM_FORM=worker node scripts/test-shims.mjs
      # The same tests under JavaScriptCore, the engine Safari runs: own-property order, error
      # messages and function text differ from V8 in ways a page can see.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - run: TZ=America/New_York bun scripts/test-shims.mjs
      - run: TZ=America/New_York SHIM_FORM=worker bun scripts/test-shims.mjs

  macos:
    name: macOS build, core tests, WebKit self-test
    # The newest macOS and Xcode: WebKit enables several features only for apps linked against
    # the current SDK (Trusted Types, …), and the Safari comparison should see the same engine
    # and feature set a user of the current macOS gets.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test
      - name: Build sandboxed app (default)
        run: APP_DIR=build/sandboxed scripts/build-app.sh
      - name: Build unsandboxed app, and the packet-tunnel extension (unsigned, NE=check)
        # The extension needs a provisioned team to be signed and loaded (NE=1); CI compiles it
        # against this SDK and lays out its bundle so its plists are checked.
        run: NE=check SANDBOX=0 APP_DIR=build/unsandboxed scripts/build-app.sh
      - name: UI snapshots for design review, and clicks through the transparent title bar
        # The app's screens rendered with sample data (UISnapshots.swift) in both UI languages, uploaded
        # as the ui-snapshots artifact. A click that does not reach its button fails the job at the end.
        id: ui
        continue-on-error: true
        timeout-minutes: 8
        run: |
          status=0
          for lang in en ru; do
            PRIVACYBROWSER_LANG=$lang build/unsandboxed/PrivacyBrowser.app/Contents/MacOS/PrivacyBrowser --render-ui-snapshots "$PWD/build/ui-snapshots/$lang" || status=1
          done
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-snapshots
          path: build/ui-snapshots
          if-no-files-found: ignore
      - name: Self-test against real WebKit (sandboxed and unsandboxed)
        run: |
          python3 scripts/selftest_proxy.py --http 18080 --socks 18081 --http-auth 18082 --http6 18083 --socks2 18084 --socks-auth 18085 --socks-jp 18086 &
          PROXY_PID=$!
          sleep 1
          export PB_SELFTEST_HTTP_PROXY_PORT=18080 PB_SELFTEST_SOCKS_PROXY_PORT=18081 PB_SELFTEST_HTTP_AUTH_PROXY_PORT=18082 PB_SELFTEST_HTTP6_PROXY_PORT=18083
          export PB_SELFTEST_SOCKS2_PROXY_PORT=18084 PB_SELFTEST_SOCKS_AUTH_PROXY_PORT=18085 PB_SELFTEST_SOCKS_JP_PROXY_PORT=18086
          status=0
          for variant in sandboxed unsandboxed; do
            echo "::group::self-test ($variant)"
            # The surface dump goes to the repository folder, which only the unsandboxed build may write.
            if [ "$variant" = unsandboxed ]; then export PB_SELFTEST_SURFACE_OUT="$PWD/build/surface-$variant"; fi
            build/$variant/PrivacyBrowser.app/Contents/MacOS/PrivacyBrowser --self-test || status=1
            echo "::endgroup::"
          done
          kill $PROXY_PID || true
          exit $status
      - name: Compare the fingerprint surface with this Mac's real Safari (safaridriver)
        run: |
          sudo safaridriver --enable || echo "::warning::safaridriver --enable failed"
          python3 scripts/safari_reference.py --compare build/surface-unsandboxed/surface-macos.json --out build/safari-surface.json
          code=$?
          if [ "$code" = "2" ]; then echo "::warning::Safari could not be driven on this runner; surface not compared"; exit 0; fi
          exit $code
      - name: Leak check — does QUIC or WebRTC go around a profile's proxy?
        # Real forwarding proxies on this runner and a profile without one as the control; see
        # scripts/leak_check.py. Fails on traffic seen going around a proxy, or on a TLS/HTTP2
        # fingerprint that changes through one (a site that is down makes it inconclusive, not red).
        if: always()
        timeout-minutes: 10
        run: python3 scripts/leak_check.py --app build/unsandboxed/PrivacyBrowser.app --out build/leaks
      - name: Live fingerprinting pages in Safari and in profiles (report, never fails the build)
        # The same pages and scripts in this Mac's Safari and in on-screen profile windows of the
        # same size: probe, window geometry, request header order, TLS/HTTP2 (tls.peet.ws),
        # deviceinfo.me, CreepJS. Third-party sites change and go down, so this only reports.
        if: always()
        continue-on-error: true
        timeout-minutes: 25
        run: python3 scripts/live_compare.py --app build/unsandboxed/PrivacyBrowser.app --out build/live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fingerprint-surfaces
          path: |
            build/surface-sandboxed
            build/surface-unsandboxed
            build/safari-surface.json
            build/live
            build/leaks
          if-no-files-found: ignore
      - name: App Sandbox container migration (unsandboxed data → sandboxed first launch)
        run: |
          # Separate bundle ID so the sandbox container does not exist yet.
          BUNDLE_ID=dev.local.PBMigrationCheck SANDBOX=0 APP_DIR=build/migration-old scripts/build-app.sh
          BUNDLE_ID=dev.local.PBMigrationCheck APP_DIR=build/migration-new scripts/build-app.sh
          # Writes a real vault into the runner's unsandboxed vault folder: CI only (see SelfTest.migrationStep).
          PB_SELFTEST_MIGRATION=1 build/migration-old/PrivacyBrowser.app/Contents/MacOS/PrivacyBrowser --selftest-write-vault
          build/migration-new/PrivacyBrowser.app/Contents/MacOS/PrivacyBrowser --selftest-read-vault
          test ! -e "$HOME/Library/Application Support/PrivacyBrowser/vault.json" || { echo "vault was not moved"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: PrivacyBrowser.app
          path: build/sandboxed/PrivacyBrowser.app
      - name: UI snapshot checks
        if: always() && steps.ui.outcome == 'failure'
        run: |
          echo "::error::the UI snapshot step failed (a capture was not written or a click did not reach its button); see its log"
          exit 1

  safari-graph:
    name: SAFARI_GRAPH spike — Safari.framework in our process (${{ matrix.os }})
    # Research measurements for docs/SAFARI_GRAPH_SPIKE.md: can this app load the system Safari UI
    # frameworks in its own process instead of its WKWebView chrome? Kept apart from the main job so the
    # main self-test is exactly as before. The load probe runs on both runners (SIP is on, as on a stock
    # Mac); the app, its new-mode self-test and the surface comparison need the current SDK (macOS 26).
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: How Safari is put together here (SIP, versions, where its frameworks are, what it links)
        run: |
          set +e
          sw_vers
          echo "== SIP"; csrutil status
          echo "== Safari.app"; ls -la /Applications/Safari.app
          SAFARI_APP="$(cd /Applications/Safari.app 2>/dev/null && pwd -P)"; echo "resolved: $SAFARI_APP"
          defaults read "$SAFARI_APP/Contents/Info.plist" CFBundleShortVersionString
          defaults read "$SAFARI_APP/Contents/Info.plist" CFBundleVersion
          echo "== Safari's executable links (how it brings its UI up)"; otool -L "$SAFARI_APP/Contents/MacOS/Safari" | head -40
          echo "== Safari's executable size"; ls -la "$SAFARI_APP/Contents/MacOS/"
          echo "== Safari's entitlements (what a third-party process does not have)"
          codesign -d --entitlements - --xml "$SAFARI_APP" 2>/dev/null | grep -o '<key>[^<]*</key>' | sed 's/<[^>]*>//g'
          echo "== Safari's signature"; codesign -dvvv "$SAFARI_APP" 2>&1 | grep -v '^Hash\|^CandidateCDHash\|^CDHash' | head -30
          for root in /System/Library/StagedFrameworks/Safari /System/Cryptexes/App/System/Library/StagedFrameworks/Safari; do
            echo "== $root"; ls -la "$root" 2>&1 | head -40
          done
          for fw in /System/Library/StagedFrameworks/Safari/Safari.framework /System/Cryptexes/App/System/Library/StagedFrameworks/Safari/Safari.framework; do
            if [ -e "$fw" ]; then
              echo "== $fw"; ls -la "$fw" "$fw/Versions" 2>&1 | head -20
              bin="$fw/Versions/A/Safari"; [ -e "$bin" ] || bin="$fw/Safari"
              echo "-- signature of $bin"; codesign -dvvv "$bin" 2>&1 | grep -v '^Hash\|^CandidateCDHash\|^CDHash' | head -30
              echo "-- what it links"; otool -L "$bin" 2>&1 | head -60
            fi
          done
          exit 0
      - name: Load probe — Safari.framework under each hardened-runtime exception in turn
        run: GRAPH_STRICT=1 scripts/safari_graph/measure.sh build/safari-graph
      - name: Build the unsandboxed app (SANDBOX=0)
        if: matrix.os == 'macos-26'
        run: SANDBOX=0 APP_DIR=build/unsandboxed scripts/build-app.sh
      - name: New-mode self-test — the gate, a window, a page, language and time zone, two profiles
        if: matrix.os == 'macos-26'
        run: |
          PB_SELFTEST_SURFACE_OUT="$PWD/build/surface-graph" \
            build/unsandboxed/PrivacyBrowser.app/Contents/MacOS/PrivacyBrowser --safari-graph-selftest
      - name: New-mode profile against this Mac's Safari (scripts/safari_reference.py, reported)
        if: matrix.os == 'macos-26'
        run: |
          sudo safaridriver --enable || echo "::warning::safaridriver --enable failed"
          python3 scripts/safari_reference.py --compare build/surface-graph/surface-graph-macos.json --out build/safari-surface-graph.json
          code=$?
          if [ "$code" = "2" ]; then echo "::warning::Safari could not be driven on this runner; surface not compared"; exit 0; fi
          if [ "$code" != "0" ]; then echo "::warning::the new-mode surface differs from Safari in a must-match key (see the log)"; fi
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safari-graph-${{ matrix.os }}
          path: |
            build/safari-graph
            build/surface-graph
            build/safari-surface-graph.json
          if-no-files-found: ignore
