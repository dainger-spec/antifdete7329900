name: CI
# Scratch branch: CI here is the OpenVPN feasibility spike only.
on:
  push:
    branches: ['**']

jobs:
  openvpn-spike:
    name: OpenVPN unprivileged spike (macOS 26)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/openvpn_spike.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openvpn-spike
          path: ${{ runner.temp }}/ovpn/out
