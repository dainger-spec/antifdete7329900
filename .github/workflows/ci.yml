name: CI

# A measurement branch only: the menu walk, compared with its records, with Safari's window state
# kept in the profile's home (SafariUIState) on top of the local queue (the menu's items outside the
# profile gone, Home the start page). Never merged.
on:
  push:

jobs:
  walk:
    name: The menu walk on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, xcode-27]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Build the app without the App Sandbox
        run: SANDBOX=0 APP_DIR=build/unsandboxed scripts/build-app.sh
      - name: Menu walk
        continue-on-error: true
        timeout-minutes: 45
        run: |
          major="$(defaults read /Applications/Safari.app/Contents/Info.plist CFBundleShortVersionString | cut -d. -f1)"
          python3 scripts/menu_walk.py --app build/unsandboxed/PrivacyBrowser.app --out build/measure/menu-walk \
            --title "${{ matrix.runner }} - menu walk" --record "docs/menu-walk/safari-$major.json" --check \
            --ignore "$HOME/Library/Logs:$HOME/actions-runner:$HOME/runners"
      - name: Where Safari's window state went
        if: always()
        run: grep -h "MENUWALK-INFO .*preferences" build/measure/menu-walk/*.txt 2>/dev/null | cut -c1-1500 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: walk-${{ matrix.runner }}
          path: build/measure
          if-no-files-found: ignore
