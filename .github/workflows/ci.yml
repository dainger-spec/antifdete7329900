name: CI

# A measurement branch only: from which declared SDK, and with WebKit's network loader on or off,
# this Mac fetches a certificate's missing intermediate outside a profile's proxy on macOS 27
# (scripts/aia_variants.py, BrowserSession.applyMeasuredFeatures). Never merged.
on:
  push:

jobs:
  aia-27:
    name: The AIA canary with the network loader set, on macOS 27
    runs-on: xcode-27
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Build the app without the App Sandbox
        run: SANDBOX=0 APP_DIR=build/unsandboxed scripts/build-app.sh
      - name: The variants
        continue-on-error: true
        timeout-minutes: 25
        run: |
          python3 scripts/aia_variants.py --app build/unsandboxed/PrivacyBrowser.app --sdk "" \
            --out build/measure/aia-variants --title "macOS 27 - AIA, network loader"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aia-loader-27
          path: build/measure
          if-no-files-found: ignore
