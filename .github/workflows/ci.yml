name: CI

# A measurement branch only, never merged (the owner, 2 November: ten SOCKS5 proxies bought for
# UDP — does each carry UDP, from the address its TCP leaves from, fast enough for a call?). The
# product's own CI does not run here (scripts/measure/proxy_udp.py). The proxies and their login
# come from the repository secret PB_TEST_PROXIES; the repository is public, so the summary names
# no address and the full report is kept only encrypted to a key outside the repository.
on:
  push:

jobs:
  proxy-udp:
    name: SOCKS5 UDP of the bought proxies (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Each proxy, in turn — TCP exit, UDP ASSOCIATE, STUN, TURN, round trips, a second association
        env:
          PB_TEST_PROXIES: ${{ secrets.PB_TEST_PROXIES }}
        run: python3 -u scripts/measure/proxy_udp.py --out build/proxy-udp --pubkey scripts/measure/report_key.pub --label "${{ matrix.runner }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proxy-udp-${{ matrix.runner }}
          path: build/proxy-udp
          if-no-files-found: ignore
