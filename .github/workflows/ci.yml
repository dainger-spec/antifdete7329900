name: CI

# A measurement branch only (claude/measure-real-proxy), never merged: the owner's proxies
# (PB_TEST_PROXIES, a repository secret) where earlier reports had to say "the proxy was local".
# The repository is public: what is printed names no address and no login; the full reports are
# uploaded only encrypted to scripts/measure/report_key.pub, whose private half is not here.
on:
  push:

jobs:
  proxy-udp:
    name: SOCKS5 UDP of the bought proxies (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Each proxy, in turn — TCP exit (and the app's own way), UDP ASSOCIATE, STUN, TURN, round trips, the gate's verdict
        env:
          PB_TEST_PROXIES: ${{ secrets.PB_TEST_PROXIES }}
        run: python3 -u scripts/measure/proxy_udp.py --out build/proxy-udp --pubkey scripts/measure/report_key.pub --label "ubuntu-24.04"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proxy-udp-ubuntu-24.04
          path: |
            build/proxy-udp/summary.md
            build/proxy-udp/report.json.enc
            build/proxy-udp/key.enc
          if-no-files-found: ignore

  real-proxy:
    name: A profile behind a real proxy — UDP of all ten, what sites see, live services, every packet (macos-26)
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Is the secret there?
        id: secret
        env:
          PB_TEST_PROXIES: ${{ secrets.PB_TEST_PROXIES }}
        run: |
          if [ -n "$PB_TEST_PROXIES" ]; then
            echo "have=yes" >> "$GITHUB_OUTPUT"
          else
            echo "REAL-PROXY SKIPPED: no PB_TEST_PROXIES (a repository secret, host:port:login:password per line)"
            echo "have=no" >> "$GITHUB_OUTPUT"
          fi
      - name: Each proxy, in turn, from macOS
        if: steps.secret.outputs.have == 'yes'
        env:
          PB_TEST_PROXIES: ${{ secrets.PB_TEST_PROXIES }}
        run: python3 -u scripts/measure/proxy_udp.py --out build/proxy-udp --pubkey scripts/measure/report_key.pub --label "macos-26"
      - name: Build the app without the App Sandbox
        if: steps.secret.outputs.have == 'yes'
        run: SANDBOX=0 APP_DIR=build/unsandboxed scripts/build-app.sh
      - name: A profile behind proxy 1 — what sites see, live services through it, where its packets went
        if: steps.secret.outputs.have == 'yes'
        env:
          PB_TEST_PROXIES: ${{ secrets.PB_TEST_PROXIES }}
        run: python3 -u scripts/measure/real_proxy.py --app build/unsandboxed/Lumen.app --out build/real-proxy --pubkey scripts/measure/report_key.pub --index 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-proxy-macos-26
          path: |
            build/proxy-udp/summary.md
            build/proxy-udp/report.json.enc
            build/proxy-udp/key.enc
            build/real-proxy/summary.md
            build/real-proxy/report.tar.enc
            build/real-proxy/key.enc
          if-no-files-found: ignore
