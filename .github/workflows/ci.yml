name: CI

# A measurement branch only (the owner's questions of 31 October), never merged: one HTTPS page of the
# runner in Safari, in a profile as it ships, and in a profile with WebKit's own switches for
# WebTransport, Web Authentication, Digital Credentials and the MediaSession coordinator on
# (scripts/payments_check.py, variant "parity") — what each call answers and how long it takes; whether
# WebKit asks the app to run a web authentication panel, and what the page gets when the app cancels
# it; and, around it all, every UDP packet to 192.0.2.1 with the process that sent it (WebTransport is
# QUIC over UDP, which no proxy here carries).
on:
  push:

jobs:
  parity:
    name: The four, measured on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, xcode-27]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build the app without the App Sandbox
        run: SANDBOX=0 APP_DIR=build/unsandboxed scripts/build-app.sh
      - name: Safari, a shipped profile and the parity profile, under a capture of UDP to 192.0.2.1
        continue-on-error: true
        timeout-minutes: 40
        run: |
          mkdir -p build/parity
          sudo tcpdump -i pktap,all -k NP -n -tt -l 'udp and host 192.0.2.1' > build/parity/udp.txt 2> build/parity/tcpdump.err &
          sleep 2
          code=0
          python3 scripts/payments_check.py --app build/unsandboxed/PrivacyBrowser.app --trust system --out build/parity \
            --variants shipped,parity --proxy 127.0.0.1:9 | tee build/parity/check.txt || code=$?
          sleep 2
          sudo pkill -INT -f "tcpdump -i pktap" || true
          sleep 1
          exit $code
      - name: What was measured
        if: always()
        run: |
          echo "== the parity profile's switches and the web authentication panel"
          grep -h "PAYMENTS-CHECK parity" build/parity/check.txt || true
          echo "== the four, side by side"
          python3 - <<'PY'
          import json
          reports = json.load(open("build/parity/payments.json"))
          keys = [k for k in (reports.get("safari") or {}).get("calls", {}) if any(w in k for w in
                  ("WebTransport", "PublicKeyCredential", "credentials", "DigitalCredential", "mediaSession", "MediaSessionCoordinator"))]
          for side in ("safari", "shipped", "parity"):
              report = reports.get(side)
              if not report:
                  print(f"{side}: no report"); continue
              print(f"== {side}: window's own names {report.get('windowOwnCount')}; present: "
                    + ", ".join(f"{n}={report['present'].get(n)}" for n in ("WebTransport", "PublicKeyCredential", "DigitalCredential", "MediaSessionCoordinator")))
              for key in keys:
                  print(f"   {key}: {json.dumps(report['calls'].get(key), ensure_ascii=False)}")
          PY
          echo "== UDP to 192.0.2.1, by process (pktap)"
          wc -l < build/parity/udp.txt
          grep -o "proc [^ ,]*\|[a-zA-Z.]*:[0-9]*\]" build/parity/udp.txt | sort | uniq -c | sort -rn | head -20 || true
          head -5 build/parity/udp.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-${{ matrix.runner }}
          path: build/parity
          if-no-files-found: ignore
