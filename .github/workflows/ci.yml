name: CI

# A measurement branch only: the fix that keeps the real Safari's container preferences out of a
# profile's process (SafariPaths.redirectDefaultsSuites), checked ahead of the main branch with the
# menu walk as CI runs it — sentinels set in the real Safari's own preferences first, read back after.
# Never merged.
on:
  push:

jobs:
  walk:
    name: The menu walk with the real Safari's domain read around it, on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, xcode-27]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build the app without the App Sandbox
        run: SANDBOX=0 APP_DIR=build/unsandboxed scripts/build-app.sh
      - name: The real Safari's container, as on a Mac where Safari has run
        run: |
          if [ ! -d "$HOME/Library/Containers/com.apple.Safari" ]; then
            open -b com.apple.Safari; sleep 12; killall Safari || true; sleep 3
          fi
          ls -d "$HOME/Library/Containers/com.apple.Safari" || echo "no container"
      - name: Menu walk
        timeout-minutes: 40
        run: |
          major="$(defaults read /Applications/Safari.app/Contents/Info.plist CFBundleShortVersionString | cut -d. -f1)"
          python3 scripts/menu_walk.py --app build/unsandboxed/PrivacyBrowser.app --out build/measure/menu-walk \
            --title "${{ matrix.runner }} - menu walk" --record "docs/menu-walk/safari-$major.json" --check \
            --ignore "$HOME/Library/Logs:$HOME/actions-runner:$HOME/runners" --safari-sentinels
      - name: Where the profile's Safari domains went
        if: always()
        run: |
          grep -h "MENU-WALK the real Safari\|real Safari's own preferences" build/measure/menu-walk/*.txt 2>/dev/null || true
          defaults read com.apple.Safari SearchProviderIdentifier || true
          defaults read com.apple.Safari PBMenuWalkSentinel || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k9-${{ matrix.runner }}
          path: build/measure
          if-no-files-found: ignore
