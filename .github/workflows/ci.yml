name: CI

# A measurement branch only: do the com.apple.Safari keys a profile's process wrote before dbea98c
# reach the real Safari? (scripts/safari_prefs_reach.py) Never merged anywhere.
on:
  push:

jobs:
  measure:
    name: Safari's preferences on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, xcode-27]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: The keys, the real Safari, a canary
        run: python3 scripts/safari_prefs_reach.py --out build/measure/safari-prefs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safari-prefs-${{ matrix.runner }}
          path: build/measure
          if-no-files-found: ignore
