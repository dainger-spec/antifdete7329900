name: CI

# Measurement branch claude/measure-safari-engines (never merged): Safari with a WebKit of its own
# and this Mac's apps on the system's — a state a Mac lives in, or a machine not restarted since
# Safari's update? (scripts/measure_engines.sh), and the probe in that Safari three ways
# (scripts/measure_safari_worlds.py). Several macos-26 jobs: runner images 20261026 (one engine)
# and 20261102 (two) are both in rotation; each job names its image.
on:
  push:
    branches: ['**']

jobs:
  engines:
    name: Engines — ${{ matrix.runner }} ${{ matrix.n }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-26, n: 1}
          - {runner: macos-26, n: 2}
          - {runner: macos-26, n: 3}
          - {runner: macos-26, n: 4}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Whose WebKit, since when, and how Safari finds its own
        timeout-minutes: 10
        run: scripts/measure_engines.sh
      - name: The probe in Safari — WebDriver's execute, the page's own world, a plain window
        if: always()
        timeout-minutes: 10
        run: |
          if [[ "${ImageVersion:-0}" < "20261102" ]]; then echo "image ${ImageVersion:-?}: Safari shares the apps' WebKit here; measured in cd17407"; exit 0; fi
          sudo safaridriver --enable || echo "safaridriver --enable failed"
          mkdir -p build
          MEASURE_OUT=build/worlds-${{ matrix.runner }}-${{ matrix.n }}.json python3 scripts/measure_safari_worlds.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engines-${{ matrix.runner }}-${{ matrix.n }}
          path: build/worlds-*.json
          if-no-files-found: ignore
