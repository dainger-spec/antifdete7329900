name: CI

# A measurement branch only: what WebKit and CFNetwork offer about the network loader WebKit uses
# from SDK 15.0 on, and about the check of a server's certificate (PrivacyBrowser
# --loader-inventory), as built and with every behavior on. Never merged.
on:
  push:

jobs:
  inventory:
    name: The loader and trust inventory on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, xcode-27]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build the app without the App Sandbox
        run: SANDBOX=0 APP_DIR=build/unsandboxed scripts/build-app.sh
      - name: As built, and with every behavior on
        continue-on-error: true
        run: |
          mkdir -p build/inventory
          app=build/unsandboxed/PrivacyBrowser.app/Contents/MacOS/PrivacyBrowser
          "$app" --loader-inventory > build/inventory/as-built.txt 2> build/inventory/as-built.err; echo "exit $?"
          "$app" --loader-inventory --sdk-everything > build/inventory/everything.txt 2> build/inventory/everything.err; echo "exit $?"
          cat build/inventory/as-built.txt
          echo "== differences with every behavior on"
          diff build/inventory/as-built.txt build/inventory/everything.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loader-inventory-${{ matrix.runner }}
          path: build/inventory
          if-no-files-found: ignore
