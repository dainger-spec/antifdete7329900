name: CI

# A measurement branch only, never merged (the owner, 2 November: "numbers, not code" — WebRTC and
# the camera in a profile, next to this Mac's Safari, on our probe pages and live fingerprinting
# services; and whether WebKit can keep the WebRTC API while no packet leaves). The product's own CI
# does not run here (scripts/measure/rtc_media.py).
on:
  push:

jobs:
  measure:
    name: WebRTC and media, what a site sees (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, xcode-27]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: The machine
        run: |
          sw_vers; xcodebuild -version | head -1
          defaults read /Applications/Safari.app/Contents/Info.plist CFBundleShortVersionString
          system_profiler SPCameraDataType SPAudioDataType 2>/dev/null | head -40 || true
      - name: Build the app without the App Sandbox
        run: SANDBOX=0 APP_DIR=build/unsandboxed scripts/build-app.sh
      - name: Let safaridriver drive Safari; ask Safari for WebKit's mock capture devices (where it reads the setting)
        run: |
          sudo safaridriver --enable
          for key in WebKitMockCaptureDevicesEnabled WebKitPreferences.mockCaptureDevicesEnabled \
                     com.apple.Safari.ContentPageGroupIdentifier.WebKit2MockCaptureDevicesEnabled; do
            defaults write com.apple.Safari "$key" -bool true 2>&1 | head -1 || true
          done
          defaults read com.apple.Safari 2>/dev/null | grep -i mock || echo "no mock setting readable in com.apple.Safari"
      - name: WebRTC and the camera — our probe, live services, WebKit's switches under pktap
        timeout-minutes: 75
        run: python3 scripts/measure/rtc_media.py --app build/unsandboxed/Lumen.app --out build/measure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtc-media-${{ matrix.runner }}
          path: build/measure
          if-no-files-found: ignore
