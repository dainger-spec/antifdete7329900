name: CI

# MEASUREMENT BRANCH (claude/measure-settings-window), round 2 — the band check made strict (tolerance
# 2 and the design's cool cast; round 1, run 596, passed the band it was meant to see): the current
# code must FAIL, SwiftUI's toolbar background hidden must PASS, on both macOS, light and dark.
# Round 1: the Settings window as the person gets it —
# the real app started, Settings opened by the app menu's Settings… item (⌘,), the window SwiftUI's
# Settings scene made captured by the window server, read row by row for a band of a tone that is
# not the design's. The current code (the owner, 2 November: a grey band at the top), then ways to
# take the band away, each in its own launch: the toolbar removed or hidden by AppKit, SwiftUI's own
# toolbar modifiers. In the light and the dark appearance of the Mac.

on:
  push:

jobs:
  settings-window:
    name: Settings window — ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, xcode-27]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: The machine
        run: |
          sw_vers
          system_profiler SPDisplaysDataType 2>/dev/null | sed -n 1,40p || true
      - name: Build the app without the App Sandbox (the build released)
        timeout-minutes: 35
        run: SANDBOX=0 APP_DIR=build/unsandboxed scripts/build-app.sh
      - name: The real Settings window, as the code is and each way of taking the band away
        timeout-minutes: 20
        run: |
          set +e
          mkdir -p build/settings-window
          window() {
            local name="$1" variant="$2"
            local vault; vault="$(mktemp -d)"
            rm -rf "$HOME/Library/Saved Application State/io.lumenbrowser.Lumen.savedState"
            echo "::group::$name (PB_MEASURE_SETTINGS=$variant)"
            PRIVACYBROWSER_VAULT_DIR="$vault" PB_MEASURE_SETTINGS="$variant" \
              perl -e 'alarm shift; exec @ARGV' 90 \
              build/unsandboxed/Lumen.app/Contents/MacOS/Lumen --settings-window-check "build/settings-window/$name" \
              -ApplePersistenceIgnoreState YES > "build/settings-window/$name.txt" 2>&1
            echo "exit $?" >> "build/settings-window/$name.txt"
            grep -E "^(SETTINGS-WINDOW|PASS|FAIL)|^exit" "build/settings-window/$name.txt"
            echo "::endgroup::"
            grep -E "^(PASS|FAIL)|^exit" "build/settings-window/$name.txt" | sed "s/^/$name: /" >> build/settings-window/summary.txt
            rm -rf "$vault"
            sleep 2
          }
          window light-current ""
          window light-swiftui-background-hidden swiftui-background-hidden
          osascript -e 'tell application "System Events" to tell appearance preferences to set dark mode to true'
          sleep 3
          window dark-current ""
          window dark-swiftui-background-hidden swiftui-background-hidden
          osascript -e 'tell application "System Events" to tell appearance preferences to set dark mode to false'
          echo "::group::summary"
          cat build/settings-window/summary.txt
          echo "::endgroup::"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settings-window-${{ matrix.runner }}
          path: build/settings-window
          if-no-files-found: ignore
