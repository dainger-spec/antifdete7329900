name: CI
# Scratch branch claude/ux-c-check — never merged. CI here: the app built on macOS (the SwiftUI
# target does not build on Linux), both builds, and the UI snapshots in both languages, with area C's
# (the profile's window, virtual machines, scenarios, warm-up) gathered into ux-c-shots.
on:
  push:
    branches: ['claude/ux-c-check']

env:
  PB_GEO_SERVICES_OFF: "1"

jobs:
  uxc:
    name: macOS build, area C's snapshots
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Build unsandboxed app
        run: VM=check SANDBOX=0 APP_DIR=build/unsandboxed scripts/build-app.sh
      - name: Build sandboxed app (default)
        run: APP_DIR=build/sandboxed scripts/build-app.sh
      - name: UI snapshots, both languages
        id: ui
        continue-on-error: true
        timeout-minutes: 30
        run: |
          set -o pipefail
          status=0
          mkdir -p build/ui-snapshots
          for lang in en ru; do
            PRIVACYBROWSER_LANG=$lang build/unsandboxed/Lumen.app/Contents/MacOS/Lumen --render-ui-snapshots "$PWD/build/ui-snapshots/$lang" \
              | tee "build/ui-snapshots/$lang.log" || status=1
          done
          mkdir -p build/ux-c-shots
          for lang in en ru; do
            for f in build/ui-snapshots/$lang/*.png; do
              case "$(basename "$f")" in
                browser-*|safari-*|simplified-*|vm-*|scenarios-*|warmup-*|narrow-*) cp "$f" "build/ux-c-shots/$lang-$(basename "$f")" ;;
              esac
            done
          done
          grep -hE '^FAIL' build/ui-snapshots/*.log | head -20 || true
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux-c-shots
          path: build/ux-c-shots
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-snapshots-logs
          path: build/ui-snapshots/*.log
          if-no-files-found: ignore
