name: CI

# A measurement branch only: does a write through a preferences domain named by the path of the real
# Safari's container plist — as Safari's own code makes some in a profile's process (run 496) — reach
# the real Safari? And where does a domain named by a path land (SafariUIState)?
# (scripts/container_path_reach.py) Never merged anywhere.
on:
  push:

jobs:
  measure:
    name: The container plist's path on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, xcode-27]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: The write, the real Safari, a canary; the path domains
        run: python3 scripts/container_path_reach.py --out build/measure/container-path
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-path-${{ matrix.runner }}
          path: build/measure
          if-no-files-found: ignore
