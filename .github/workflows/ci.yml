name: CI

# A measurement branch only: scripts/certificate_leak_check.py's second run (the certificate check
# alone, with names of its own), which only a run that cannot tell reaches — forced here by an empty
# capture: as built (clean, expected), and with every behavior on (a leak, expected). Never merged.
on:
  push:

jobs:
  retry-27:
    name: The certificate check's second run on macOS 27
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build the app without the App Sandbox
        run: SANDBOX=0 APP_DIR=build/unsandboxed scripts/build-app.sh
      - name: An empty capture, as built — clean expected
        continue-on-error: true
        run: |
          mkdir -p build/cert && : > build/cert/empty.txt
          python3 scripts/certificate_leak_check.py --capture build/cert/empty.txt --selftest-log build/cert/empty.txt \
            --app build/unsandboxed/PrivacyBrowser.app --out build/cert/as-built; echo "exit $?"
      - name: An empty capture, every behavior on — a leak expected
        continue-on-error: true
        run: |
          python3 scripts/cert_retry_probe.py --capture build/cert/empty.txt --selftest-log build/cert/empty.txt \
            --app build/unsandboxed/PrivacyBrowser.app --out build/cert/everything; echo "exit $?"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cert-retry-27
          path: build/cert
          if-no-files-found: ignore
