name: CI

# A measurement branch only: every WebKit feature's default on macOS 27, as built and with every
# behavior on (PrivacyBrowser --loader-inventory --all-features): the ones the SDK's behaviors turn
# on or off. Never merged.
on:
  push:

jobs:
  features-27:
    name: WebKit's features as built and with every behavior on, macOS 27
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the app without the App Sandbox
        run: SANDBOX=0 APP_DIR=build/unsandboxed scripts/build-app.sh
      - name: The features, both ways
        continue-on-error: true
        run: |
          mkdir -p build/inventory
          app=build/unsandboxed/PrivacyBrowser.app/Contents/MacOS/PrivacyBrowser
          "$app" --loader-inventory --all-features | grep '^LOADER feature' | sort > build/inventory/as-built.txt
          "$app" --loader-inventory --all-features --sdk-everything | grep '^LOADER feature' | sort > build/inventory/everything.txt
          wc -l build/inventory/*.txt
          echo "== the features whose default the SDK's behaviors change"
          diff build/inventory/as-built.txt build/inventory/everything.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: features-27
          path: build/inventory
          if-no-files-found: ignore
