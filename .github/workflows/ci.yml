name: CI

# A measurement branch only: the queue's last commit — WebKit's features in a profile's web views as
# Safari has them — ahead of the main branch: its check (scripts/engine_features_check.py) on macOS 26,
# with a copy declaring 14.0, and on macOS 27, and the self-test's surface group, which now compares a
# profile with a plain web view given the same features and checks the four. Never merged.
on:
  push:

jobs:
  features:
    name: WebKit's features as Safari's on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, xcode-27]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build the app without the App Sandbox
        run: SANDBOX=0 APP_DIR=build/unsandboxed scripts/build-app.sh
      - name: WebKit's features in a profile's web views as Safari has them
        run: |
          python3 scripts/engine_features_check.py --app build/unsandboxed/PrivacyBrowser.app \
            ${{ matrix.runner == 'macos-26' && '--copy-sdk 14.0' || '' }} \
            --out build/measure/engine-features --title "${{ matrix.runner }} - WebKit's features as Safari's"
      - name: The self-test's surface group
        if: always()
        timeout-minutes: 15
        run: |
          mkdir -p build/measure
          set +e
          PB_SELFTEST_ONLY="fingerprint surface" build/unsandboxed/PrivacyBrowser.app/Contents/MacOS/PrivacyBrowser --self-test \
            > build/measure/surface.txt 2>&1
          status=$?
          grep -E "^(PASS|FAIL)" build/measure/surface.txt | cut -c1-400
          echo "exit $status"
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f3-${{ matrix.runner }}
          path: build/measure
          if-no-files-found: ignore
