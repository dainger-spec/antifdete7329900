name: CI

# Measurement branch claude/measure-safari-worlds (never merged): the fingerprint probe in this
# Mac's real Safari, three ways (scripts/measure_safari_worlds.py). Nothing else runs here.
on:
  push:
    branches: ['**']

jobs:
  worlds:
    name: Safari's probe three ways — ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, xcode-27]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: The probe in Safari — WebDriver's execute, the page's own world, a plain window
        timeout-minutes: 10
        run: |
          sudo safaridriver --enable || echo "safaridriver --enable failed"
          mkdir -p build
          MEASURE_OUT=build/worlds-${{ matrix.runner }}.json python3 scripts/measure_safari_worlds.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worlds-${{ matrix.runner }}
          path: build/worlds-*.json
          if-no-files-found: ignore
