name: CI
# Scratch branch claude/ux-b-check — never merged. CI here: the app built on macOS (the SwiftUI
# target does not build on Linux) and the UI snapshots in both languages, area B's (the profile
# list, the editor, the inspector, sync, import and export, cookie recovery) copied out.
on:
  push:
    branches: ['claude/ux-b-check']

env:
  PB_GEO_SERVICES_OFF: "1"

jobs:
  uxb:
    name: macOS build, area B's snapshots
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Build unsandboxed app
        run: SANDBOX=0 APP_DIR=build/unsandboxed scripts/build-app.sh
      - name: UI snapshots, both languages
        id: ui
        continue-on-error: true
        timeout-minutes: 30
        run: |
          set -o pipefail
          status=0
          mkdir -p build/ui-snapshots
          for lang in en ru; do
            PRIVACYBROWSER_LANG=$lang build/unsandboxed/Lumen.app/Contents/MacOS/Lumen --render-ui-snapshots "$PWD/build/ui-snapshots/$lang" \
              | tee "build/ui-snapshots/$lang.log" || status=1
          done
          mkdir -p build/uxb-shots
          for lang in en ru; do
            for f in build/ui-snapshots/$lang/*.png; do
              n=$(basename "$f" .png)
              case "$n" in
                profiles*|proxies*|sheet-proxy*|sheet-duplicate*|editor-*|narrow-editor*|inspector-*|sheet-profile-*|sheet-cookie-*|sheet-sync*|new|new-*|list-*|cookie-*|recovery-*|duplicate*|bulk*|uxb-*)
                  cp "$f" "build/uxb-shots/$lang-$n.png" ;;
              esac
            done
          done
          ls build/uxb-shots | wc -l
          grep -hE '^FAIL' build/ui-snapshots/*.log | head -20 || true
          exit $status
      - name: Snapshot result
        if: steps.ui.outcome == 'failure'
        run: echo "::warning::the UI snapshot step failed; see its log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uxb-shots
          path: build/uxb-shots
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-logs
          path: build/ui-snapshots/*.log
          if-no-files-found: ignore
