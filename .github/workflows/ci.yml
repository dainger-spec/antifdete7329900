name: CI

# MEASUREMENT BRANCH (claude/measure-language-check): scripts/interface_language_check.sh as CI's
# macOS job runs it — after the sandboxed build has run once and made its container (CI run 588
# failed every case that set something: `defaults write <bundle id>` wrote into that container).

on:
  push:

jobs:
  language:
    name: Interface language check after the sandboxed build — ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, xcode-27]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build both apps, as CI's macOS job does
        timeout-minutes: 40
        run: |
          scripts/build-app.sh
          SANDBOX=0 APP_DIR=build/unsandboxed scripts/build-app.sh
      - name: The sandboxed build runs once (its container is made), as the release gate's control does
        run: |
          build/sandboxed/Lumen.app/Contents/MacOS/Lumen --release-check 2>&1 | grep '^RELEASE-CHECK' || true
          ls -d ~/Library/Containers/io.lumenbrowser.Lumen && echo "container: present"
          # What `defaults write <bundle id>` does now: the measurement of 588's cause.
          defaults write io.lumenbrowser.Lumen PBMeasureDomain -string written
          ls ~/Library/Containers/io.lumenbrowser.Lumen/Data/Library/Preferences/ 2>/dev/null
          plutil -p ~/Library/Preferences/io.lumenbrowser.Lumen.plist 2>/dev/null | grep PBMeasureDomain || echo "not in ~/Library/Preferences"
          defaults delete io.lumenbrowser.Lumen PBMeasureDomain
      - name: The interface's language as the app starts
        run: scripts/interface_language_check.sh build/unsandboxed/Lumen.app
