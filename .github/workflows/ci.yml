name: CI

# The overnight measurement branch only: the menu walk and the scale check, without the full
# self-test, so that each try takes minutes. Never merged anywhere.
on:
  push:

jobs:
  measure-26:
    name: Measurements on macOS 26
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Build the app without the App Sandbox
        run: SANDBOX=0 APP_DIR=build/unsandboxed scripts/build-app.sh
      - name: Menu walk
        if: always()
        continue-on-error: true
        timeout-minutes: 45
        run: |
          python3 scripts/menu_walk.py --app build/unsandboxed/PrivacyBrowser.app --out build/measure/menu-walk \
            --title "macOS 26 - menu walk" --ignore "$HOME/Library/Logs:$HOME/actions-runner:$HOME/runners"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: measure-26
          path: build/measure
          if-no-files-found: ignore

  measure-27:
    name: Measurements on macOS 27
    runs-on: xcode-27
    continue-on-error: true
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Build the app without the App Sandbox
        run: SANDBOX=0 APP_DIR=build/unsandboxed scripts/build-app.sh
      - name: Menu walk
        if: always()
        continue-on-error: true
        timeout-minutes: 45
        run: |
          python3 scripts/menu_walk.py --app build/unsandboxed/PrivacyBrowser.app --out build/measure/menu-walk \
            --title "macOS 27 - menu walk" --ignore "$HOME/Library/Logs:$HOME/actions-runner:$HOME/runners"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: measure-27
          path: build/measure
          if-no-files-found: ignore
