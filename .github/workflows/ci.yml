name: CI

# A measurement branch (claude/measure-keychain-groups, never merged): which signatures reach the
# data-protection keychain on the runners. Only this runs here.
on:
  push:

jobs:
  keychain-26:
    name: Keychain by entitlement (macOS 26)
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/measure_keychain_groups.sh
  keychain-27:
    name: Keychain by entitlement (macOS 27)
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/measure_keychain_groups.sh
