name: CI

# Measurement branch claude/measure-safari-worlds (never merged): the fingerprint probe in this
# Mac's real Safari, three ways (scripts/measure_safari_worlds.py). Nothing else runs here.
on:
  push:
    branches: ['**']

jobs:
  worlds:
    name: Safari's probe three ways — ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, xcode-27]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: The probe in Safari — WebDriver's execute, the page's own world, a plain window
        timeout-minutes: 10
        run: |
          sudo safaridriver --enable || echo "safaridriver --enable failed"
          mkdir -p build
          MEASURE_OUT=build/worlds-${{ matrix.runner }}.json python3 scripts/measure_safari_worlds.py
      - name: Which page policy blocks canvas readback as Safari 27 does (a WKWebView, one option at a time)
        if: always()
        timeout-minutes: 10
        run: |
          mkdir -p build
          swiftc -O scripts/canvas_policy_probe.swift -o build/canvas_policy_probe 2>&1 | tail -5
          build/canvas_policy_probe || true
      - name: Safari's own privacy settings on this Mac
        if: always()
        run: |
          for d in ~/Library/Containers/com.apple.Safari/Data/Library/Preferences/com.apple.Safari ~/Library/Preferences/com.apple.Safari com.apple.Safari.SandboxBroker; do
            echo "== $d"; defaults read "$d" 2>/dev/null | grep -i -E "privacy|fingerprint|enhanced|tracking|protection" || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worlds-${{ matrix.runner }}
          path: build/worlds-*.json
          if-no-files-found: ignore
