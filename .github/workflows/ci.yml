name: CI

# A measurement branch only, never merged (the owner's week of 1 November: no change to the product).
# In a profile's process, on macOS 26 and 27, during the self-test and the menu walk:
#   - every keychain call, with the code that made it and the item's attributes, never its data
#     (scripts/measure/pbtrace.c, loaded with DYLD_INSERT_LIBRARIES into this build only);
#   - every Mach service asked for by name — through the calls that library sees, and as the
#     kernel's sandbox reports them (an allow-with-report rule this build adds, the refusals kept);
#   - what secd says about the app's keychain calls;
# and, before the app runs, what fs_usage shows of cfprefsd writing three canary domains.
on:
  push:

jobs:
  measure:
    name: Keychain, Mach services and cfprefsd's writes on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, xcode-27]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: The machine
        run: sw_vers; defaults read /Applications/Safari.app/Contents/Info.plist CFBundleShortVersionString; xcodebuild -version | head -1
      - name: cfprefsd writing three canary domains, under fs_usage
        continue-on-error: true
        timeout-minutes: 5
        run: scripts/measure/cfprefsd_trace.sh build/measure/cfprefsd
      - name: Build the app without the App Sandbox, and the trace library
        run: |
          SANDBOX=0 APP_DIR=build/unsandboxed scripts/build-app.sh
          clang -dynamiclib -O1 -Werror=incompatible-pointer-types -Werror=incompatible-function-pointer-types \
            -o build/pbtrace.dylib scripts/measure/pbtrace.c -framework Security -framework CoreFoundation
          codesign --force --sign - build/pbtrace.dylib
          codesign -d --entitlements - --xml build/unsandboxed/PrivacyBrowser.app | plutil -p - | grep -E "dyld|library" || true
      - name: Self-test (unsandboxed), traced
        id: selftest
        continue-on-error: true
        timeout-minutes: 45
        run: |
          set -o pipefail
          mkdir -p build/measure
          date -u +"%Y-%m-%d %H:%M:%S+0000" > build/measure/selftest-start.txt
          python3 scripts/selftest_proxy.py --http 18080 --socks 18081 --http-auth 18082 --http6 18083 --socks2 18084 --socks-auth 18085 \
            --tls-control 18086 --canary 18087 --silent 18088 &
          PROXY_PID=$!
          for attempt in $(seq 1 40); do nc -z 127.0.0.1 18081 && break; sleep 0.5; done
          export PB_SELFTEST_HTTP_PROXY_PORT=18080 PB_SELFTEST_SOCKS_PROXY_PORT=18081 PB_SELFTEST_HTTP_AUTH_PROXY_PORT=18082 PB_SELFTEST_HTTP6_PROXY_PORT=18083
          export PB_SELFTEST_SOCKS2_PROXY_PORT=18084 PB_SELFTEST_SOCKS_AUTH_PROXY_PORT=18085
          export PB_SELFTEST_TLS_CONTROL_PORT=18086 PB_SELFTEST_CANARY_PORT=18087 PB_SELFTEST_SILENT_PROXY_PORT=18088
          code=0
          PB_TRACE_FILE="$PWD/build/measure/trace-selftest.txt" DYLD_INSERT_LIBRARIES="$PWD/build/pbtrace.dylib" \
            build/unsandboxed/PrivacyBrowser.app/Contents/MacOS/PrivacyBrowser --self-test 2>&1 | tee build/measure/selftest.txt || code=$?
          kill $PROXY_PID || true
          grep -E "SELFTEST (PASSED|FAILED)|^FAIL " build/measure/selftest.txt | head -20
          exit $code
      - name: The self-test's log (sandbox reports, secd)
        if: always()
        continue-on-error: true
        run: |
          sudo log show --style ndjson --start "$(cat build/measure/selftest-start.txt)" \
            --predicate 'eventMessage CONTAINS "Sandbox: PrivacyBrowser" OR (process == "secd" AND eventMessage CONTAINS "PrivacyBrowser[") OR eventMessage CONTAINS "PBMEASURE"' \
            > build/measure/log-selftest.ndjson 2> build/measure/log-selftest.err || true
          wc -l build/measure/log-selftest.ndjson
          grep -o '"eventMessage":"PBMEASURE[^"]*"' build/measure/log-selftest.ndjson | sort | uniq -c | head
      - name: The menu walk against its records, traced
        if: always()
        continue-on-error: true
        timeout-minutes: 40
        run: |
          date -u +"%Y-%m-%d %H:%M:%S+0000" > build/measure/walk-start.txt
          major="$(defaults read /Applications/Safari.app/Contents/Info.plist CFBundleShortVersionString | cut -d. -f1)"
          PB_TRACE_FILE="$PWD/build/measure/trace-walk.txt" PB_TRACE_DYLIB="$PWD/build/pbtrace.dylib" \
            python3 scripts/menu_walk.py --app build/unsandboxed/PrivacyBrowser.app --out build/measure/menu-walk \
            --title "Safari's menu (traced)" --record "docs/menu-walk/safari-$major.json" \
            --ignore "$HOME/Library/Logs:$HOME/actions-runner:$HOME/runners:$PWD/build/measure" --safari-sentinels
      - name: The walk's log (sandbox reports, secd)
        if: always()
        continue-on-error: true
        run: |
          sudo log show --style ndjson --start "$(cat build/measure/walk-start.txt)" \
            --predicate 'eventMessage CONTAINS "Sandbox: PrivacyBrowser" OR (process == "secd" AND eventMessage CONTAINS "PrivacyBrowser[") OR eventMessage CONTAINS "PBMEASURE"' \
            > build/measure/log-walk.ndjson 2> build/measure/log-walk.err || true
          wc -l build/measure/log-walk.ndjson
      - name: What the trace saw
        if: always()
        run: |
          python3 scripts/measure/pbtrace_report.py --trace build/measure/trace-selftest.txt --log build/measure/log-selftest.ndjson --title "selftest"
          python3 scripts/measure/pbtrace_report.py --trace build/measure/trace-walk.txt --log build/measure/log-walk.ndjson --title "walk"
          for file in build/measure/trace-selftest.txt build/measure/trace-walk.txt; do
            echo "== $file: $(wc -l < "$file" 2>/dev/null) lines"
            grep -c " KEYCHAIN " "$file" 2>/dev/null || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keychain-mach-${{ matrix.runner }}
          path: |
            build/measure/trace-*.txt
            build/measure/log-*.ndjson
            build/measure/selftest.txt
            build/measure/menu-walk/walk.txt
            build/measure/menu-walk/menu-walk.json
            build/measure/cfprefsd
