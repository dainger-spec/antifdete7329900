name: CI

# A measurement branch only: does a profile's process change the real Safari's own preferences?
# Run 496 logged Safari's code in a profile's process writing some ten keys through a domain named by
# the path of the real Safari's container plist, and run 503 found such a write reaching the real
# Safari. Here the real Safari's domain is read (`defaults export com.apple.Safari`, which reads its
# container through cfprefsd) before and after the menu walk on the local queue's head, with
# sentinels set first: SearchProviderIdentifier and SearchProviderShortName (which the log had Safari's
# code remove) and a key of our own. The real Safari never runs meanwhile. Never merged.
on:
  push:

jobs:
  walk:
    name: The real Safari's domain around the menu walk on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, xcode-27]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build the app without the App Sandbox
        run: SANDBOX=0 APP_DIR=build/unsandboxed scripts/build-app.sh
      - name: The real Safari's container, and the sentinels
        run: |
          mkdir -p build/measure
          if [ ! -d "$HOME/Library/Containers/com.apple.Safari" ]; then
            open -b com.apple.Safari; sleep 12; killall Safari || true; sleep 3
          fi
          ls -d "$HOME/Library/Containers/com.apple.Safari" || echo "no container"
          defaults write com.apple.Safari SearchProviderIdentifier -string com.duckduckgo
          defaults write com.apple.Safari SearchProviderShortName -string DuckDuckGo
          defaults write com.apple.Safari PBSentinel -string kept
          sleep 3
          defaults export com.apple.Safari build/measure/before.plist
          plutil -p build/measure/before.plist | grep -E "SearchProvider|PBSentinel|StartPageSections" | cut -c1-200 || true
      - name: Menu walk
        continue-on-error: true
        timeout-minutes: 40
        run: |
          major="$(defaults read /Applications/Safari.app/Contents/Info.plist CFBundleShortVersionString | cut -d. -f1)"
          python3 scripts/menu_walk.py --app build/unsandboxed/PrivacyBrowser.app --out build/measure/menu-walk \
            --title "${{ matrix.runner }} - menu walk" --record "docs/menu-walk/safari-$major.json" --check \
            --ignore "$HOME/Library/Logs:$HOME/actions-runner:$HOME/runners"
      - name: The real Safari's domain after the walk
        if: always()
        run: |
          sleep 5
          defaults export com.apple.Safari build/measure/after.plist
          python3 scripts/safari_domain_diff.py build/measure/before.plist build/measure/after.plist
          plutil -p build/measure/after.plist | grep -E "SearchProvider|PBSentinel" | cut -c1-200 || true
          ls -la "$HOME/Library/Containers/com.apple.Safari/Data/Library/Preferences/" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safari-domain-${{ matrix.runner }}
          path: build/measure
          if-no-files-found: ignore
