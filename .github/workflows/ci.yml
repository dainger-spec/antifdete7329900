name: CI

# A measurement branch only (claude/measure-remote-proxy-27), never merged: a profile behind one of
# the owner's proxies over the Internet on macOS 27 (docs/LEAK_AUDIT.md, item 1: "not measured").
# The proxies come from PB_TEST_PROXIES, a repository secret (host:port:login:password per line).
# The repository is public: what is printed names no address and no login; the full reports are
# uploaded only encrypted to scripts/measure/report_key.pub, whose private half is not here.
on:
  push:

jobs:
  probe:
    name: Is PB_TEST_PROXIES there? And the proxies' UDP from Linux (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      have: ${{ steps.secret.outputs.have }}
    steps:
      - uses: actions/checkout@v4
      - name: Is the secret there?
        id: secret
        env:
          PB_TEST_PROXIES: ${{ secrets.PB_TEST_PROXIES }}
        run: |
          if [ -n "$PB_TEST_PROXIES" ]; then
            echo "REAL-PROXY SECRET PRESENT: $(printf '%s\n' "$PB_TEST_PROXIES" | grep -c .) line(s)"
            echo "have=yes" >> "$GITHUB_OUTPUT"
          else
            echo "REAL-PROXY SKIPPED: no PB_TEST_PROXIES (a repository secret, host:port:login:password per line)"
            echo "have=no" >> "$GITHUB_OUTPUT"
          fi
      - name: Each proxy, in turn — TCP exit (and the app's own way), UDP ASSOCIATE, STUN, TURN, round trips, the gate's verdict
        if: steps.secret.outputs.have == 'yes'
        env:
          PB_TEST_PROXIES: ${{ secrets.PB_TEST_PROXIES }}
        run: python3 -u scripts/measure/proxy_udp.py --out build/proxy-udp --pubkey scripts/measure/report_key.pub --label "ubuntu-24.04"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proxy-udp-ubuntu-24.04
          path: |
            build/proxy-udp/summary.md
            build/proxy-udp/report.json.enc
            build/proxy-udp/key.enc
          if-no-files-found: ignore

  real-proxy-27:
    name: A profile behind a real proxy on macOS 27 — what sites see, live services, every packet (xcode-27)
    needs: probe
    # No secret: no Mac is asked for at all; the probe's line says why.
    if: needs.probe.outputs.have == 'yes'
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: The machine
        continue-on-error: true
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          defaults read /Applications/Safari.app/Contents/Info.plist CFBundleShortVersionString || true
      - name: Each proxy, in turn, from macOS 27
        continue-on-error: true
        timeout-minutes: 30
        env:
          PB_TEST_PROXIES: ${{ secrets.PB_TEST_PROXIES }}
        run: python3 -u scripts/measure/proxy_udp.py --out build/proxy-udp --pubkey scripts/measure/report_key.pub --label "macos-27"
      - name: Build the app without the App Sandbox (as full.yml's macOS 27 job builds it)
        timeout-minutes: 30
        run: NE=check SANDBOX=0 APP_DIR=build/unsandboxed scripts/build-app.sh
      - name: A profile behind proxy 1 — what sites see, live services through it, where its packets went
        timeout-minutes: 45
        env:
          PB_TEST_PROXIES: ${{ secrets.PB_TEST_PROXIES }}
        run: python3 -u scripts/measure/real_proxy.py --app build/unsandboxed/Lumen.app --out build/real-proxy --pubkey scripts/measure/report_key.pub --index 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-proxy-macos-27
          path: |
            build/proxy-udp/summary.md
            build/proxy-udp/report.json.enc
            build/proxy-udp/key.enc
            build/real-proxy/summary.md
            build/real-proxy/report.tar.enc
            build/real-proxy/key.enc
          if-no-files-found: ignore
