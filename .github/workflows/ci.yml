name: CI
# Scratch branch: CI here is the OpenVPN end-to-end check only (scripts/openvpn_macos_e2e.sh).
on:
  push:
    branches: ['**']

jobs:
  openvpn-e2e:
    name: OpenVPN end to end (macOS 26)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: build/openvpn
          key: openvpn-${{ hashFiles('scripts/build-openvpn.sh') }}
      - name: Build the app with OpenVPN
        run: OVPN=1 SANDBOX=0 APP_DIR=build/ovpn scripts/build-app.sh 2>&1 | tail -30
      - name: OpenVPN end to end
        run: scripts/openvpn_macos_e2e.sh build/ovpn/Lumen.app build/openvpn-e2e
      - name: Sizes
        if: always()
        run: ls -l build/openvpn/openvpn build/ovpn/Lumen.app/Contents/MacOS/ || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openvpn-e2e
          path: |
            build/openvpn-e2e/result.txt
            build/openvpn-e2e/work/serve*.txt
            build/openvpn-e2e/server-log.txt
            build/openvpn-e2e/work/services.log
            build/openvpn-e2e/capture.txt
