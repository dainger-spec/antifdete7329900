name: CI

# The fast pipeline (the owner, 3 November): every push to a branch, once — the checks whose failure
# means "do not release", and nothing that cannot fail. Measurements, snapshots, inventories, macOS
# 27, the product's rename, Apple Pay and every other check run in .github/workflows/full.yml, daily
# and on request; release.sh releases only a commit that pipeline passed (scripts/full_run_gate.py).
# One trigger: a push runs every branch of this repository; a pull_request of the same head ran every
# commit a second time (674/675, 678/679, 682/683), and pull requests come only from these branches.
# scripts/check_ci_split.py keeps it so.
on:
  push:
    branches: ['**']

env:
  # The self-test's checks a GitHub runner cannot make, by the beginnings of their names: no real
  # key event reaches a page there (a person's typing into AutoFill is not shown; the AutoFill
  # world is driven directly), and Safari fetches neither a page's touch icon nor its OpenSearch
  # description there. Each is still a SKIP line with its reason and in the summary; under
  # PB_SELFTEST_STRICT any other check skipped on the runner fails the step.
  # And no ad hoc signature opens the data-protection keychain, even with the app group (run 646):
  # the keychain between profiles is shown on the build signed for release (release.sh's release
  # check), here only the entitlements are.
  PB_SELFTEST_EXPECTED_SKIPS: "passwords: a person's own clicks and keys|ended page: an iPhone view's page, loaded: the page gets a click|ended page: after Reload, the cover hidden again: the page gets a click|Safari chrome: its touch icon|Safari chrome: its OpenSearch description|keychain between profiles"


jobs:
  core-linux:
    name: Core tests (Linux, swift-crypto)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - run: swift test

  shims:
    name: JavaScript shim tests (Node)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: TZ=America/New_York node scripts/test-shims.mjs
      # The same tests under JavaScriptCore, the engine Safari runs: own-property order, error
      # messages and function text differ from V8 in ways a page can see.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - run: TZ=America/New_York bun scripts/test-shims.mjs
      # ru and en hold the same keys with the same format specifiers, every L("key") exists, and no
      # text a user reads is written into the code (scripts/check_localization.py).
      - name: Localization is complete in both languages
        run: python3 scripts/check_localization.py
      # Nothing of the user's (profile names, proxy hosts, addresses, paths, error texts) is
      # written to the system log in clear (scripts/check_log_privacy.py).
      - name: Log lines keep the user's data private
        run: python3 scripts/check_log_privacy.py
      # No check of the self-test stops after a note without skip() or check(): a check that
      # cannot be made is a counted SKIP, never a quiet INFO (scripts/check_selftest_skips.py).
      - name: The self-test never stops a check quietly
        run: python3 scripts/check_selftest_skips.py
      # Nothing in the app asks the system to open an address, a file or an app except through
      # SystemOpen, which a profile's process is refused (scripts/check_system_opens.py). Its
      # self-check first: the scan must find each forbidden form planted for it.
      - name: Nothing is handed to the system except through SystemOpen
        run: python3 scripts/check_system_opens.py --self-check && python3 scripts/check_system_opens.py
      # A profile's data is deleted by one path, called only from the person's Delete: not signing
      # out, not another account, not a sync (the owner, 3 November; scripts/check_deletion_paths.py).
      - name: Deletion paths — a profile's data only by the person's Delete
        run: python3 scripts/check_deletion_paths.py --self-check && python3 scripts/check_deletion_paths.py
      # A license key bought without registration is the whole account: its text, and the server's
      # tokens', come out only where a request or the vault needs them (scripts/check_account_key.py).
      - name: The account's key and tokens are text only where they must be
        run: python3 scripts/check_account_key.py --self-check && python3 scripts/check_account_key.py
      # A release's publication on dl.lumenbrowser.io (scripts/r2_publish.sh), against a local R2 that
      # checks every request's signature and every upload's SHA-256 as R2 does: uploaded, read back
      # from the public address and compared, a published version never replaced, R2's keys never on
      # curl's command line (scripts/test_r2_publish.sh). Then no secret of a release in the
      # repository (scripts/check_secrets.py): its planted ones found first.
      - name: A release's publication, download.json as the website reads it, the site's minimum macOS, and no secret in the repository
        run: scripts/test_r2_publish.sh && scripts/test_download_json.sh && scripts/test_site_minimum.sh && python3 scripts/check_secrets.py --self-check && python3 scripts/check_secrets.py
      # The two pipelines as the owner set them (3 November): ci.yml once per commit, only checks that
      # fail it; full.yml daily, on request and on a tag full/…, every check of the fast one besides its
      # own (scripts/check_ci_split.py, its planted faults found first).
      - name: The fast pipeline holds only checks that fail it, the full one every check of it
        run: python3 scripts/check_ci_split.py --self-check && python3 scripts/check_ci_split.py
      # release.sh releases only a commit the full pipeline passed: its gate against saved answers of
      # GitHub's API — none, running, failed, another commit, the fast pipeline's, not GitHub's: no.
      - name: A release only on a commit the full pipeline passed (its gate, against saved answers)
        run: scripts/test_full_run_gate.sh

  macos-checks:
    name: Fast — build, core tests, the release's dry run, and the checks that stop a release
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test
      - name: Build sandboxed app (default)
        run: APP_DIR=build/sandboxed scripts/build-app.sh
      - name: Build unsandboxed app, and the network guard extension (unsigned, NE=check)
        # The extension needs a provisioned team to be signed and loaded (NE=1); CI compiles it
        # against this SDK and lays out its bundle so its plists are checked.
        run: NE=check SANDBOX=0 APP_DIR=build/unsandboxed scripts/build-app.sh
      - name: Release, dry run (no Apple account, a throwaway update key)
        # scripts/release.sh end to end: the app built without the App Sandbox with an update feed and
        # keys, signed (ad hoc, the hardened runtime), its signature read back, then the release gate —
        # Safari's pieces, and a profile started as the app starts one opening in Safari's own window
        # (Lumen --release-check) — then zipped, the zip signed with Ed25519, the appcast made and
        # signed, both checked with the app's own code (pbupdate verify). Notarization and stapling
        # are skipped and said so.
        run: VERSION=0.1.1 BUILD=2 OUT=build/release scripts/release.sh
      - name: The release gate fails where Safari's chrome is not hosted (its controls)
        # A gate that cannot fail proves nothing. The sandboxed build, and the release with Safari's
        # chrome turned off for the profile's process (--control), must each come back FAIL, for
        # their own reason; and release.sh must refuse SANDBOX=1 before it builds anything.
        run: |
          status=0
          out=$(build/sandboxed/Lumen.app/Contents/MacOS/Lumen --release-check 2>&1) \
            && { echo "::error title=Release gate::the sandboxed build passed the release check"; status=1; }
          echo "$out" | grep '^RELEASE-CHECK' || echo "$out" | tail -n 20
          echo "$out" | grep -F 'runs in the App Sandbox' >/dev/null \
            || { echo "::error title=Release gate::the sandboxed build did not fail for the sandbox"; status=1; }
          out=$(build/release/app/Lumen.app/Contents/MacOS/Lumen --release-check --control 2>&1) \
            && { echo "::error title=Release gate::the control (Safari's chrome off) passed the release check"; status=1; }
          echo "$out" | grep '^RELEASE-CHECK' || echo "$out" | tail -n 20
          echo "$out" | grep -F "window is the app's own" >/dev/null \
            || { echo "::error title=Release gate::the control did not fail for its window"; status=1; }
          # A build without an account server (every development build) is never released: its
          # license would not be checked (CONTRACT §2, §7.2).
          out=$(build/unsandboxed/Lumen.app/Contents/MacOS/Lumen --release-check 2>&1) \
            && { echo "::error title=Release gate::a build without an account server passed the release check"; status=1; }
          echo "$out" | grep '^RELEASE-CHECK' || echo "$out" | tail -n 20
          echo "$out" | grep -F 'no account server in this build' >/dev/null \
            || { echo "::error title=Release gate::the build without an account server did not fail for it"; status=1; }
          # The release's own app, changed in one thing each (a copy, signed again ad hoc): with no key
          # for the documents of rights it could accept no license; trusting the development server's
          # key, anyone could sign one. Both must fail, each for its reason (the owner, 2 November: a
          # release refuses to be made with the license's check off, as without Safari's window).
          gate() {
            local name="$1" change="$2" expected="$3" copy="build/release-gate-$1/Lumen.app"
            rm -rf "build/release-gate-$name"; mkdir -p "build/release-gate-$name"
            ditto build/release/app/Lumen.app "$copy"
            /usr/libexec/PlistBuddy -c "$change" "$copy/Contents/Info.plist"
            codesign --force --sign - --preserve-metadata=entitlements,flags,runtime "$copy" 2>&1 | tail -n 2
            out=$("$copy/Contents/MacOS/Lumen" --release-check 2>&1) \
              && { echo "::error title=Release gate::the release with $name passed the release check"; status=1; }
            echo "$out" | grep '^RELEASE-CHECK' || echo "$out" | tail -n 20
            echo "$out" | grep -F "$expected" >/dev/null \
              || { echo "::error title=Release gate::the release with $name did not fail for it"; status=1; }
          }
          gate "no-keys" "Delete :PBEntitlementPublicKeys" "no keys of the documents of rights"
          # The release's own app with its profile's executable signed with the app group — what an
          # NE=1 build's app carries — must not start a profile at all: every profile would share the
          # app's keychain (ProfileExecutable.swift). The manager reads the signature before a start.
          copy="build/release-gate-profile-keychain/Lumen.app"
          rm -rf build/release-gate-profile-keychain; mkdir -p build/release-gate-profile-keychain
          ditto build/release/app/Lumen.app "$copy"
          codesign -d --entitlements - --xml "$copy/Contents/MacOS/LumenProfile" > build/release-gate-profile-keychain/entitlements.plist 2>/dev/null
          /usr/libexec/PlistBuddy -c "Add :com.apple.security.application-groups array" \
            -c "Add :com.apple.security.application-groups:0 string XXXXXXXXXX.io.lumenbrowser.Lumen" \
            build/release-gate-profile-keychain/entitlements.plist
          codesign --force --options runtime --timestamp=none --identifier io.lumenbrowser.Lumen \
            --entitlements build/release-gate-profile-keychain/entitlements.plist --sign - "$copy/Contents/MacOS/LumenProfile" 2>&1 | tail -n 2
          codesign --force --sign - --preserve-metadata=entitlements,flags,runtime "$copy" 2>&1 | tail -n 2
          out=$("$copy/Contents/MacOS/Lumen" --release-check 2>&1) \
            && { echo "::error title=Release gate::a profile's executable with the app's keychain passed the release check"; status=1; }
          echo "$out" | grep '^RELEASE-CHECK' || echo "$out" | tail -n 20
          echo "$out" | grep -F "keychain of its own" >/dev/null \
            || { echo "::error title=Release gate::the profile's executable with the app's keychain did not fail for it"; status=1; }
          gate "development-key" "Add :PBEntitlementPublicKeys:445c6300da0205b1 string /+/sbiH55nmy+2gRqQz12E0spl9L/YDWvjnecaN2M1c=" \
            "the development server's key"
          # The start check (release.sh's step 1b) passes the release's app, and fails an executable that
          # does not answer: one killed at its start — what the owner's Mac showed of 0.1.1 with the
          # network guard (Killed: 9, 137) — and one that ends at once without a word. Neither is the
          # kernel's own refusal: this runner's kernel enforces no code signature — it started an ad hoc
          # copy carrying an application identifier (run 666) and a copy whose app's executable had its
          # signature taken off (run 667), the two controls tried before these, which therefore could
          # not fail. The start check's verdict on a signature the kernel refuses is taken on the
          # owner's Mac (docs/TUNNEL.md, the hardware checklist's step 0).
          scripts/start_check.sh build/release/app/Lumen.app/Contents/MacOS/Lumen "the release's app" \
            || { echo "::error title=Start check::the release's own app did not pass the start check"; status=1; }
          rm -rf build/start-check-control; mkdir -p build/start-check-control
          printf '#!/bin/sh\nkill -KILL $$\n' > build/start-check-control/killed
          printf '#!/bin/sh\nexit 0\n' > build/start-check-control/silent
          chmod +x build/start-check-control/killed build/start-check-control/silent
          for control in killed silent; do
            if scripts/start_check.sh "build/start-check-control/$control" "the control ($control at its start)"; then
              echo "::error title=Start check::the start check passed an executable that does not answer ($control)"; status=1
            fi
          done
          # This runner's kernel, said: does it run the release's app with its signature taken off?
          copy="build/start-check-unsigned/Lumen.app"
          rm -rf build/start-check-unsigned; mkdir -p build/start-check-unsigned
          ditto build/release/app/Lumen.app "$copy"
          codesign --remove-signature "$copy/Contents/MacOS/Lumen" || true
          csrutil status 2>/dev/null || true
          if scripts/start_check.sh "$copy/Contents/MacOS/Lumen" "an unsigned copy (a measurement)" >/dev/null 2>&1; then
            echo "::notice title=Start check, measured::this runner's kernel ran the app's executable with its signature taken off: it enforces no code signature, and no refusal by signature can be shown here"
          else
            echo "::notice title=Start check, measured::this runner's kernel refused the app's executable with its signature taken off"
          fi
          if SANDBOX=1 VERSION=0.1.1 BUILD=2 OUT=build/release-sandboxed scripts/release.sh > build/release-sandboxed.log 2>&1; then
            echo "::error title=Release gate::release.sh made a release of the sandboxed build"; status=1
          fi
          grep -F 'a release is never the sandboxed build' build/release-sandboxed.log \
            || { echo "::error title=Release gate::release.sh did not refuse SANDBOX=1 for the sandbox"; cat build/release-sandboxed.log; status=1; }
          exit $status
      - name: download.json as the website reads it, written under any locale (its controls)
        # 0.1.1's said "sizeMB": 17,5 on the owner's Mac, whose locale writes a decimal comma; this
        # runner's locale is English, so the check reads the file, not the environment. Here macOS's
        # own Russian locale shows the old line's comma, and the file release.sh wrote is read back.
        run: |
          scripts/test_download_json.sh
          minimum="$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' build/release/app/Lumen.app/Contents/Info.plist)"
          python3 scripts/download_json.py check build/release/download.json --dmg build/release/Lumen-0.1.1.dmg --minimum-system "$minimum"
          # The macOS the app needs is the one the site states and CI tests (docs/UPDATES.md §6): 26.
          [[ "$minimum" == 26.0 ]] || { echo "::error title=Minimum macOS::the app needs macOS $minimum, not 26.0"; exit 1; }
          # The live site, said (a release stops on a disagreement; here it is a notice either way).
          python3 scripts/site_minimum_check.py --minimum "$minimum" --site https://lumenbrowser.io \
            || echo "::notice title=Minimum macOS::the live site's minimum macOS was not confirmed from this runner"
      - name: The release gate reads every line, not one PASS among them (its controls)
        # release.sh takes the release check's verdict through scripts/release_check_gate.sh: the
        # app's exit status and every line. Outputs made up for the purpose, each with the verdict the
        # gate must give — the keychain between profiles failing after the window's PASS among them,
        # which release.sh's earlier reading (any PASS line at all) would have let through to a release.
        run: |
          status=0
          verdict() {  # <accept|refuse> <exit status> <what the case is> <lines…>
            local expected="$1" code="$2" what="$3" got
            shift 3
            printf '%s\n' "$@" > build/release-gate-case.txt
            if scripts/release_check_gate.sh build/release-gate-case.txt "$code" 2>/dev/null; then got=accept; else got=refuse; fi
            if [[ "$got" == "$expected" ]]; then
              echo "OK $expected: $what"
            else
              echo "::error title=Release gate::the gate would $got where it must $expected: $what"
              status=1
            fi
          }
          window="RELEASE-CHECK PASS a profile in a process of its own (pid 4242), its window Safari's own chrome"
          verdict accept 0 "a dry run: the window shown, the keychain not shown in this build" \
            "RELEASE-CHECK INFO io.lumenbrowser.Lumen 0.1.0 (1)" "$window" \
            "RELEASE-CHECK INFO not shown in this build: keychain between profiles: … the data-protection keychain takes no item from the app itself here"
          verdict accept 0 "the team's build: the window and the three keychain checks shown" "$window" \
            "RELEASE-CHECK PASS keychain: a profile's process holds none of the entitlements that give a keychain" \
            "RELEASE-CHECK PASS keychain: the account's login keychain is closed to a profile's process" \
            "RELEASE-CHECK PASS keychain between profiles: an item one profile tries to keep … is not kept"
          verdict refuse 1 "the login keychain open to a profile, after the window's PASS" "$window" \
            "RELEASE-CHECK PASS keychain: a profile's process holds none of the entitlements that give a keychain" \
            "RELEASE-CHECK FAIL keychain: the account's login keychain is closed to a profile's process: profile A kept an item"
          verdict refuse 1 "the keychain between profiles failed after the window's PASS" "$window" \
            "RELEASE-CHECK FAIL keychain between profiles: profile A kept an item in the data-protection keychain: it has the app's keychain"
          verdict refuse 0 "a FAIL line, whatever the exit status" "$window" \
            "RELEASE-CHECK FAIL keychain: profile A's process holds com.apple.application-identifier: it is given the app's keychain"
          verdict refuse 1 "an exit status not 0, whatever the lines" "$window" "RELEASE-CHECK PASS keychain between profiles: …"
          verdict refuse 1 "the check ran out of time after the window" "$window" "RELEASE-CHECK FAIL the check did not finish in 4 minutes"
          verdict refuse 0 "no line for the profile's window" "RELEASE-CHECK INFO io.lumenbrowser.Lumen 0.1.0 (1)" \
            "RELEASE-CHECK PASS keychain between profiles: …"
          verdict refuse 1 "the profile did not start" \
            "RELEASE-CHECK FAIL the profile did not start: the profile's executable is signed with a keychain of its own"
          verdict refuse 0 "nothing at all" ""
          exit $status
      - name: A relaxation beside the network extension's right — refused by the build (its controls)
        # On 3 November 0.1.1 with the network guard was killed by the kernel at its start on macOS
        # 27.0.1: its app's executable held library validation off beside the network extension's
        # right (docs/TUNNEL.md, "What the kernel kills"). scripts/relaxation_check.sh, which
        # build-app.sh and release.sh run, must let the builds made here through and refuse every copy
        # holding a listed relaxation beside the right — and let one with allow-jit through (measured:
        # it started); build-app.sh must refuse 0.1.1's pairing and leave no bundle behind. It reads
        # signatures only: it runs whatever the release gate above found, and this runner's kernel,
        # which enforces no code signature, cannot show what it guards against.
        if: ${{ !cancelled() }}
        run: |
          status=0
          for app in build/release/app/Lumen.app build/unsandboxed/Lumen.app build/sandboxed/Lumen.app; do
            scripts/relaxation_check.sh "$app" || { echo "::error title=Relaxation check::$app was refused"; status=1; }
          done
          # The layout, read from the signatures: the app's own executable keeps library validation on,
          # LumenProfile has it off (Safari's frameworks load only there).
          for app in build/release/app/Lumen.app build/unsandboxed/Lumen.app; do
            codesign -d --entitlements - --xml "$app/Contents/MacOS/Lumen" > build/layout-app.plist 2>/dev/null || true
            codesign -d --entitlements - --xml "$app/Contents/MacOS/LumenProfile" > build/layout-profile.plist 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Print :com.apple.security.device.camera" build/layout-app.plist >/dev/null 2>&1 \
              || { echo "::error title=Layout::$app: the app's entitlements were not read"; status=1; }
            if /usr/libexec/PlistBuddy -c "Print :com.apple.security.cs.disable-library-validation" build/layout-app.plist >/dev/null 2>&1; then
              echo "::error title=Layout::$app: the app's own executable is signed with library validation off"; status=1
            fi
            /usr/libexec/PlistBuddy -c "Print :com.apple.security.cs.disable-library-validation" build/layout-profile.plist >/dev/null 2>&1 \
              || { echo "::error title=Layout::$app: LumenProfile keeps library validation on (Safari's frameworks would not load)"; status=1; }
          done
          # Copies of the release's app, one executable signed again ad hoc with the right — and with
          # what is named. relax <copy> <executable> <refused|passes> <the key a refusal names, or -> [keys added]
          relax() {
            local name="$1" executable="$2" expect="$3" named="$4"; shift 4
            local dir="build/relaxation-$name" copy="build/relaxation-$name/Lumen.app" key out result=0
            rm -rf "$dir"; mkdir -p "$dir"; ditto build/release/app/Lumen.app "$copy"
            codesign -d --entitlements - --xml "$copy/Contents/MacOS/$executable" > "$dir/entitlements.plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :com.apple.developer.networking.networkextension array" \
              -c "Add :com.apple.developer.networking.networkextension:0 string content-filter-provider-systemextension" "$dir/entitlements.plist"
            for key in "$@"; do
              /usr/libexec/PlistBuddy -c "Delete :$key" "$dir/entitlements.plist" >/dev/null 2>&1 || true
              /usr/libexec/PlistBuddy -c "Add :$key bool true" "$dir/entitlements.plist"
            done
            if [[ "$executable" == Lumen ]]; then
              codesign --force --options runtime --timestamp=none --entitlements "$dir/entitlements.plist" --sign - "$copy" 2>&1 | tail -n 1
            else
              codesign --force --options runtime --timestamp=none --identifier io.lumenbrowser.Lumen \
                --entitlements "$dir/entitlements.plist" --sign - "$copy/Contents/MacOS/$executable" 2>&1 | tail -n 1
              codesign --force --sign - --preserve-metadata=entitlements,flags,runtime "$copy" 2>&1 | tail -n 1
            fi
            out=$(scripts/relaxation_check.sh "$copy" 2>&1) || result=$?
            echo "-- $name: $executable signed with the right${1:+ and $*}: exit $result"
            echo "$out" | sed 's/^/   /'
            if [[ "$expect" == refused ]]; then
              [[ $result != 0 ]] || { echo "::error title=Relaxation check::the copy $name was let through"; status=1; }
              [[ "$out" == *"Contents/MacOS/$executable holds $named beside com.apple.developer.networking.networkextension"* ]] \
                || { echo "::error title=Relaxation check::the copy $name was not refused for $named"; status=1; }
            else
              [[ $result == 0 ]] || { echo "::error title=Relaxation check::the copy $name was refused"; status=1; }
            fi
          }
          # Measured on the owner's Mac: killed beside the right.
          relax dlv Lumen refused com.apple.security.cs.disable-library-validation com.apple.security.cs.disable-library-validation
          relax unsigned-memory Lumen refused com.apple.security.cs.allow-unsigned-executable-memory com.apple.security.cs.allow-unsigned-executable-memory
          relax dyld-environment Lumen refused com.apple.security.cs.allow-dyld-environment-variables com.apple.security.cs.allow-dyld-environment-variables
          # Not measured, refused all the same.
          relax page-protection Lumen refused com.apple.security.cs.disable-executable-page-protection com.apple.security.cs.disable-executable-page-protection
          relax debugger Lumen refused com.apple.security.cs.debugger com.apple.security.cs.debugger
          # LumenProfile holds library validation off: the right must never be given to it.
          relax profile LumenProfile refused com.apple.security.cs.disable-library-validation
          # Measured on the owner's Mac: started — the right alone (the layout chosen), and allow-jit beside it.
          relax right-alone Lumen passes -
          relax jit Lumen passes - com.apple.security.cs.allow-jit
          # The build itself: Resources/PrivacyBrowser-NoSandbox.entitlements given what 0.1.1's app was
          # signed with — library validation off beside the right. build-app.sh must refuse the build
          # and leave no bundle behind. The file is put back however this ends.
          base=Resources/PrivacyBrowser-NoSandbox.entitlements
          trap 'git checkout -- "$base"' EXIT
          /usr/libexec/PlistBuddy -c "Add :com.apple.security.cs.disable-library-validation bool true" \
            -c "Add :com.apple.developer.networking.networkextension array" \
            -c "Add :com.apple.developer.networking.networkextension:0 string content-filter-provider-systemextension" "$base"
          if SANDBOX=0 APP_DIR=build/relaxation-build scripts/build-app.sh > build/relaxation-build.log 2>&1; then
            echo "::error title=Relaxation check::build-app.sh made a build whose app holds library validation off beside the right"; status=1
          fi
          grep -E '^error:' build/relaxation-build.log || tail -n 20 build/relaxation-build.log
          grep -F "Contents/MacOS/Lumen holds com.apple.security.cs.disable-library-validation beside com.apple.developer.networking.networkextension" build/relaxation-build.log >/dev/null \
            || { echo "::error title=Relaxation check::build-app.sh did not refuse the build for library validation off beside the right"; status=1; }
          [[ ! -e build/relaxation-build/Lumen.app ]] \
            || { echo "::error title=Relaxation check::the refused build was left in place"; status=1; }
          git checkout -- "$base"
          trap - EXIT
          git diff --quiet -- "$base" || { echo "::error title=Relaxation check::the entitlements file was not put back"; status=1; }
          exit $status
      - name: The interface's language as the app starts — plain, -AppleLanguages, open --args, a choice, an earlier version's write
        # Until 1 November it was Russian whatever the Mac or the command line said (the owner's
        # `open … --args -AppleLanguages "(en)"`; CI run 577). Each case names the language it wants.
        timeout-minutes: 10
        run: scripts/interface_language_check.sh build/unsandboxed/Lumen.app
      - name: A profile's data through signing out, into other accounts and back (it must fail when lost)
        # The owner, 3 November: a person's history, cookies and saved logins gone from every profile
        # after signing out, into other accounts and back. scripts/account_switch_check.py: the app
        # quit between steps; two profiles with history, logins, bookmarks; a site in each that keeps
        # a cookie, localStorage and IndexedDB and says what it finds; a first account, a second, a
        # third with export only, the first again. Every step measured; the control removes the
        # profiles' data at the first sign-out and must fail the check.
        if: always()
        timeout-minutes: 20
        run: |
          python3 -u scripts/account_switch_check.py --app build/unsandboxed/Lumen.app --out build/account-switch
          python3 -u scripts/account_switch_check.py --app build/unsandboxed/Lumen.app --out build/account-switch/control --control
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: account-switch
          path: build/account-switch
          if-no-files-found: ignore
      - name: App Sandbox container migration (unsandboxed data → sandboxed first launch)
        run: |
          # Separate bundle ID so the sandbox container does not exist yet.
          BUNDLE_ID=dev.local.PBMigrationCheck SANDBOX=0 APP_DIR=build/migration-old scripts/build-app.sh
          BUNDLE_ID=dev.local.PBMigrationCheck APP_DIR=build/migration-new scripts/build-app.sh
          # Writes a real vault into the runner's unsandboxed vault folder: CI only (see SelfTest.migrationStep).
          # Its profile's website data (a cookie, localStorage, IndexedDB) holds this token, which the
          # sandboxed build must read back from its container's layout.
          export PB_SELFTEST_MIGRATION_TOKEN="pbmigration$(date +%s)"
          PB_SELFTEST_MIGRATION=1 build/migration-old/Lumen.app/Contents/MacOS/Lumen --selftest-write-vault
          build/migration-new/Lumen.app/Contents/MacOS/Lumen --selftest-read-vault
          test ! -e "$HOME/Library/Application Support/PrivacyBrowser/vault.json" || { echo "vault was not moved"; exit 1; }

  selftest:
    name: Fast — self-test against real WebKit (${{ matrix.variant }})
    # The two builds side by side, each on its own runner: one after the other they took 12.4 min
    # after a 5-min build (run 682), past the fast pipeline's 20.
    strategy:
      fail-fast: false
      matrix:
        variant: [sandboxed, unsandboxed]
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build sandboxed app (default)
        if: matrix.variant == 'sandboxed'
        run: APP_DIR=build/sandboxed scripts/build-app.sh
      - name: Build unsandboxed app, and the network guard extension (unsigned, NE=check)
        if: matrix.variant == 'unsandboxed'
        # The extension needs a provisioned team to be signed and loaded (NE=1); CI compiles it
        # against this SDK and lays out its bundle so its plists are checked.
        run: NE=check SANDBOX=0 APP_DIR=build/unsandboxed scripts/build-app.sh
      - name: Self-test against real WebKit (${{ matrix.variant }})
        env:
          # A check skipped on this runner fails the step, but for the ones this runner cannot make
          # (each said with its reason in the self-test's own SKIP line and summary).
          PB_SELFTEST_STRICT: "1"
          # The interface in Russian, this Mac's language English: the check of dates in the
          # person's language can only tell the two apart so. Until the interface took this Mac's
          # language (1 November) the self-test ran in Russian by the old default; run 594 then
          # skipped that check, which the strict run refuses.
          PRIVACYBROWSER_LANG: ru
        run: |
          set -o pipefail
          export PB_SELFTEST_HTTP_PROXY_PORT=18080 PB_SELFTEST_SOCKS_PROXY_PORT=18081 PB_SELFTEST_HTTP_AUTH_PROXY_PORT=18082 PB_SELFTEST_HTTP6_PROXY_PORT=18083
          export PB_SELFTEST_SOCKS2_PROXY_PORT=18084 PB_SELFTEST_SOCKS_AUTH_PROXY_PORT=18085
          export PB_SELFTEST_TLS_CONTROL_PORT=18086 PB_SELFTEST_CANARY_PORT=18087 PB_SELFTEST_SILENT_PROXY_PORT=18088 PB_SELFTEST_SOCKS_UDP_PROXY_PORT=18089
          mkdir -p build/egress
          status=0
          # What a release declares: Xcode 26 writes SDK 26.5 into the executables, and with 15.0 or
          # newer this Mac fetches a certificate's missing intermediate outside a profile's proxy
          # (docs/ISOLATION_AND_LIMITATIONS.md §2; the step "From which declared SDK…" below measures
          # the build as made). Releases declare 14.0 (Xcode 27's SwiftPM; scripts/release.sh refuses
          # 15 and newer), so the build without the App Sandbox — the one inside the capture and the
          # file trace — runs as a copy declaring 14.0. Up to run 524 it ran as made, 26.5, whose fetch
          # the capture never saw (the cache above); run 524 saw it. The sandboxed build still runs as
          # made: a re-signed copy is another app to its container, which already holds the build's data.
          if [ "${{ matrix.variant }}" = unsandboxed ]; then
          python3 - <<'PY'
          import os, subprocess, sys
          sys.path.insert(0, "scripts")
          from aia_variants import BINARY, copy_declaring, declared_sdk
          app, folder = "build/unsandboxed/Lumen.app", "build/release-sdk/unsandboxed"
          os.makedirs(folder, exist_ok=True)
          entitlements = os.path.join(folder, "entitlements.plist")
          with open(entitlements, "wb") as handle:
              handle.write(subprocess.run(["codesign", "-d", "--entitlements", "-", "--xml", app], capture_output=True).stdout)
          copy = copy_declaring(app, "14.0", folder, entitlements)
          if not copy or declared_sdk(os.path.join(copy, BINARY))[1] != "14.0":
              sys.exit(f"::error::no copy of {app} declaring SDK 14.0 could be made")
          print(f"unsandboxed: as built {declared_sdk(os.path.join(app, BINARY))}, the self-test's copy {declared_sdk(os.path.join(copy, BINARY))}")
          PY
          fi
          for variant in ${{ matrix.variant }}; do
            # A proxy of its own for each build, its certificates naming addresses no earlier run
            # asked for (--aia-tag): the intermediate this Mac fetched for the sandboxed build's
            # control stayed in its cache, and the unsandboxed build's capture then saw neither the
            # control nor would it have seen the canary (macOS 26, every run up to 523).
            python3 scripts/selftest_proxy.py --http 18080 --socks 18081 --http-auth 18082 --http6 18083 --socks2 18084 --socks-auth 18085 \
              --tls-control 18086 --canary 18087 --silent 18088 --socks-udp 18089 --aia-tag "${variant:0:1}$(date +%s)" &
            PROXY_PID=$!
            # The proxy makes its TLS certificates before it listens.
            for attempt in $(seq 1 40); do nc -z 127.0.0.1 18081 && break; sleep 0.5; done
            echo "::group::self-test ($variant)"
            # The surface dump goes to the repository folder, which only the unsandboxed build may write.
            if [ "$variant" = unsandboxed ]; then
              export PB_SELFTEST_SURFACE_OUT="$PWD/build/surface-$variant"
              # The History window as the window server shows it (the self-test keeps its pictures).
              export PB_SELFTEST_SHOTS="$PWD/build/egress/history-shots"
              # Everything that leaves this machine while the unsandboxed self-test runs, with the
              # process each packet belongs to (pktap): scripts/egress_check.py reads it below.
              sudo tcpdump -i pktap,all -k NP -n -tt -l 'not host 127.0.0.1 and not host ::1' \
                > build/egress/capture.txt 2> build/egress/tcpdump.err &
              # And every file-system call of the app's processes and of WebKit's, for
              # scripts/disk_check.py: nothing may be written where the real Safari keeps its data.
              # One fs_usage for all three (the kernel trace is exclusive: a second one gets
              # "ktrace_start: Resource busy" and sees nothing).
              # LumenProfile: a profile's own process (ProfileExecutable), by its own name.
              sudo fs_usage -w -f filesys Lumen LumenProfile com.apple.WebKit cfprefsd > build/egress/fs.txt 2>&1 &
              sleep 2
              # A preferences file cfprefsd writes through a directory descriptor, as it writes every
              # one: disk_check.py must name it, or the trace is blind to cfprefsd again.
              mkdir -p "$PWD/build/egress/trace-canary"
              defaults write "$PWD/build/egress/trace-canary/PBTraceCanary" Canary -string "$(date +%s)"
            fi
            app="build/$variant/Lumen.app"
            if [ "$variant" = unsandboxed ]; then app="build/release-sdk/unsandboxed/Lumen.app"; fi
            "$app/Contents/MacOS/Lumen" --self-test | tee "build/egress/selftest-$variant.txt" || status=1
            echo "::endgroup::"
            kill $PROXY_PID || true
            wait $PROXY_PID 2>/dev/null || true
          done
          if [ "${{ matrix.variant }}" = unsandboxed ]; then
          sudo pkill -INT -f "tcpdump -i pktap" || true
          sudo pkill -INT -f "fs_usage -w" || true
          sleep 2
          echo "::group::egress capture around the Safari-chrome check"
          python3 scripts/egress_check.py --capture build/egress/capture.txt \
            --selftest-log build/egress/selftest-unsandboxed.txt --tcpdump-errors build/egress/tcpdump.err || status=1
          echo "::endgroup::"
          echo "::group::files written while a profile ran in Safari's chrome"
          python3 scripts/disk_check.py --trace build/egress/fs.txt \
            --selftest-log build/egress/selftest-unsandboxed.txt --canary "$PWD/build/egress/trace-canary/PBTraceCanary.plist" || status=1
          echo "::endgroup::"
          fi
          exit $status
      - name: What crashed, if a process of the app or WebKit's crashed (crash reports)
        # A profile's own process that dies leaves the self-test only "the profile quit
        # unexpectedly"; macOS writes what happened to a crash report. Summarized here (the crashed
        # thread's frames), and the reports themselves go into the fingerprint-surfaces artifact.
        if: always() && matrix.variant == 'unsandboxed'
        run: |
          mkdir -p build/crashes
          shopt -s nullglob
          # *Name*: a fault the process lived through is ExcUserFault_<process>-….ips (the owner's
          # Mac, 1 November: WebKit's UI side refusing a message, EXC_GUARD namespace 31), which a
          # Name* pattern never found.
          for report in ~/Library/Logs/DiagnosticReports/*Lumen*.ips ~/Library/Logs/DiagnosticReports/*com.apple.WebKit*.ips \
                        /Library/Logs/DiagnosticReports/*Lumen*.ips /Library/Logs/DiagnosticReports/*com.apple.WebKit*.ips; do
            cp "$report" build/crashes/ 2>/dev/null || sudo cp "$report" build/crashes/
          done
          sudo chmod -R a+r build/crashes 2>/dev/null || true
          python3 scripts/crash_summary.py build/crashes/*.ips | tee build/crashes/summary.txt
          grep -E '^(CRASH|FAULT)' build/crashes/summary.txt | grep -v '^CRASH none' | head -16 | cut -c1-300 | sed 's/^/::warning title=crash::/' || true
          # The search's control: the self-test's exception checks end two processes on purpose (an
          # exception nothing catches, on the queue PBExceptionCheck.background; and the control's,
          # under ExceptionLog.runCheck on the main thread), and macOS writes a report of each — or,
          # macOS 27, of one of the two, 0.6 s apart (CI run 649 kept the first, 650 the second).
          # Neither among the reports found, the search is looking under another name.
          if ! grep -qE "crashed thread PBExceptionCheck\.background|ExceptionLog\.runCheck" build/crashes/summary.txt; then
            echo "::error title=crash reports SKIPPED::no report of the self-test's deliberate crashes (the queue PBExceptionCheck.background, or the control's under ExceptionLog.runCheck) is among those found: the search for crash reports is blind to this app's processes"
            echo "### Crash reports SKIPPED: the deliberate crash's report was not found" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # A message WebKit's UI side refused from one of its processes, as the log names it.
          sudo log show --style compact --last 3h --predicate 'eventMessage CONTAINS[c] "invalid message" AND process != "log"' 2>/dev/null \
            | grep -iv '^timestamp' | grep -v ' log\[[0-9]' | head -40 | tee build/crashes/invalid-messages.txt || true
          cut -c1-400 build/crashes/invalid-messages.txt | head -8 | sed 's/^/::warning title=WebKit refused a message::/' || true
          if [ -s build/crashes/invalid-messages.txt ]; then
            { echo "### WebKit refused a message"; cut -c1-400 build/crashes/invalid-messages.txt | head -20 | sed 's/^/    /'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: The account's key in a crash report (a process holding it crashes on purpose; the control's report must hold it)
        if: matrix.variant == 'unsandboxed'
        # The self-test looks for the key in the log, the diagnostics ZIP and the automation API's
        # answers; a crash report is written by macOS after the process is gone (scripts/key_crash_check.py).
        timeout-minutes: 10
        run: python3 scripts/key_crash_check.py build/unsandboxed/Lumen.app/Contents/MacOS/Lumen
      - name: Safari's private classes and methods the hosted chrome relies on
        # SafariChrome.expectedPieces: a macOS whose Safari renamed or removed one fails here, by name,
        # instead of a profile's window quietly degrading on a user's Mac. After the self-test, so
        # that a missing piece never hides what the self-test would have measured.
        if: always() && matrix.variant == 'unsandboxed'
        run: build/unsandboxed/Lumen.app/Contents/MacOS/LumenProfile --check-safari-chrome
      - name: Compare the fingerprint surface with this Mac's real Safari (safaridriver)
        if: matrix.variant == 'unsandboxed'
        run: |
          sudo safaridriver --enable || echo "::warning::safaridriver --enable failed"
          python3 scripts/safari_reference.py --compare build/surface-unsandboxed/surface-macos.json --out build/safari-surface.json
          code=$?
          # Safari not driven: nothing compared, so not a pass (SKIPPED, and the step fails).
          if [ "$code" = "2" ]; then echo "::error::fingerprint surface SKIPPED: Safari could not be driven on this runner, so nothing was compared"; exit 1; fi
          exit $code
      - name: Leak check — does QUIC or WebRTC go around a profile's proxy?
        # Real forwarding proxies on this runner and a profile without one as the control; see
        # scripts/leak_check.py. Fails only on traffic seen going around a proxy (a site that is
        # down makes it inconclusive, not red).
        if: always() && matrix.variant == 'unsandboxed'
        timeout-minutes: 10
        run: python3 scripts/leak_check.py --app build/unsandboxed/Lumen.app --out build/leaks
      - name: The network guard's probe — whom macOS counts WebKit's WebRTC request for (docs/TUNNEL.md, "Attribution")
        # The guard holds a profile by the process each flow is counted for, not the one that opened
        # it (WebKit's network process). `Lumen --guard-probe` inside a capture of its STUN address
        # (TEST-NET-3, never routed): every packet must be sent by another process and counted for
        # the probe's pid, and at least one must be seen. Then the checker's own control: the same
        # capture compared with a pid that is not the probe's must fail. The kernel's table of
        # sockets, read by the app's own code while the probe runs (what the guard reads for each
        # flow, SocketTable), must agree with the capture's proc and eproc; read as if no socket were
        # delegated, it must not.
        if: always() && matrix.variant == 'unsandboxed'
        timeout-minutes: 8
        run: |
          python3 scripts/guard_probe_check.py --app build/unsandboxed/Lumen.app --out build/guard-probe
          if python3 scripts/guard_probe_check.py --app build/unsandboxed/Lumen.app --out build/guard-probe-control --expect-pid 1; then
            echo "::error::the probe check passed with a pid that is not the probe's: it shows nothing"; exit 1
          fi
          # The kernel's table as the guard reads it (Lumen --socket-owners), read as if no socket were
          # delegated: it must disagree with the capture's eproc, or the comparison shows nothing.
          if python3 scripts/guard_probe_check.py --app build/unsandboxed/Lumen.app --out build/guard-probe-table-control --table-ignores-delegation; then
            echo "::error::the kernel's table read without delegation agreed with the capture: the table's comparison shows nothing"; exit 1
          fi
      - name: Lumen --guard-diagnose where no guard runs — it starts, says where it stops, and does not pass
        # The owner's diagnosis of the guard (GuardDiagnosis.swift) measures on a Mac with the guard
        # installed; here no extension can load. The app as built must say it has no guard; a copy
        # with the extension laid inside (ad hoc) must name it, read systemextensionsctl and the
        # filter's configuration, say it cannot ask a guard signed by no team, and print its answers.
        # A crash, a hang (60 s), a pass, or a section left out fails this (scripts/guard_diagnose_check.sh).
        if: always() && matrix.variant == 'unsandboxed'
        timeout-minutes: 5
        run: scripts/guard_diagnose_check.sh build/unsandboxed
      - name: The self-test's notes (what it measured, skipped, or could not show on this runner)
        # Its INFO lines, last in the log, so that they can be read without the whole log.
        if: always()
        run: |
          for variant in ${{ matrix.variant }}; do
            echo "--- self-test notes ($variant)"
            grep -h "^INFO" "build/egress/selftest-$variant.txt" | cut -c1-400 || true
          done
          # Every check the self-test could not make, on this runner or in that build: on the job's
          # page and in its summary, never only in the log.
          for variant in ${{ matrix.variant }}; do
            log="build/egress/selftest-$variant.txt"
            grep -h "^SELFTEST [A-Z]*:" "$log" 2>/dev/null | head -1 | sed "s/^/::notice title=self-test ($variant)::/" || true
            grep -h "^SELFTEST SKIPPED" "$log" 2>/dev/null | cut -c1-600 | sed "s/^/::warning title=self-test ($variant) - skipped::/" || true
            {
              echo "### Self-test ($variant)"
              summary="$(grep -h "^SELFTEST [A-Z]*:" "$log" 2>/dev/null | head -1)"
              echo "    ${summary:-no summary line: the self-test did not finish}"
              grep -h "^SELFTEST SKIPPED" "$log" 2>/dev/null | cut -c1-600 | sed 's/^SELFTEST SKIPPED /- /' || true
            } >> "$GITHUB_STEP_SUMMARY"
          done
          # What real input reached on this runner, as notices on the job (readable without the log).
          grep -h "^INFO \(paste as typed\|what sites see\|password AutoFill\)" build/egress/selftest-unsandboxed.txt \
            | head -8 | cut -c1-300 | sed 's/^/::notice title=self-test::/' || true
          # The XPC services that started while a profile ran in Safari's chrome, and what they held open.
          grep -h "^INFO XPC service" build/egress/selftest-unsandboxed.txt \
            | head -6 | cut -c1-1500 | sed 's/^/::notice title=self-test - XPC services::/' || true
          # Measured next to the macOS 27 job's same lines.
          grep -h "^INFO fragment jump" build/egress/selftest-unsandboxed.txt \
            | head -8 | cut -c1-1000 | sed 's/^/::notice title=self-test - measured::/' || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fast-selftest-${{ matrix.variant }}
          path: |
            build/egress/selftest-*.txt
            build/egress/history-shots
            build/crashes
            build/leaks
            build/guard-probe
            build/safari-surface.json
          if-no-files-found: ignore
