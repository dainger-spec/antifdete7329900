name: CI

# A measurement branch only, never merged (the owner, 1 November: preparing the tunnel — measured,
# no code in the product). A profile's WebRTC on the wire for each kind of proxy, and whether one
# app process's UDP can be told from another's by the process it comes from
# (scripts/measure/webrtc_udp.py).
on:
  push:

jobs:
  measure:
    name: WebRTC on the wire, per proxy kind (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, xcode-27]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: The machine
        run: sw_vers; xcodebuild -version | head -1; defaults read /Applications/Safari.app/Contents/Info.plist CFBundleShortVersionString
      - name: Build the app without the App Sandbox
        run: SANDBOX=0 APP_DIR=build/unsandboxed scripts/build-app.sh
      - name: WebRTC per proxy kind, captured with pktap
        timeout-minutes: 30
        run: python3 scripts/measure/webrtc_udp.py --app build/unsandboxed/Lumen.app --out build/measure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webrtc-udp-${{ matrix.runner }}
          path: build/measure
          if-no-files-found: ignore
