name: CI

# MEASUREMENT BRANCH (claude/measure-language): which language the app's interface takes and from
# where (the owner: `open build/Lumen.app --args -AppleLanguages "(en)"` came up in Russian), and in
# a process like a profile's, which language Safari's chrome and menus take and which language a
# page sees when the two are given apart (LanguageCheck.swift).

on:
  push:

jobs:
  language:
    name: Language measurement — ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, xcode-27]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: The machine
        continue-on-error: true
        run: |
          sw_vers
          defaults read -g AppleLanguages || true
          defaults read -g AppleLocale || true
      - name: Build the app without the App Sandbox
        timeout-minutes: 30
        run: SANDBOX=0 APP_DIR=build/unsandboxed scripts/build-app.sh
      - name: "The interface's language — as built, with -AppleLanguages (en), through open --args as the owner did"
        continue-on-error: true
        timeout-minutes: 10
        run: |
          set +e
          APP=build/unsandboxed/Lumen.app
          ls "$APP/Contents/Resources" | grep lproj
          defaults delete io.lumenbrowser.Lumen AppleLanguages 2>/dev/null
          echo "== 1. plain, nothing in the app's defaults"; "$APP/Contents/MacOS/Lumen" --language-check
          echo "== 2. after that run (what it wrote stays):"; defaults read io.lumenbrowser.Lumen AppleLanguages
          echo "== 3. -AppleLanguages (en)"; "$APP/Contents/MacOS/Lumen" --language-check -AppleLanguages "(en)"
          echo "== 4. open --args, as the owner"; rm -f build/open-out.txt
          open -W --stdout "$PWD/build/open-out.txt" --stderr "$PWD/build/open-err.txt" "$APP" --args --language-check -AppleLanguages "(en)"
          cat build/open-out.txt build/open-err.txt
          echo "== 5. PRIVACYBROWSER_LANG=en"; PRIVACYBROWSER_LANG=en "$APP/Contents/MacOS/Lumen" --language-check
      - name: "Safari's chrome in a process like a profile's — its menus' language, and what a page sees"
        continue-on-error: true
        timeout-minutes: 15
        run: |
          set +e
          APP=build/unsandboxed/Lumen.app
          chrome() {
            echo "::group::chrome language: $*"
            "$APP/Contents/MacOS/Lumen" --chrome-language-check "$@" 2>&1 | grep -E 'CHROME-LANG|Terminating|exception' | cut -c1-700
            echo "exit ${PIPESTATUS[0]}"
            echo "::endgroup::"
          }
          chrome -AppleLanguages "(de-DE, en)"
          chrome -AppleLanguages "(ru)"
          chrome -AppleLanguages "(en)"
          chrome -AppleLanguages "(ru)" --sites-languages en-US,en
          chrome -AppleLanguages "(en)" --sites-languages ru-RU,ru
          chrome -AppleLanguages "(ru)" --sites-languages de-DE,de
