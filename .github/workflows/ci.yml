name: CI
# Scratch branch claude/proxyux-check — never merged. CI here: the app built on macOS (the SwiftUI
# target does not build on Linux), the UI snapshots of Add (its choices, its sheets, the empty list,
# the editor's Add to List…, the Settings search for "OpenVPN") in both languages, the Settings
# search's own checks (the self-test's "finding settings, help and commands" group alone), and the
# .ovpn document type as LaunchServices reads it.
on:
  push:
    branches: ['claude/proxyux-check']

env:
  PB_GEO_SERVICES_OFF: "1"

jobs:
  proxyux:
    name: macOS build, Add's snapshots, the Settings search
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Build unsandboxed app
        run: SANDBOX=0 APP_DIR=build/unsandboxed scripts/build-app.sh
      - name: Build sandboxed app (default)
        run: APP_DIR=build/sandboxed scripts/build-app.sh
      - name: The .ovpn document type as LaunchServices reads it (a measurement)
        continue-on-error: true
        run: |
          plutil -p build/unsandboxed/Lumen.app/Contents/Info.plist | grep -A14 CFBundleDocumentTypes || true
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f "$PWD/build/unsandboxed/Lumen.app"
          mkdir -p build/ovpn && printf 'client\ndev tun\nremote vpn.example.net 1194\n' > build/ovpn/test.ovpn
          cat > build/ovpn/apps.swift <<'SWIFT'
          import AppKit
          let file = URL(fileURLWithPath: CommandLine.arguments[1])
          print("apps for .ovpn:", NSWorkspace.shared.urlsForApplications(toOpen: file).map(\.path))
          print("default:", NSWorkspace.shared.urlForApplication(toOpen: file)?.path ?? "none")
          SWIFT
          swift build/ovpn/apps.swift "$PWD/build/ovpn/test.ovpn"
      - name: The Settings search finds OpenVPN, VLESS, VMess, Trojan, Shadowsocks (the self-test's group alone)
        continue-on-error: true
        run: |
          set -o pipefail
          PB_SELFTEST_ONLY="finding settings, help and commands" build/unsandboxed/Lumen.app/Contents/MacOS/Lumen --self-test 2>&1 | tee build/selftest-search.txt
          grep -E "^(PASS|FAIL).*settings search" build/selftest-search.txt | cut -c1-300 | sed 's/^/::notice title=Settings search::/' || true
      - name: UI snapshots, both languages
        id: ui
        continue-on-error: true
        timeout-minutes: 30
        run: |
          set -o pipefail
          status=0
          mkdir -p build/ui-snapshots
          for lang in en ru; do
            PRIVACYBROWSER_LANG=$lang build/unsandboxed/Lumen.app/Contents/MacOS/Lumen --render-ui-snapshots "$PWD/build/ui-snapshots/$lang" \
              | tee "build/ui-snapshots/$lang.log" || status=1
          done
          mkdir -p build/proxyux-shots
          for lang in en ru; do
            for name in proxies proxies-empty proxies-empty-narrow proxies-add-choices sheet-proxy-add sheet-proxy-add-empty sheet-proxy-add-link \
                        sheet-openvpn-add sheet-openvpn-add-file sheet-openvpn-add-long editor-network editor-network-add editor-network-saved-empty \
                        settings-proxies settings-search-openvpn; do
              cp "build/ui-snapshots/$lang/$name.png" "build/proxyux-shots/$lang-$name.png" || echo "::warning::missing $lang/$name.png"
            done
          done
          grep -hE '^FAIL' build/ui-snapshots/*.log | head -20 || true
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proxyux-shots
          path: build/proxyux-shots
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-snapshots
          path: build/ui-snapshots
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-search
          path: build/selftest-search.txt
          if-no-files-found: ignore
