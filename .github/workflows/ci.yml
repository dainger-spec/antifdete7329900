name: CI
# Scratch branch claude/features-check — never merged. CI here: openvpn built as a release builds it
# (PATH cut to the system's and Xcode's tools), its version naming no git checkout.
on:
  push:
    branches: ['claude/features-check']

jobs:
  openvpn-build:
    name: openvpn as a release builds it (Xcode's tools only)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build openvpn with PATH cut
        run: env PATH=/usr/bin:/bin:/usr/sbin:/sbin ARCHS=arm64 scripts/build-openvpn.sh build/openvpn
      - name: Its version, and the app's check of it
        run: |
          build/openvpn/openvpn --version 2>&1 | head -1 || true
          cat build/openvpn/STAMP
          ls -l build/openvpn/licenses
