name: CI
# Scratch branch claude/ux-a-check — never merged. CI here: the app built on macOS (the SwiftUI
# target does not build on Linux), the UI snapshots in both languages and the real Settings window
# in both appearances, for area A's UX review (first run, vault, account, Settings, menus, alerts).
on:
  push:
    branches: ['claude/ux-a-check']

env:
  PB_GEO_SERVICES_OFF: "1"

concurrency:
  group: ux-a-check
  cancel-in-progress: true

jobs:
  uxa:
    name: macOS build, UI snapshots, Settings window
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Build unsandboxed app
        run: SANDBOX=0 APP_DIR=build/unsandboxed scripts/build-app.sh
      - name: UI snapshots, both languages
        id: ui
        continue-on-error: true
        timeout-minutes: 30
        run: |
          set -o pipefail
          status=0
          mkdir -p build/ui-snapshots
          for lang in en ru; do
            PRIVACYBROWSER_LANG=$lang build/unsandboxed/Lumen.app/Contents/MacOS/Lumen --render-ui-snapshots "$PWD/build/ui-snapshots/$lang" \
              | tee "build/ui-snapshots/$lang.log" || status=1
          done
          grep -hE '^FAIL' build/ui-snapshots/*.log | head -20 || true
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-snapshots
          path: build/ui-snapshots
          if-no-files-found: ignore
      - name: The Settings window as ⌘, opens it (light and dark)
        continue-on-error: true
        timeout-minutes: 10
        run: scripts/settings_window_check.sh build/unsandboxed/Lumen.app build/settings-window
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settings-window
          path: build/settings-window
          if-no-files-found: ignore
