# claude/measure-touch — a measurement branch, never merged: what a click brings a page in a mobile
# view and in a Mac profile, and where a profile's process stops when it stops answering
# (scripts/input_check.py, InputCheck.swift). The branch's fast pipeline is this job alone.
name: CI
on:
  push:
    branches: ['claude/measure-touch']
jobs:
  input:
    name: Input check — ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, xcode-27]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: The machine
        run: |
          sw_vers
          defaults read /Applications/Safari.app/Contents/Info.plist CFBundleShortVersionString || true
      - name: Build the app without the App Sandbox (profiles in processes of their own)
        timeout-minutes: 30
        run: NE=check SANDBOX=0 APP_DIR=build/unsandboxed scripts/build-app.sh
      - name: What a click brings a page — the check's page, tiktok.com, Google — and stacks when a process stops answering
        timeout-minutes: 60
        run: python3 scripts/input_check.py --app build/unsandboxed/Lumen.app --out build/input
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: input-${{ matrix.runner }}
          path: build/input
          if-no-files-found: warn
