name: CI
# Scratch branch claude/rel19-check — never merged. CI here: the release/0.1.19 integration built
# on macOS (the SwiftUI target does not build on Linux) and the UI snapshots in both languages.
on:
  push:
    branches: ['claude/rel19-check']

env:
  PB_GEO_SERVICES_OFF: "1"

jobs:
  rel19:
    name: macOS build, UI snapshots
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Build unsandboxed app
        run: SANDBOX=0 APP_DIR=build/unsandboxed scripts/build-app.sh
      - name: UI snapshots, both languages
        id: ui
        continue-on-error: true
        timeout-minutes: 30
        run: |
          set -o pipefail
          status=0
          mkdir -p build/ui-snapshots
          for lang in en ru; do
            PRIVACYBROWSER_LANG=$lang build/unsandboxed/Lumen.app/Contents/MacOS/Lumen --render-ui-snapshots "$PWD/build/ui-snapshots/$lang" \
              | tee "build/ui-snapshots/$lang.log" || status=1
          done
          ls build/ui-snapshots/en | wc -l
          grep -hE '^FAIL' build/ui-snapshots/*.log | head -20 || true
          exit $status
      - name: Snapshot result
        if: steps.ui.outcome == 'failure'
        run: echo "::warning::the UI snapshot step failed; see its log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-snapshots
          path: build/ui-snapshots
          if-no-files-found: ignore
