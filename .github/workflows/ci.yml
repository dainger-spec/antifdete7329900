name: CI

# A measurement branch only: Safari's window state in the profile's home (SafariUIState, the
# morning's question 7), with PB_MEASURE_UI_STATE=1 — the self-test (where the state goes, that a
# profile's home stays sealed after a stop, that a second launch gets the state back) and the menu
# walk against its records, on macOS 26 and 27. Never merged.
on:
  push:

jobs:
  measure:
    name: Safari's window state per profile on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, xcode-27]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      PB_MEASURE_UI_STATE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Build the app without the App Sandbox
        run: SANDBOX=0 APP_DIR=build/unsandboxed scripts/build-app.sh
      - name: A probe in this app's own domain (does a profile's process still see it?)
        run: defaults write dev.local.PrivacyBrowser PBUIStateAppDomainProbe -string seen
      - name: Self-test (unsandboxed)
        id: selftest
        continue-on-error: true
        timeout-minutes: 45
        run: |
          set -o pipefail
          mkdir -p build/measure
          python3 scripts/selftest_proxy.py --http 18080 --socks 18081 --http-auth 18082 --http6 18083 --socks2 18084 --socks-auth 18085 \
            --tls-control 18086 --canary 18087 --silent 18088 &
          PROXY_PID=$!
          for attempt in $(seq 1 40); do nc -z 127.0.0.1 18081 && break; sleep 0.5; done
          export PB_SELFTEST_HTTP_PROXY_PORT=18080 PB_SELFTEST_SOCKS_PROXY_PORT=18081 PB_SELFTEST_HTTP_AUTH_PROXY_PORT=18082 PB_SELFTEST_HTTP6_PROXY_PORT=18083
          export PB_SELFTEST_SOCKS2_PROXY_PORT=18084 PB_SELFTEST_SOCKS_AUTH_PROXY_PORT=18085
          export PB_SELFTEST_TLS_CONTROL_PORT=18086 PB_SELFTEST_CANARY_PORT=18087 PB_SELFTEST_SILENT_PROXY_PORT=18088
          code=0
          build/unsandboxed/PrivacyBrowser.app/Contents/MacOS/PrivacyBrowser --self-test 2>&1 | tee build/measure/selftest.txt || code=$?
          kill $PROXY_PID || true
          exit $code
      - name: The menu walk against its records
        id: walk
        if: always()
        continue-on-error: true
        timeout-minutes: 40
        run: |
          major="$(defaults read /Applications/Safari.app/Contents/Info.plist CFBundleShortVersionString | cut -d. -f1)"
          python3 scripts/menu_walk.py --app build/unsandboxed/PrivacyBrowser.app --out build/measure/menu-walk \
            --title "${{ matrix.runner }} - the walk" --record "docs/menu-walk/safari-$major.json" --check \
            --ignore "$HOME/Library/Logs:$HOME/actions-runner:$HOME/runners" --safari-sentinels
      - name: What was measured
        if: always()
        run: |
          echo "== the self-test's checks of it, and what failed"
          grep -h "window state\|standard defaults\|stays sealed\|came back\|own domain\|^FAIL" build/measure/selftest.txt | cut -c1-900 || true
          for log in build/measure/selftest.txt build/measure/menu-walk/walk.txt; do
            echo "== UISTATE and the walk's notes in $log"
            grep -h "UISTATE\|MENUWALK-INFO .*\(preferences\|home\|walked\)" "$log" | grep -v "UISTATE write" | cut -c1-1500 | head -60 || true
            echo "== writes through NSUserDefaults in $log, by instance"
            grep -ho "UISTATE write [a-zA-Z]* .* through .* from:" "$log" | sed 's/ from:$//' | sed 's/^.* through /through /' | sort | uniq -c | sort -rn | head -20 || true
            echo "== writes not through the profile's domain in $log"
            grep -h "UISTATE write" "$log" | grep -v "through the profile's domain" | cut -c1-700 | head -40 || true
          done
      - name: The self-test's and the walk's outcome
        if: always()
        run: |
          echo "self-test ${{ steps.selftest.outcome }}, walk ${{ steps.walk.outcome }}"
          test "${{ steps.selftest.outcome }}" = success && test "${{ steps.walk.outcome }}" = success
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-state-${{ matrix.runner }}
          path: build/measure
          if-no-files-found: ignore
