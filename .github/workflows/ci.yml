name: CI

# A measurement branch only (the owner's decision, 31 October): the iOS Simulator spike, once, on
# GitHub's xcode-27 image (Xcode 27 with its iOS simulators) — the one question: can each simulated
# device be given a proxy of its own (scripts/ios_simulator_spike.sh, docs/IOS_SIMULATOR.md).
# Never merged; nothing past this measurement.
on:
  push:

jobs:
  spike:
    name: iOS Simulator spike on xcode-27
    runs-on: xcode-27
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: The machine
        run: |
          sw_vers
          xcodebuild -version
          xcrun simctl list runtimes || true
      - name: The spike
        id: spike
        continue-on-error: true
        timeout-minutes: 60
        run: scripts/ios_simulator_spike.sh --yes
      - name: The verdict
        if: always()
        run: |
          for f in ios-simulator-spike-*.txt; do
            echo "== $f"
            grep -n "VERDICT\|verdict\|STOPPED\|per device\|reached\|device A\|device B\|injection\|environment" "$f" | head -80 || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-spike
          path: ios-simulator-spike-*.txt
          if-no-files-found: ignore
