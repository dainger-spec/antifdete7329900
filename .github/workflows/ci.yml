# claude/measure-guard-link — a measurement branch, never merged: whether the kernel ties WebKit's
# network process to the profile process it works for (scripts/guard_link_check.py). The branch's
# fast pipeline is this job alone, on macOS 26 and 27.
name: CI
on:
  push:
    branches: ['claude/measure-guard-link']
jobs:
  link:
    name: Guard link — ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, xcode-27]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: The machine
        run: sw_vers
      - name: Build the app without the App Sandbox (profiles in processes of their own)
        timeout-minutes: 30
        run: NE=check SANDBOX=0 APP_DIR=build/unsandboxed scripts/build-app.sh
      - name: What ties WebKit's network process to the profile process it works for
        timeout-minutes: 10
        run: python3 scripts/guard_link_check.py --app build/unsandboxed/Lumen.app --out build/guard-link
      - name: The same, a second time (another pair of probes)
        timeout-minutes: 10
        run: python3 scripts/guard_link_check.py --app build/unsandboxed/Lumen.app --out build/guard-link-2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guard-link-${{ matrix.runner }}
          path: build/guard-link*
          if-no-files-found: warn
