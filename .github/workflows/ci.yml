name: CI

# Red first (claude/measure-declared-red, never merged): the declared-Safari tests against 0.1.2's
# way of naming Safari — this Mac's Safari.app whatever engine the profile runs. Only these tests.
on:
  push:
    branches: ['**']

jobs:
  core-linux:
    name: Core tests (Linux, swift-crypto)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - run: swift test --filter SafariUserAgentTests
