name: CI

# MEASUREMENT BRANCH (claude/measure-dmg-steps): the release's scripts on real runners before they
# reach claude/redesign — the dry release with the disk image laid out (or made plain when Finder
# cannot), the plain image on its own (--plain), the window of each as Finder shows it, the download
# check both ways with the person's screens, and the account key's crash-report check with its control.

on:
  push:

jobs:
  release-scripts:
    name: Release scripts — ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, xcode-27]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: The machine
        run: sw_vers
      - name: The release, dry run (its disk image laid out, or plain)
        timeout-minutes: 45
        run: VERSION=0.1.1 BUILD=2 OUT=build/release scripts/release.sh 2>&1 | tee build-release.log
      - name: The plain image on its own
        run: scripts/make_dmg.sh build/release/app/Lumen.app build/plain.dmg --plain
      - name: The windows as Finder shows them
        continue-on-error: true
        run: |
          scripts/dmg_window_shot.sh build/release/Lumen-0.1.1.dmg build/shots/release
          scripts/dmg_window_shot.sh build/plain.dmg build/shots/plain
      - name: The download check — the control must be refused, with the person's screens
        continue-on-error: true
        run: scripts/download_check.sh build/release/Lumen-0.1.1.dmg --expect rejected --shots build/shots/control
      - name: And expecting acceptance it must fail on the same image
        continue-on-error: true
        run: |
          if scripts/download_check.sh build/release/Lumen-0.1.1.dmg --expect accepted; then echo "::error::accepted an image that is not notarized"; exit 1; fi
          echo "refused as it must be"
      - name: The account key in a crash report (and its control)
        continue-on-error: true
        run: python3 scripts/key_crash_check.py build/release/app/Lumen.app/Contents/MacOS/Lumen
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-scripts-${{ matrix.runner }}
          path: |
            build/shots
            build-release.log
          if-no-files-found: ignore
