name: CI

# MEASUREMENT BRANCH (claude/measure-language-split): the self-test's "interface and websites'
# languages" group, on the build as it is to be committed and on three builds broken on purpose —
# it must be green on the first and red on each of the others:
#   fixed         — the profile's own language given to its process; the interface's pinned first;
#   no-override   — the manager passes its process the proxy's or this Mac's languages only, as
#                   before (ProfileManager.startInOwnProcess);
#   no-pin        — the process takes its bundles' language from its command line (the websites'),
#                   as before (main.swift's Localization.pinInterfaceLanguage);
#   ui-to-sites   — someone gives websites the interface's language.

on:
  push:

jobs:
  languages:
    name: Languages — ${{ matrix.variant }} — ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: fixed, runner: macos-26 }
          - { variant: fixed, runner: xcode-27 }
          - { variant: no-override, runner: macos-26 }
          - { variant: no-pin, runner: macos-26 }
          - { variant: ui-to-sites, runner: macos-26 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: The machine
        run: |
          sw_vers
          defaults read -g AppleLanguages || true
      - name: "Break it: ${{ matrix.variant }}"
        run: |
          python3 - "${{ matrix.variant }}" <<'PY'
          import sys
          variant = sys.argv[1]
          def edit(path, old, new):
              text = open(path).read()
              assert text.count(old) == 1, (path, old)
              open(path, "w").write(text.replace(old, new))
          manager = "Sources/PrivacyBrowser/Browser/ProfileManager.swift"
          fixed = "let languages = stored.webLanguage(for: location).map { [$0] } ?? WebContentLanguage.systemLanguages"
          if variant == "no-override":
              edit(manager, fixed, "let languages = location.map { [$0.webLanguage] } ?? WebContentLanguage.systemLanguages")
          elif variant == "no-pin":
              edit("Sources/PrivacyBrowser/App/main.swift",
                   'if arguments.contains("--profile-session") { Localization.pinInterfaceLanguage() }',
                   'if arguments.contains("--profile-session") { _ = 0 }')
          elif variant == "ui-to-sites":
              edit(manager, fixed, "let languages = [ProfileProcess.interfaceLanguage(parent: ProcessInfo.processInfo.environment)]")
          print("variant", variant)
          PY
          git diff --stat
      - name: Build the app without the App Sandbox
        timeout-minutes: 30
        run: SANDBOX=0 APP_DIR=build/unsandboxed scripts/build-app.sh
      - name: The interface's language as the app starts (scripts/interface_language_check.sh)
        if: matrix.variant == 'fixed'
        continue-on-error: true
        timeout-minutes: 10
        run: scripts/interface_language_check.sh build/unsandboxed/Lumen.app
      - name: "The self-test's group: interface and websites' languages"
        timeout-minutes: 20
        env:
          PB_SELFTEST_ONLY: "interface and websites' languages"
        run: |
          set -o pipefail
          build/unsandboxed/Lumen.app/Contents/MacOS/Lumen --self-test 2>&1 | grep -E "^(PASS|FAIL|SKIP|SELFTEST)|languages:|Terminating" | cut -c1-600
