name: CI

# A scratch branch (claude/cookies-*): only the checks of cookie recovery, on one macOS runner —
# the app type-checked and built, the core's cookie tests under CryptoKit, and the self-test's
# cookie groups. Never merged: the branch's own commit replaces the fast pipeline for this run.
on:
  push:
    branches: ['claude/cookies-**']

env:
  PB_GEO_SERVICES_OFF: "1"

jobs:
  cookies:
    name: Scratch — cookie recovery (macOS 26)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: Core tests of cookie recovery and its neighbours (CryptoKit)
        run: swift test --filter "CookieRecoveryTests|CookieSnapshotFileTests|BinaryCookiesFileTests|CookieLaunchTests|CookieSyncTests|RestorePointTests|FormatPolicyTests|ProfileCountsTests"
      - name: Build unsandboxed app
        run: SANDBOX=0 APP_DIR=build/unsandboxed scripts/build-app.sh
      - name: Build sandboxed app
        run: APP_DIR=build/sandboxed scripts/build-app.sh
      - name: Self-test, the cookie groups (unsandboxed, then sandboxed)
        env:
          PB_SELFTEST_STRICT: "1"
          PRIVACYBROWSER_LANG: ru
          PB_SELFTEST_ONLY: "cookie recovery,cookie import,session cookies after a stop,profile sync"
        run: |
          set -o pipefail
          export PB_SELFTEST_HTTP_PROXY_PORT=18080 PB_SELFTEST_SOCKS_PROXY_PORT=18081 PB_SELFTEST_HTTP_AUTH_PROXY_PORT=18082 PB_SELFTEST_HTTP6_PROXY_PORT=18083
          export PB_SELFTEST_SOCKS2_PROXY_PORT=18084 PB_SELFTEST_SOCKS_AUTH_PROXY_PORT=18085
          export PB_SELFTEST_TLS_CONTROL_PORT=18086 PB_SELFTEST_CANARY_PORT=18087 PB_SELFTEST_SILENT_PROXY_PORT=18088 PB_SELFTEST_SOCKS_UDP_PROXY_PORT=18089
          mkdir -p build/egress
          python3 scripts/selftest_proxy.py --http 18080 --socks 18081 --http-auth 18082 --http6 18083 --socks2 18084 --socks-auth 18085 \
            --tls-control 18086 --canary 18087 --silent 18088 --socks-udp 18089 --aia-tag "c$(date +%s)" &
          PROXY_PID=$!
          for attempt in $(seq 1 40); do nc -z 127.0.0.1 18081 && break; sleep 0.5; done
          status=0
          for variant in unsandboxed sandboxed; do
            echo "::group::self-test ($variant)"
            build/$variant/Lumen.app/Contents/MacOS/Lumen --self-test | tee build/egress/selftest-$variant.txt || status=1
            echo "::endgroup::"
          done
          kill $PROXY_PID || true
          exit $status
      - name: The self-test's log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cookies-selftest
          path: build/egress/selftest-*.txt
          if-no-files-found: ignore
