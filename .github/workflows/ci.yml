name: CI

on:
  push:
  pull_request:

jobs:
  core-linux:
    name: Core tests (Linux, swift-crypto)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - name: Core tests, including the real client against the real sync server
        run: |
          TOKEN=$(python3 server/pbsync_server.py add-token --db "$RUNNER_TEMP/sync.db" --vault '*')
          python3 server/pbsync_server.py serve --db "$RUNNER_TEMP/sync.db" --port 18443 &
          sleep 1
          PB_SYNC_SERVER_URL=http://127.0.0.1:18443 PB_SYNC_SERVER_TOKEN="$TOKEN" swift test
      - name: VM controller core tests (runs tart-prototype.sh against stub tools)
        run: swift test --package-path vm/controller-app

  vm-agent:
    name: In-VM agent tests (Python)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -W error::ResourceWarning vm/agent/test_pbagent.py

  sync-server:
    name: Sync server tests (Python)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -W error::ResourceWarning server/test_pbsync_server.py

  shims:
    name: JavaScript shim tests (Node)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: TZ=America/New_York node scripts/test-shims.mjs

  vm-slim:
    name: VM slimming scripts (shellcheck + dry runs)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          for f in vm/slim.sh vm/measure-ram.sh vm/identity.sh vm/test-identity.sh \
                   vm/guest-proxy.sh vm/test-guest-proxy.sh vm/guest-kiosk.sh vm/test-slim.sh \
                   vm/controller/tart-prototype.sh vm/agent/install.sh; do
            bash -n "$f"
            shellcheck -S warning "$f"
          done
      - name: Dry runs do not touch the system
        run: |
          HOME=/nonexistent vm/slim.sh --dry-run
          HOME=/nonexistent vm/slim.sh --revert --dry-run
          HOME=/nonexistent vm/slim.sh --aggressive --strip-dev --dry-run
      - name: Hardware identity (stable MAC/hostname per profile, --print only)
        run: bash vm/test-identity.sh
      - name: Guest proxy setup (networksetup calls, --print only)
        run: bash vm/test-guest-proxy.sh
      - name: Kiosk settings and slim helpers
        run: |
          bash vm/guest-kiosk.sh --print | grep -q 'com.apple.dock autohide -bool true'
          bash vm/test-slim.sh
      - name: vm_stat parser (fed a captured sample off a Mac)
        run: |
          out=$(printf 'page size of 16384 bytes\nPages active: 30000.\nPages wired down: 25000.\nPages occupied by compressor: 10000.\n' \
                | vm/measure-ram.sh --parse-stdin 16384)
          echo "$out"
          # (25000 + 30000 + 10000) pages * 16384 / 1048576 = 1015.6 -> 1016 MiB used
          echo "$out" | grep -q 'used=1016'

  macos:
    name: macOS build, core tests, WebKit self-test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test
      - name: Build sandboxed app (default)
        run: APP_DIR=build/sandboxed scripts/build-app.sh
      - name: Build unsandboxed app
        run: SANDBOX=0 APP_DIR=build/unsandboxed scripts/build-app.sh
      - name: Self-test against real WebKit (sandboxed and unsandboxed)
        run: |
          python3 scripts/selftest_proxy.py --http 18080 --socks 18081 &
          PROXY_PID=$!
          sleep 1
          export PB_SELFTEST_HTTP_PROXY_PORT=18080 PB_SELFTEST_SOCKS_PROXY_PORT=18081
          status=0
          for variant in sandboxed unsandboxed; do
            echo "::group::self-test ($variant)"
            build/$variant/PrivacyBrowser.app/Contents/MacOS/PrivacyBrowser --self-test || status=1
            echo "::endgroup::"
          done
          kill $PROXY_PID || true
          exit $status
      - name: App Sandbox container migration (unsandboxed data → sandboxed first launch)
        run: |
          # Separate bundle ID so the sandbox container does not exist yet.
          BUNDLE_ID=dev.local.PBMigrationCheck SANDBOX=0 APP_DIR=build/migration-old scripts/build-app.sh
          BUNDLE_ID=dev.local.PBMigrationCheck APP_DIR=build/migration-new scripts/build-app.sh
          build/migration-old/PrivacyBrowser.app/Contents/MacOS/PrivacyBrowser --selftest-write-vault
          build/migration-new/PrivacyBrowser.app/Contents/MacOS/PrivacyBrowser --selftest-read-vault
          test ! -e "$HOME/Library/Application Support/PrivacyBrowser/vault.json" || { echo "vault was not moved"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: PrivacyBrowser.app
          path: build/sandboxed/PrivacyBrowser.app

  vm-launcher:
    name: VM launcher app (macOS)
    runs-on: macos-15
    defaults:
      run:
        working-directory: vm/controller-app
    steps:
      - uses: actions/checkout@v4
      - name: Core tests (tart-prototype.sh under macOS bash 3.2)
        run: swift test
      - name: Build VMLauncher.app (the build runs its --self-check)
        run: ZIP=1 scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: VMLauncher
          path: vm/controller-app/build/VMLauncher.zip
