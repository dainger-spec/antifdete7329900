name: CI

on:
  push:
  pull_request:

jobs:
  core-linux:
    name: Core tests (Linux, swift-crypto)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - run: swift test

  shims:
    name: JavaScript shim tests (Node)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: TZ=America/New_York node scripts/test-shims.mjs
      # The same tests under JavaScriptCore, the engine Safari runs: own-property order, error
      # messages and function text differ from V8 in ways a page can see.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - run: TZ=America/New_York bun scripts/test-shims.mjs
      # ru and en hold the same keys with the same format specifiers, every L("key") exists, and no
      # text a user reads is written into the code (scripts/check_localization.py).
      - name: Localization is complete in both languages
        run: python3 scripts/check_localization.py
      # Nothing of the user's (profile names, proxy hosts, addresses, paths, error texts) is
      # written to the system log in clear (scripts/check_log_privacy.py).
      - name: Log lines keep the user's data private
        run: python3 scripts/check_log_privacy.py

  macos:
    name: macOS build, core tests, WebKit self-test
    # The newest macOS and Xcode: WebKit enables several features only for apps linked against
    # the current SDK (Trusted Types, …), and the Safari comparison should see the same engine
    # and feature set a user of the current macOS gets.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test
      - name: Build sandboxed app (default)
        run: APP_DIR=build/sandboxed scripts/build-app.sh
      - name: Build unsandboxed app, and the packet-tunnel extension (unsigned, NE=check)
        # The extension needs a provisioned team to be signed and loaded (NE=1); CI compiles it
        # against this SDK and lays out its bundle so its plists are checked.
        run: NE=check SANDBOX=0 APP_DIR=build/unsandboxed scripts/build-app.sh
      - name: Release, dry run (no Apple account, a throwaway update key)
        # scripts/release.sh end to end: the app built with an update feed and keys, signed (ad hoc),
        # zipped, the zip signed with Ed25519, the appcast made and signed, both checked with the
        # app's own code (pbupdate verify). Notarization and stapling are skipped and said so.
        run: VERSION=0.1.1 BUILD=2 OUT=build/release scripts/release.sh
      - name: Updates end to end (a local feed and a new build; sandboxed and unsandboxed)
        # scripts/update_check.py: the old build's own updater against a local HTTPS feed — no request
        # with checks off (packet capture), an older build never offered, a stale and a forged appcast
        # and a changed archive refused, nothing installed while a profile with a window and a warm-up
        # without one run — then the quit path, the gate, the real installer: the swap, the new build
        # started, the old build's data opened by the new one. Its own bundle id (dev.local.PBUpdateCheck).
        # Early in the job, and not stopping it: a failure fails the job at its end ("Updates end to end, result").
        id: updates
        continue-on-error: true
        timeout-minutes: 30
        run: |
          status=0
          for variant in sandboxed unsandboxed; do
            echo "::group::updates, $variant"
            python3 scripts/update_check.py --variant $variant --out build/update-$variant || status=1
            echo "::endgroup::"
          done
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: update-check
          path: |
            build/update-*/run.txt
            build/update-*/verify.txt
            build/update-*/requests.json
            build/update-*/capture.txt
            build/update-*/*.json
          if-no-files-found: ignore
      - name: UI snapshots for design review, and clicks through the transparent title bar
        # The app's screens rendered with sample data (UISnapshots.swift) in both UI languages, uploaded
        # as the ui-snapshots artifact. A click that does not reach its button fails the job at the end.
        id: ui
        continue-on-error: true
        timeout-minutes: 8
        run: |
          status=0
          for lang in en ru; do
            PRIVACYBROWSER_LANG=$lang build/unsandboxed/PrivacyBrowser.app/Contents/MacOS/PrivacyBrowser --render-ui-snapshots "$PWD/build/ui-snapshots/$lang" || status=1
          done
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-snapshots
          path: build/ui-snapshots
          if-no-files-found: ignore
      - name: Self-test against real WebKit (sandboxed and unsandboxed)
        run: |
          set -o pipefail
          python3 scripts/selftest_proxy.py --http 18080 --socks 18081 --http-auth 18082 --http6 18083 --socks2 18084 --socks-auth 18085 \
            --tls-control 18086 --canary 18087 --silent 18088 &
          PROXY_PID=$!
          # The proxy makes its TLS certificates before it listens.
          for attempt in $(seq 1 40); do nc -z 127.0.0.1 18081 && break; sleep 0.5; done
          export PB_SELFTEST_HTTP_PROXY_PORT=18080 PB_SELFTEST_SOCKS_PROXY_PORT=18081 PB_SELFTEST_HTTP_AUTH_PROXY_PORT=18082 PB_SELFTEST_HTTP6_PROXY_PORT=18083
          export PB_SELFTEST_SOCKS2_PROXY_PORT=18084 PB_SELFTEST_SOCKS_AUTH_PROXY_PORT=18085
          export PB_SELFTEST_TLS_CONTROL_PORT=18086 PB_SELFTEST_CANARY_PORT=18087 PB_SELFTEST_SILENT_PROXY_PORT=18088
          mkdir -p build/egress
          status=0
          for variant in sandboxed unsandboxed; do
            echo "::group::self-test ($variant)"
            # The surface dump goes to the repository folder, which only the unsandboxed build may write.
            if [ "$variant" = unsandboxed ]; then
              export PB_SELFTEST_SURFACE_OUT="$PWD/build/surface-$variant"
              # Everything that leaves this machine while the unsandboxed self-test runs, with the
              # process each packet belongs to (pktap): scripts/egress_check.py reads it below.
              sudo tcpdump -i pktap,all -k NP -n -tt -l 'not host 127.0.0.1 and not host ::1' \
                > build/egress/capture.txt 2> build/egress/tcpdump.err &
              # And every file-system call of the app's processes and of WebKit's, for
              # scripts/disk_check.py: nothing may be written where the real Safari keeps its data.
              # One fs_usage for all three (the kernel trace is exclusive: a second one gets
              # "ktrace_start: Resource busy" and sees nothing).
              sudo fs_usage -w -f filesys PrivacyBrowser com.apple.WebKit cfprefsd > build/egress/fs.txt 2>&1 &
              sleep 2
            fi
            build/$variant/PrivacyBrowser.app/Contents/MacOS/PrivacyBrowser --self-test | tee "build/egress/selftest-$variant.txt" || status=1
            echo "::endgroup::"
          done
          sudo pkill -INT -f "tcpdump -i pktap" || true
          sudo pkill -INT -f "fs_usage -w" || true
          sleep 2
          kill $PROXY_PID || true
          echo "::group::egress capture around the Safari-chrome check"
          python3 scripts/egress_check.py --capture build/egress/capture.txt \
            --selftest-log build/egress/selftest-unsandboxed.txt --tcpdump-errors build/egress/tcpdump.err || status=1
          echo "::endgroup::"
          echo "::group::files written while a profile ran in Safari's chrome"
          python3 scripts/disk_check.py --trace build/egress/fs.txt \
            --selftest-log build/egress/selftest-unsandboxed.txt || status=1
          echo "::endgroup::"
          exit $status
      - name: Safari's private classes and methods the hosted chrome relies on
        # SafariChrome.expectedPieces: a macOS whose Safari renamed or removed one fails here, by name,
        # instead of a profile's window quietly degrading on a user's Mac. After the self-test, so
        # that a missing piece never hides what the self-test would have measured.
        if: always()
        run: build/unsandboxed/PrivacyBrowser.app/Contents/MacOS/PrivacyBrowser --check-safari-chrome
      - name: Compare the fingerprint surface with this Mac's real Safari (safaridriver)
        run: |
          sudo safaridriver --enable || echo "::warning::safaridriver --enable failed"
          python3 scripts/safari_reference.py --compare build/surface-unsandboxed/surface-macos.json --out build/safari-surface.json
          code=$?
          if [ "$code" = "2" ]; then echo "::warning::Safari could not be driven on this runner; surface not compared"; exit 0; fi
          exit $code
      - name: Leak check — does QUIC or WebRTC go around a profile's proxy?
        # Real forwarding proxies on this runner and a profile without one as the control; see
        # scripts/leak_check.py. Fails only on traffic seen going around a proxy (a site that is
        # down makes it inconclusive, not red).
        if: always()
        timeout-minutes: 10
        run: python3 scripts/leak_check.py --app build/unsandboxed/PrivacyBrowser.app --out build/leaks
      - name: Live fingerprinting pages in Safari and in profiles (report, never fails the build)
        # The same pages and scripts in this Mac's Safari and in on-screen profile windows of the
        # same size: probe, window geometry, request header order, TLS/HTTP2 (tls.peet.ws),
        # deviceinfo.me, CreepJS. Third-party sites change and go down, so this only reports.
        if: always()
        continue-on-error: true
        timeout-minutes: 25
        run: python3 scripts/live_compare.py --app build/unsandboxed/PrivacyBrowser.app --out build/live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fingerprint-surfaces
          path: |
            build/surface-sandboxed
            build/surface-unsandboxed
            build/safari-surface.json
            build/live
            build/leaks
            build/egress
          if-no-files-found: ignore
      - name: App Sandbox container migration (unsandboxed data → sandboxed first launch)
        run: |
          # Separate bundle ID so the sandbox container does not exist yet.
          BUNDLE_ID=dev.local.PBMigrationCheck SANDBOX=0 APP_DIR=build/migration-old scripts/build-app.sh
          BUNDLE_ID=dev.local.PBMigrationCheck APP_DIR=build/migration-new scripts/build-app.sh
          # Writes a real vault into the runner's unsandboxed vault folder: CI only (see SelfTest.migrationStep).
          PB_SELFTEST_MIGRATION=1 build/migration-old/PrivacyBrowser.app/Contents/MacOS/PrivacyBrowser --selftest-write-vault
          build/migration-new/PrivacyBrowser.app/Contents/MacOS/PrivacyBrowser --selftest-read-vault
          test ! -e "$HOME/Library/Application Support/PrivacyBrowser/vault.json" || { echo "vault was not moved"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: PrivacyBrowser.app
          path: build/sandboxed/PrivacyBrowser.app
      - name: Updates end to end, result
        if: always() && steps.updates.outcome == 'failure'
        run: |
          echo "::error::the end-to-end update scenarios failed; see the step \"Updates end to end\" and the update-check artifact"
          exit 1
      - name: UI snapshot checks
        if: always() && steps.ui.outcome == 'failure'
        run: |
          echo "::error::the UI snapshot step failed (a capture was not written or a click did not reach its button); see its log"
          exit 1
