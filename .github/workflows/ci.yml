name: CI
# Scratch branch claude/update-check — never merged. CI here: the app built on macOS, the update's
# windows snapshotted in both languages, the installer's tests on real bundles, and the update's
# end-to-end check (a Lumen opened again during the install must step aside), for fix/update-relaunch.
on:
  push:
    branches: ['claude/update-check']

env:
  PB_GEO_SERVICES_OFF: "1"

concurrency:
  group: update-check
  cancel-in-progress: true

jobs:
  update:
    name: macOS build, the update's windows, the installer's tests, updates end to end
    runs-on: macos-26
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - name: Build unsandboxed app
        run: SANDBOX=0 APP_DIR=build/unsandboxed scripts/build-app.sh
      - name: UI snapshots of the update's windows, both languages
        id: ui
        continue-on-error: true
        timeout-minutes: 15
        run: |
          set -o pipefail
          status=0
          mkdir -p build/ui-snapshots
          for lang in en ru; do
            PB_SNAPSHOTS_ONLY=updates PRIVACYBROWSER_LANG=$lang build/unsandboxed/Lumen.app/Contents/MacOS/Lumen --render-ui-snapshots "$PWD/build/ui-snapshots/$lang" \
              | tee "build/ui-snapshots/$lang.log" || status=1
          done
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-snapshots
          path: build/ui-snapshots
          if-no-files-found: ignore
      - name: The installer on real bundles, and the core's update tests
        id: tests
        continue-on-error: true
        timeout-minutes: 40
        run: swift test --filter 'UpdateInstallerTests|UpdateStepAsideTests|UpdateTests'
      - name: Updates end to end (a local feed and a new build; sandboxed and unsandboxed)
        id: updates
        continue-on-error: true
        timeout-minutes: 40
        run: |
          status=0
          for variant in sandboxed unsandboxed; do
            echo "::group::updates, $variant"
            python3 scripts/update_check.py --variant $variant --out build/update-$variant || status=1
            echo "::endgroup::"
          done
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: update-check
          path: |
            build/update-*/run.txt
            build/update-*/verify.txt
            build/update-*/requests.json
            build/update-*/*.json
          if-no-files-found: ignore
      - name: Result
        if: always()
        run: |
          echo "snapshots: ${{ steps.ui.outcome }}, tests: ${{ steps.tests.outcome }}, updates: ${{ steps.updates.outcome }}"
          test "${{ steps.ui.outcome }}" = success -a "${{ steps.tests.outcome }}" = success -a "${{ steps.updates.outcome }}" = success
