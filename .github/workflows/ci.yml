name: CI

on:
  push:
  pull_request:

jobs:
  core-linux:
    name: Core tests (Linux, swift-crypto)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - run: swift test

  shims:
    name: JavaScript shim tests (Node)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: TZ=America/New_York node scripts/test-shims.mjs
      # The same tests under JavaScriptCore, the engine Safari runs: own-property order, error
      # messages and function text differ from V8 in ways a page can see.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - run: TZ=America/New_York bun scripts/test-shims.mjs
      # ru and en hold the same keys with the same format specifiers, every L("key") exists, and no
      # text a user reads is written into the code (scripts/check_localization.py).
      - name: Localization is complete in both languages
        run: python3 scripts/check_localization.py
      # Nothing of the user's (profile names, proxy hosts, addresses, paths, error texts) is
      # written to the system log in clear (scripts/check_log_privacy.py).
      - name: Log lines keep the user's data private
        run: python3 scripts/check_log_privacy.py

  macos-27:
    name: macOS 27 — the self-test on the newest macOS (preview image, never fails the build)
    # GitHub's xcode-27 image runs macOS 27.0.1 with Safari 27.0.1 and Xcode 27 (its SDK): what a
    # user who updated has. The macOS job below (macos-26) is the one that gates the build; this one
    # reports what changes on the next macOS before users meet it, and fails nothing.
    runs-on: xcode-27
    continue-on-error: true
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: The machine
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          defaults read /Applications/Safari.app/Contents/Info.plist CFBundleShortVersionString || true
      - name: Build the app without the App Sandbox (the build that runs profiles in Safari's window)
        run: SANDBOX=0 APP_DIR=build/unsandboxed scripts/build-app.sh
      - name: Self-test against WebKit 27 (unsandboxed), inside a capture of every packet leaving the machine
        id: selftest27
        run: |
          set -o pipefail
          python3 scripts/selftest_proxy.py --http 18080 --socks 18081 --http-auth 18082 --http6 18083 --socks2 18084 --socks-auth 18085 \
            --tls-control 18086 --canary 18087 --silent 18088 &
          PROXY_PID=$!
          for attempt in $(seq 1 40); do nc -z 127.0.0.1 18081 && break; sleep 0.5; done
          export PB_SELFTEST_HTTP_PROXY_PORT=18080 PB_SELFTEST_SOCKS_PROXY_PORT=18081 PB_SELFTEST_HTTP_AUTH_PROXY_PORT=18082 PB_SELFTEST_HTTP6_PROXY_PORT=18083
          export PB_SELFTEST_SOCKS2_PROXY_PORT=18084 PB_SELFTEST_SOCKS_AUTH_PROXY_PORT=18085
          export PB_SELFTEST_TLS_CONTROL_PORT=18086 PB_SELFTEST_CANARY_PORT=18087 PB_SELFTEST_SILENT_PROXY_PORT=18088
          mkdir -p build/egress27
          sudo tcpdump -i pktap,all -k NP -n -tt -l 'not host 127.0.0.1 and not host ::1' \
            > build/egress27/capture.txt 2> build/egress27/tcpdump.err &
          sleep 2
          status=0
          build/unsandboxed/PrivacyBrowser.app/Contents/MacOS/PrivacyBrowser --self-test | tee build/egress27/selftest.txt || status=1
          sudo pkill -INT -f "tcpdump -i pktap" || true
          sleep 2
          kill $PROXY_PID || true
          echo "::group::egress capture"
          python3 scripts/egress_check.py --capture build/egress27/capture.txt \
            --selftest-log build/egress27/selftest.txt --tcpdump-errors build/egress27/tcpdump.err || status=1
          echo "::endgroup::"
          exit $status
      - name: What failed on macOS 27, and the certificate checks
        if: always()
        run: |
          log=build/egress27/selftest.txt
          grep -E '^(SELFTEST|INFO macOS|INFO WebKit [0-9])' $log 2>/dev/null | head -3 | sed 's/^/::notice title=macOS 27 self-test::/' || true
          grep '^FAIL' $log 2>/dev/null | head -7 | cut -c1-1500 | sed 's/^/::notice title=macOS 27 self-test - failed::/' || true
          # The XPC services that started while a profile ran in Safari's chrome, and what they held open.
          grep '^INFO XPC service' $log 2>/dev/null | head -6 | cut -c1-1500 | sed 's/^/::notice title=macOS 27 - XPC services::/' || true
      - name: The certificate checks on macOS 27
        if: always()
        run: |
          grep -E '^(PASS|FAIL) certificates' build/egress27/selftest.txt 2>/dev/null | head -10 | cut -c1-1000 \
            | sed 's/^/::notice title=macOS 27 - certificates::/' || true
      - name: What crashed on macOS 27, if anything (crash reports)
        if: always()
        run: |
          mkdir -p build/egress27/crashes
          shopt -s nullglob
          for report in ~/Library/Logs/DiagnosticReports/PrivacyBrowser*.ips ~/Library/Logs/DiagnosticReports/com.apple.WebKit*.ips \
                        /Library/Logs/DiagnosticReports/PrivacyBrowser*.ips /Library/Logs/DiagnosticReports/com.apple.WebKit*.ips; do
            cp "$report" build/egress27/crashes/ 2>/dev/null || sudo cp "$report" build/egress27/crashes/
          done
          sudo chmod -R a+r build/egress27/crashes 2>/dev/null || true
          python3 scripts/crash_summary.py build/egress27/crashes/*.ips | tee build/egress27/crashes/summary.txt
          grep '^CRASH' build/egress27/crashes/summary.txt | grep -v '^CRASH none' | head -16 | cut -c1-300 | sed 's/^/::warning title=macOS 27 - crash::/' || true
      - name: A jump to a fragment in a profile with a proxy (a measurement)
        if: always()
        run: |
          grep '^INFO fragment jump' build/egress27/selftest.txt 2>/dev/null | head -8 | cut -c1-1000 \
            | sed 's/^/::notice title=macOS 27 - measured::/' || true
      - name: A jump to a fragment — the same document, in Safari 27 and in a profile? (a measurement)
        # scripts/fragment_check.py: one page of this Mac sets location.hash and says whether its
        # document survived, in this Mac's Safari and in a profile (this app's window, Safari's).
        if: always()
        continue-on-error: true
        timeout-minutes: 12
        run: |
          set +e
          python3 scripts/fragment_check.py --app build/unsandboxed/PrivacyBrowser.app | tee build/egress27/fragment.txt
          grep '^FRAGMENT' build/egress27/fragment.txt | head -9 | cut -c1-600 | sed 's/^/::notice title=macOS 27 - fragment jump::/'
          exit 0
      - name: What Safari 27's chrome brings into a profile's process (an inventory)
        if: always()
        continue-on-error: true
        timeout-minutes: 6
        run: |
          set +e
          build/unsandboxed/PrivacyBrowser.app/Contents/MacOS/PrivacyBrowser --safari-inventory > build/egress27/safari-inventory.txt 2> build/egress27/safari-inventory.err
          echo "exit $?"
          grep -E '^(INVENTORY|LS) ' build/egress27/safari-inventory.txt | head -10 | cut -c1-500 | sed 's/^/::notice title=macOS 27 - Safari inventory::/'
          grep -E '^XPC [^ ]*Safari' build/egress27/safari-inventory.txt | head -10 | cut -c1-600 | sed 's/^/::notice title=macOS 27 - XPC services of Safari frameworks::/'
          echo "::group::the inventory"; cat build/egress27/safari-inventory.txt; echo "::endgroup::"
          exit 0
      - name: Safari 27's question about the default browser — as built, and declared a browser (a measurement)
        if: always()
        continue-on-error: true
        timeout-minutes: 4
        run: scripts/default_browser_check.sh build/unsandboxed/PrivacyBrowser.app build/egress27/default-browser "macOS 27 - default browser"
      - name: Safari 27's history inside a profile's process (a measurement)
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        run: |
          set +e
          # A run that dies leaves a crash report: which one is new since here, and its summary.
          since="$(mktemp)"
          build/unsandboxed/PrivacyBrowser.app/Contents/MacOS/PrivacyBrowser --history-check > build/egress27/history-check.txt 2>/dev/null
          echo "exit $?"; cat build/egress27/history-check.txt
          grep '^HISTORY-CHECK' build/egress27/history-check.txt | head -12 | cut -c1-500 | sed 's/^/::notice title=macOS 27 - history in a profile process::/'
          build/unsandboxed/PrivacyBrowser.app/Contents/MacOS/PrivacyBrowser --history-check --in-process-fallback > build/egress27/history-check-fallback.txt 2>/dev/null
          echo "exit $?"; cat build/egress27/history-check-fallback.txt
          grep '^HISTORY-CHECK' build/egress27/history-check-fallback.txt | head -12 | cut -c1-500 | sed 's/^/::notice title=macOS 27 - history in a profile process (fallback)::/'
          find ~/Library/Logs/DiagnosticReports /Library/Logs/DiagnosticReports -name 'PrivacyBrowser*.ips' -newer "$since" 2>/dev/null \
            | while read -r report; do python3 scripts/crash_summary.py "$report" | head -60; done
          exit 0
      - name: What follows the SDK on macOS 27 — the build as made, and a copy that declares Xcode 27's SDK (a measurement)
        if: always()
        continue-on-error: true
        timeout-minutes: 6
        run: |
          scripts/sdk_check.sh build/unsandboxed/PrivacyBrowser.app build/egress27/sdk-check "macOS 27 - SDK behaviors" \
            "$(xcrun --show-sdk-version)" build/egress27/sdk-check/ui
      - name: Which SDK SwiftPM writes into an executable on macOS 27 (a measurement)
        if: always()
        continue-on-error: true
        timeout-minutes: 6
        run: scripts/swiftpm_sdk_probe.sh build/egress27/swiftpm-sdk "macOS 27 - SwiftPM's SDK version"
      - name: Safari 27's File › Export › Bookmarks… in a profile's process (a measurement)
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        run: |
          set +e
          build/unsandboxed/PrivacyBrowser.app/Contents/MacOS/PrivacyBrowser --export-check > build/egress27/export-check.txt 2>/dev/null
          echo "exit $?"; cat build/egress27/export-check.txt
          grep '^EXPORT-CHECK' build/egress27/export-check.txt | head -20 | cut -c1-500 | sed 's/^/::notice title=macOS 27 - export in a profile process::/'
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-27-selftest
          path: build/egress27
          if-no-files-found: ignore

  macos:
    name: macOS build, core tests, WebKit self-test
    # The newest macOS and Xcode: WebKit enables several features only for apps linked against
    # the current SDK (Trusted Types, …), and the Safari comparison should see the same engine
    # and feature set a user of the current macOS gets.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test
      - name: Build sandboxed app (default)
        run: APP_DIR=build/sandboxed scripts/build-app.sh
      - name: Build unsandboxed app, and the packet-tunnel extension (unsigned, NE=check)
        # The extension needs a provisioned team to be signed and loaded (NE=1); CI compiles it
        # against this SDK and lays out its bundle so its plists are checked.
        run: NE=check SANDBOX=0 APP_DIR=build/unsandboxed scripts/build-app.sh
      - name: Release, dry run (no Apple account, a throwaway update key)
        # scripts/release.sh end to end: the app built with an update feed and keys, signed (ad hoc),
        # zipped, the zip signed with Ed25519, the appcast made and signed, both checked with the
        # app's own code (pbupdate verify). Notarization and stapling are skipped and said so.
        run: VERSION=0.1.1 BUILD=2 OUT=build/release scripts/release.sh
      - name: Updates end to end (a local feed and a new build; sandboxed and unsandboxed)
        # scripts/update_check.py: the old build's own updater against a local HTTPS feed — no request
        # with checks off (packet capture), an older build never offered, a stale and a forged appcast
        # and a changed archive refused, nothing installed while a profile with a window and a warm-up
        # without one run — then the quit path, the gate, the real installer: the swap, the new build
        # started, the old build's data opened by the new one. Its own bundle id (dev.local.PBUpdateCheck).
        # Early in the job, and not stopping it: a failure fails the job at its end ("Updates end to end, result").
        id: updates
        continue-on-error: true
        timeout-minutes: 30
        run: |
          status=0
          for variant in sandboxed unsandboxed; do
            echo "::group::updates, $variant"
            python3 scripts/update_check.py --variant $variant --out build/update-$variant || status=1
            echo "::endgroup::"
          done
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: update-check
          path: |
            build/update-*/run.txt
            build/update-*/verify.txt
            build/update-*/requests.json
            build/update-*/capture.txt
            build/update-*/*.json
          if-no-files-found: ignore
      - name: UI snapshots for design review, and clicks through the transparent title bar
        # The app's screens rendered with sample data (UISnapshots.swift) in both UI languages, uploaded
        # as the ui-snapshots artifact. A click that does not reach its button fails the job at the end.
        id: ui
        continue-on-error: true
        timeout-minutes: 8
        run: |
          status=0
          for lang in en ru; do
            PRIVACYBROWSER_LANG=$lang build/unsandboxed/PrivacyBrowser.app/Contents/MacOS/PrivacyBrowser --render-ui-snapshots "$PWD/build/ui-snapshots/$lang" || status=1
          done
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-snapshots
          path: build/ui-snapshots
          if-no-files-found: ignore
      - name: Self-test against real WebKit (sandboxed and unsandboxed)
        run: |
          set -o pipefail
          python3 scripts/selftest_proxy.py --http 18080 --socks 18081 --http-auth 18082 --http6 18083 --socks2 18084 --socks-auth 18085 \
            --tls-control 18086 --canary 18087 --silent 18088 &
          PROXY_PID=$!
          # The proxy makes its TLS certificates before it listens.
          for attempt in $(seq 1 40); do nc -z 127.0.0.1 18081 && break; sleep 0.5; done
          export PB_SELFTEST_HTTP_PROXY_PORT=18080 PB_SELFTEST_SOCKS_PROXY_PORT=18081 PB_SELFTEST_HTTP_AUTH_PROXY_PORT=18082 PB_SELFTEST_HTTP6_PROXY_PORT=18083
          export PB_SELFTEST_SOCKS2_PROXY_PORT=18084 PB_SELFTEST_SOCKS_AUTH_PROXY_PORT=18085
          export PB_SELFTEST_TLS_CONTROL_PORT=18086 PB_SELFTEST_CANARY_PORT=18087 PB_SELFTEST_SILENT_PROXY_PORT=18088
          mkdir -p build/egress
          status=0
          for variant in sandboxed unsandboxed; do
            echo "::group::self-test ($variant)"
            # The surface dump goes to the repository folder, which only the unsandboxed build may write.
            if [ "$variant" = unsandboxed ]; then
              export PB_SELFTEST_SURFACE_OUT="$PWD/build/surface-$variant"
              # Everything that leaves this machine while the unsandboxed self-test runs, with the
              # process each packet belongs to (pktap): scripts/egress_check.py reads it below.
              sudo tcpdump -i pktap,all -k NP -n -tt -l 'not host 127.0.0.1 and not host ::1' \
                > build/egress/capture.txt 2> build/egress/tcpdump.err &
              # And every file-system call of the app's processes and of WebKit's, for
              # scripts/disk_check.py: nothing may be written where the real Safari keeps its data.
              # One fs_usage for all three (the kernel trace is exclusive: a second one gets
              # "ktrace_start: Resource busy" and sees nothing).
              sudo fs_usage -w -f filesys PrivacyBrowser com.apple.WebKit cfprefsd > build/egress/fs.txt 2>&1 &
              sleep 2
            fi
            build/$variant/PrivacyBrowser.app/Contents/MacOS/PrivacyBrowser --self-test | tee "build/egress/selftest-$variant.txt" || status=1
            echo "::endgroup::"
          done
          sudo pkill -INT -f "tcpdump -i pktap" || true
          sudo pkill -INT -f "fs_usage -w" || true
          sleep 2
          kill $PROXY_PID || true
          echo "::group::egress capture around the Safari-chrome check"
          python3 scripts/egress_check.py --capture build/egress/capture.txt \
            --selftest-log build/egress/selftest-unsandboxed.txt --tcpdump-errors build/egress/tcpdump.err || status=1
          echo "::endgroup::"
          echo "::group::files written while a profile ran in Safari's chrome"
          python3 scripts/disk_check.py --trace build/egress/fs.txt \
            --selftest-log build/egress/selftest-unsandboxed.txt || status=1
          echo "::endgroup::"
          exit $status
      - name: What crashed, if a process of the app or WebKit's crashed (crash reports)
        # A profile's own process that dies leaves the self-test only "the profile quit
        # unexpectedly"; macOS writes what happened to a crash report. Summarized here (the crashed
        # thread's frames), and the reports themselves go into the fingerprint-surfaces artifact.
        if: always()
        run: |
          mkdir -p build/crashes
          shopt -s nullglob
          for report in ~/Library/Logs/DiagnosticReports/PrivacyBrowser*.ips ~/Library/Logs/DiagnosticReports/com.apple.WebKit*.ips \
                        /Library/Logs/DiagnosticReports/PrivacyBrowser*.ips /Library/Logs/DiagnosticReports/com.apple.WebKit*.ips; do
            cp "$report" build/crashes/ 2>/dev/null || sudo cp "$report" build/crashes/
          done
          sudo chmod -R a+r build/crashes 2>/dev/null || true
          python3 scripts/crash_summary.py build/crashes/*.ips | tee build/crashes/summary.txt
          grep '^CRASH' build/crashes/summary.txt | grep -v '^CRASH none' | head -16 | cut -c1-300 | sed 's/^/::warning title=crash::/' || true
      - name: Safari's private classes and methods the hosted chrome relies on
        # SafariChrome.expectedPieces: a macOS whose Safari renamed or removed one fails here, by name,
        # instead of a profile's window quietly degrading on a user's Mac. After the self-test, so
        # that a missing piece never hides what the self-test would have measured.
        if: always()
        run: build/unsandboxed/PrivacyBrowser.app/Contents/MacOS/PrivacyBrowser --check-safari-chrome
      - name: What Safari's chrome brings into a profile's process (an inventory, never fails the build)
        # SafariChromeInventory.swift: Safari's menu as a profile's window has it, LaunchServices'
        # answers with a home of its own, the classes around AutoFill, history and export, and the
        # methods that wait. In the artifact (fingerprint-surfaces), and the menu's File items here.
        if: always()
        continue-on-error: true
        timeout-minutes: 6
        run: |
          set +e
          build/unsandboxed/PrivacyBrowser.app/Contents/MacOS/PrivacyBrowser --safari-inventory > build/safari-inventory.txt 2> build/safari-inventory.err
          echo "exit $?"
          grep -E '^(INVENTORY|LS) ' build/safari-inventory.txt | head -10 | cut -c1-500 | sed 's/^/::notice title=Safari inventory::/'
          grep -E '^XPC [^ ]*Safari' build/safari-inventory.txt | head -10 | cut -c1-600 | sed 's/^/::notice title=XPC services of Safari frameworks::/'
          grep -E '^MENU [^|]*(File|Файл|History|История|Bookmarks|Закладки) ' build/safari-inventory.txt | head -10 | cut -c1-400 \
            | sed 's/^/::notice title=Safari inventory - menu::/'
          echo "::group::the inventory"; cat build/safari-inventory.txt; echo "::endgroup::"
          exit 0
      - name: Safari's question about the default browser — as built, and declared a browser (a measurement)
        # Whether -[GeneralPreferences _defaultWebBrowserMayHaveChanged], which threw on a nil when ⌘,
        # opened Safari's settings in a profile's window, throws because the app is no http/https
        # handler (SafariChrome.runDefaultBrowserCheck). Never fails the build.
        if: always()
        continue-on-error: true
        timeout-minutes: 4
        run: scripts/default_browser_check.sh build/unsandboxed/PrivacyBrowser.app build/default-browser "default browser"
      - name: Safari's history inside a profile's process (a measurement)
        # Whether Safari's History service's own code runs in a profile's process, with its database
        # in the profile's home (SafariHistoryCheck). Never fails the build.
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        run: |
          set +e
          # A run that dies leaves a crash report: which one is new since here, and its summary.
          since="$(mktemp)"
          build/unsandboxed/PrivacyBrowser.app/Contents/MacOS/PrivacyBrowser --history-check > build/history-check.txt 2>/dev/null
          echo "exit $?"; cat build/history-check.txt
          grep '^HISTORY-CHECK' build/history-check.txt | head -12 | cut -c1-500 | sed 's/^/::notice title=history in a profile process::/'
          build/unsandboxed/PrivacyBrowser.app/Contents/MacOS/PrivacyBrowser --history-check --in-process-fallback > build/history-check-fallback.txt 2>/dev/null
          echo "exit $?"; cat build/history-check-fallback.txt
          grep '^HISTORY-CHECK' build/history-check-fallback.txt | head -12 | cut -c1-500 | sed 's/^/::notice title=history in a profile process (fallback)::/'
          find ~/Library/Logs/DiagnosticReports /Library/Logs/DiagnosticReports -name 'PrivacyBrowser*.ips' -newer "$since" 2>/dev/null \
            | while read -r report; do python3 scripts/crash_summary.py "$report" | head -60; done
          exit 0
      - name: What follows the SDK — the build as made, and a copy that declares this Xcode's SDK (a measurement)
        # Whether window.trustedTypes and the window's other interfaces, the screen's visible frame
        # (screen.availHeight) and the app's own screens follow the SDK the executable declares, and
        # whether WebKit's switch (SDKBehaviors) puts a page where Safari's is. Never fails the build.
        if: always()
        continue-on-error: true
        timeout-minutes: 6
        run: |
          scripts/sdk_check.sh build/unsandboxed/PrivacyBrowser.app build/sdk-check "SDK behaviors" \
            "$(xcrun --show-sdk-version)" build/sdk-check/ui
      - name: Which SDK SwiftPM writes into an executable (a measurement)
        if: always()
        continue-on-error: true
        timeout-minutes: 6
        run: scripts/swiftpm_sdk_probe.sh build/sdk-check/swiftpm "SwiftPM's SDK version"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdk-check
          path: build/sdk-check
          if-no-files-found: ignore
      - name: Safari's File › Export › Bookmarks… in a profile's process (a measurement)
        # Where its save panel opens in a process whose home is the profile's, what Safari's
        # exporter is given, and what it writes where (SafariExportCheck). Never fails the build.
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        run: |
          set +e
          build/unsandboxed/PrivacyBrowser.app/Contents/MacOS/PrivacyBrowser --export-check > build/export-check.txt 2>/dev/null
          echo "exit $?"; cat build/export-check.txt
          grep '^EXPORT-CHECK' build/export-check.txt | head -20 | cut -c1-500 | sed 's/^/::notice title=export in a profile process::/'
          exit 0
      - name: Compare the fingerprint surface with this Mac's real Safari (safaridriver)
        run: |
          sudo safaridriver --enable || echo "::warning::safaridriver --enable failed"
          python3 scripts/safari_reference.py --compare build/surface-unsandboxed/surface-macos.json --out build/safari-surface.json
          code=$?
          if [ "$code" = "2" ]; then echo "::warning::Safari could not be driven on this runner; surface not compared"; exit 0; fi
          exit $code
      - name: Leak check — does QUIC or WebRTC go around a profile's proxy?
        # Real forwarding proxies on this runner and a profile without one as the control; see
        # scripts/leak_check.py. Fails only on traffic seen going around a proxy (a site that is
        # down makes it inconclusive, not red).
        if: always()
        timeout-minutes: 10
        run: python3 scripts/leak_check.py --app build/unsandboxed/PrivacyBrowser.app --out build/leaks
      - name: Live fingerprinting pages in Safari and in profiles (report, never fails the build)
        # The same pages and scripts in this Mac's Safari and in on-screen profile windows of the
        # same size: probe, window geometry, request header order, TLS/HTTP2 (tls.peet.ws),
        # deviceinfo.me, CreepJS. Third-party sites change and go down, so this only reports.
        if: always()
        continue-on-error: true
        timeout-minutes: 25
        run: python3 scripts/live_compare.py --app build/unsandboxed/PrivacyBrowser.app --out build/live
      - name: What sites see — a new profile's snapshot next to this Mac's Safari, as the panel takes it
        # The sandboxed build: its snapshot's listener (127.0.0.1, network.server) is the one under
        # test, and its profiles are in this app's own window. Safari is asked to open the page as
        # for a user; one that does not answer is a warning. After the egress capture, where
        # Safari's own traffic would count.
        if: always()
        timeout-minutes: 8
        run: |
          set +e
          build/sandboxed/PrivacyBrowser.app/Contents/MacOS/PrivacyBrowser --what-sites-see-check | tee build/what-sites-see.txt
          code=${PIPESTATUS[0]}
          # The summary as notices on the job, readable without the log (ten at most per step).
          grep "^WHAT-SITES-SEE" build/what-sites-see.txt | head -10 | cut -c1-1500 \
            | sed 's/^/::notice title=What sites see - this app'"'"'s window without a proxy::/'
          if [ "$code" = "2" ]; then echo "::warning::Safari did not answer the What-sites-see page on this runner"; exit 0; fi
          exit $code
      - name: What sites see — a profile with a proxy in Safari's window (the build without the App Sandbox)
        # What a customer's profile is: a process of its own showing Safari's window, an HTTP proxy
        # in its settings, WebRTC off. The proxy, 127.0.0.1:9, answers nothing: the measuring page
        # is on this Mac and loads directly, and the lookup of the proxy's location gets no answer,
        # so the profile keeps this Mac's language and time zone, as Safari does. Fails when the
        # window would not be Safari's.
        if: always()
        timeout-minutes: 8
        run: |
          set +e
          build/unsandboxed/PrivacyBrowser.app/Contents/MacOS/PrivacyBrowser --what-sites-see-check --safari-window --proxy 127.0.0.1:9 \
            | tee build/what-sites-see-safari-window-proxy.txt
          code=${PIPESTATUS[0]}
          grep "^WHAT-SITES-SEE" build/what-sites-see-safari-window-proxy.txt | head -10 | cut -c1-1500 \
            | sed 's/^/::notice title=What sites see - Safari'"'"'s window with a proxy::/'
          if [ "$code" = "2" ]; then echo "::warning::Safari did not answer the What-sites-see page on this runner"; exit 0; fi
          exit $code
      - name: What sites see — a profile without a proxy in Safari's window (the build without the App Sandbox)
        # Next to the step before: what the window changes, apart from what the proxy does.
        if: always()
        timeout-minutes: 8
        run: |
          set +e
          build/unsandboxed/PrivacyBrowser.app/Contents/MacOS/PrivacyBrowser --what-sites-see-check --safari-window \
            | tee build/what-sites-see-safari-window.txt
          code=${PIPESTATUS[0]}
          grep "^WHAT-SITES-SEE" build/what-sites-see-safari-window.txt | head -10 | cut -c1-1500 \
            | sed 's/^/::notice title=What sites see - Safari'"'"'s window without a proxy::/'
          if [ "$code" = "2" ]; then echo "::warning::Safari did not answer the What-sites-see page on this runner"; exit 0; fi
          exit $code
      - name: A jump to a fragment — the same document, in Safari and in a profile? (a measurement)
        # scripts/fragment_check.py; next to the macOS 27 job's same step (WebKit 27 made a new
        # document of such a jump in the self-test's web views).
        if: always()
        continue-on-error: true
        timeout-minutes: 12
        run: |
          set +e
          python3 scripts/fragment_check.py --app build/unsandboxed/PrivacyBrowser.app | tee build/fragment.txt
          grep '^FRAGMENT' build/fragment.txt | head -9 | cut -c1-600 | sed 's/^/::notice title=fragment jump::/'
          exit 0
      - name: Apple Pay, Payment Request and Web Push — what their calls answer in Safari and in a profile (a measurement)
        # scripts/payments_check.py: one HTTPS page of this Mac (a throwaway authority, trusted for
        # the run and removed after; its key deleted once it has signed), whose own script is the
        # only one measuring; in Safari, and in new profiles with a proxy — as they ship, in this
        # app's window and in Safari's, and with WebKit's own switches for them on and the
        # profile's scripts in the page's world, in a world of their own, or none
        # (PaymentsCheck.swift). For the parity rule (ISOLATION §2); it never fails the build.
        if: always()
        continue-on-error: true
        timeout-minutes: 25
        run: |
          set +e
          python3 scripts/payments_check.py --app build/unsandboxed/PrivacyBrowser.app --trust system --out build/payments \
            | tee build/payments.txt
          code=${PIPESTATUS[0]}
          grep "^PAYMENTS-SUMMARY" build/payments.txt | head -10 | cut -c1-2000 \
            | sed 's/^/::notice title=Payments and push - summary::/'
          if [ "$code" != "0" ]; then echo "::warning::payments_check.py exited $code (2: Safari did not report; 1: a variant did not)"; fi
          exit 0
      - name: Apple Pay, Payment Request and Web Push — the answers
        if: always()
        run: |
          grep "^PAYMENTS-CALLS" build/payments.txt 2>/dev/null | head -10 | cut -c1-4000 \
            | sed 's/^/::notice title=Payments and push - answers::/' || true
      - name: Apple Pay, Payment Request and Web Push — the window's own properties only one side has
        if: always()
        run: |
          grep "^PAYMENTS-NAMES" build/payments.txt 2>/dev/null | head -10 | cut -c1-4000 \
            | sed 's/^/::notice title=Payments and push - window names::/' || true
      - name: The window's own properties a profile without a proxy lacks, by name (a measurement)
        # Without a proxy a profile in Safari's window has 1019 of Safari's 1044: WebRTC's 23 and
        # two more, which only a count named so far. The same page as the step above, the profile
        # without a proxy, over HTTP on 127.0.0.1 (a secure context too): trusting the step above's
        # throwaway authority a second time hung for 120 s in CI run 436, and names need no
        # certificate.
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        run: |
          set +e
          python3 scripts/payments_check.py --app build/unsandboxed/PrivacyBrowser.app --http --out build/payments-direct \
            --proxy none --variants shipped-safari-window | tee build/payments-direct.txt
          grep "^PAYMENTS-NAMES" build/payments-direct.txt | head -5 | cut -c1-4000 \
            | sed 's/^/::notice title=Window names - Safari'"'"'s window without a proxy::/'
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fingerprint-surfaces
          path: |
            build/surface-sandboxed
            build/surface-unsandboxed
            build/safari-surface.json
            build/live
            build/leaks
            build/egress
            build/payments
            build/payments-direct
            build/crashes
            build/safari-inventory.txt
          if-no-files-found: ignore
      - name: App Sandbox container migration (unsandboxed data → sandboxed first launch)
        run: |
          # Separate bundle ID so the sandbox container does not exist yet.
          BUNDLE_ID=dev.local.PBMigrationCheck SANDBOX=0 APP_DIR=build/migration-old scripts/build-app.sh
          BUNDLE_ID=dev.local.PBMigrationCheck APP_DIR=build/migration-new scripts/build-app.sh
          # Writes a real vault into the runner's unsandboxed vault folder: CI only (see SelfTest.migrationStep).
          PB_SELFTEST_MIGRATION=1 build/migration-old/PrivacyBrowser.app/Contents/MacOS/PrivacyBrowser --selftest-write-vault
          build/migration-new/PrivacyBrowser.app/Contents/MacOS/PrivacyBrowser --selftest-read-vault
          test ! -e "$HOME/Library/Application Support/PrivacyBrowser/vault.json" || { echo "vault was not moved"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: PrivacyBrowser.app
          path: build/sandboxed/PrivacyBrowser.app
      - name: Updates end to end, result
        if: always() && steps.updates.outcome == 'failure'
        run: |
          echo "::error::the end-to-end update scenarios failed; see the step \"Updates end to end\" and the update-check artifact"
          exit 1
      - name: UI snapshot checks
        if: always() && steps.ui.outcome == 'failure'
        run: |
          echo "::error::the UI snapshot step failed (a capture was not written or a click did not reach its button); see its log"
          exit 1
      - name: The self-test's notes (what it measured, skipped, or could not show on this runner)
        # Its INFO lines, last in the log, so that they can be read without the whole log.
        if: always()
        run: |
          for variant in sandboxed unsandboxed; do
            echo "--- self-test notes ($variant)"
            grep -h "^INFO" "build/egress/selftest-$variant.txt" | cut -c1-400 || true
          done
          # What real input reached on this runner, as notices on the job (readable without the log).
          grep -h "^INFO \(paste as typed\|what sites see\|password AutoFill\)" build/egress/selftest-unsandboxed.txt \
            | head -8 | cut -c1-300 | sed 's/^/::notice title=self-test::/' || true
          # The XPC services that started while a profile ran in Safari's chrome, and what they held open.
          grep -h "^INFO XPC service" build/egress/selftest-unsandboxed.txt \
            | head -6 | cut -c1-1500 | sed 's/^/::notice title=self-test - XPC services::/' || true
          # Measured next to the macOS 27 job's same lines.
          grep -h "^INFO fragment jump" build/egress/selftest-unsandboxed.txt \
            | head -8 | cut -c1-1000 | sed 's/^/::notice title=self-test - measured::/' || true
