name: CI

# A measurement branch only: the local queue's head built and its new tests run ahead of the main
# branch — the core tests on Linux and macOS (LaunchQueue's among them), both app builds, and the
# exception checks with the Objective-C @try called from a Swift task (ObjCExceptions). Never merged.
on:
  push:

jobs:
  linux:
    name: Core tests (Linux, swift-crypto)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - run: swift test

  macos:
    name: macOS build, core tests, the exception checks
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - name: Build sandboxed app (default)
        run: APP_DIR=build/sandboxed scripts/build-app.sh
      - name: Build unsandboxed app
        run: SANDBOX=0 APP_DIR=build/unsandboxed scripts/build-app.sh
      - name: The exception checks, the one from a Swift task first
        run: |
          app=build/unsandboxed/PrivacyBrowser.app/Contents/MacOS/PrivacyBrowser
          status=0
          for mode in "--in-task" "" "--replacing"; do
            echo "== --exception-check $mode"
            "$app" --exception-check $mode; code=$?
            echo "exit $code"
            if [ "$mode" = "--in-task" ] && [ "$code" != "0" ]; then status=1; fi
          done
          exit $status
