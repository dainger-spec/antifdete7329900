name: iOS device tools (measurement)

# Measurement only (claude/ios-app-measure, never merged), for the owner's blocked real-iPhone runs
# (8 November): what Xcode 27's devicectl and macOS's devmodectl offer on the image the owner's Xcode
# matches, how devicectl lists simulators (run_device.sh picked one), and how it parses the launch
# arguments (run_device.sh's -control was read as -t, the timeout). Report-only: the log and the
# artifact; it fails only if device_pick.py's own tests fail.
on:
  push:
    branches: [claude/ios-app-measure]
    paths:
      - ".github/workflows/device-tools.yml"
      - "ios-measure/device_pick.py"
      - "ios-measure/test_device_pick.py"
      - "ios-measure/run_device.sh"
      - "ios-measure/check_app.py"
      - "ios-measure/ports_free.py"
      - "ios-measure/test_tools.py"
      - "ios-measure/control_stub.py"
      - "ios-measure/build_sim_app.sh"
      - "ios-measure/app/**"
      - "ios-measure/host/harness.py"
  workflow_dispatch:

jobs:
  tools:
    name: devicectl and devmodectl on xcode-27
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: The machine
        run: sw_vers; xcodebuild -version; mkdir -p out
      - name: devmodectl — is it on macOS 27, and what it says
        run: |
          set +e
          ls -l /usr/sbin/devmodectl /usr/bin/devmodectl /usr/libexec/devmodectl 2>&1
          echo "== devmodectl (no arguments)"; devmodectl 2>&1 | head -40
          echo "== devmodectl help"; devmodectl help 2>&1 | head -40
          echo "== man devmodectl"; man -P cat devmodectl 2>/dev/null | col -b | head -150
          true
      - name: devicectl — its commands, and what it says about Developer Mode and pairing
        run: |
          set +e
          xcrun devicectl --version
          echo "== devicectl help"; xcrun devicectl help 2>&1 | head -80
          for c in "list devices" "manage" "manage pair" "manage ddis" "device" "device info" "device info details" "device install app" "device process launch"; do
            echo; echo "== devicectl $c --help"; xcrun devicectl $c --help 2>&1 | head -80
          done
          true
      - name: The device list with simulators running (what run_device.sh tripped on)
        run: |
          set +e
          for name in "iPhone 17 Pro" "iPhone 16 Pro"; do
            udid=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; n=sys.argv[1]; print(next((d["udid"] for r,ds in json.load(sys.stdin)["devices"].items() for d in ds if d["name"]==n), ""))' "$name")
            [[ -n "$udid" ]] && xcrun simctl boot "$udid" && xcrun simctl bootstatus "$udid" -b >/dev/null 2>&1
          done
          xcrun simctl list devices booted
          echo "== devicectl list devices"; xcrun devicectl list devices 2>&1
          xcrun devicectl list devices --json-output out/devices.json >/dev/null 2>&1
          python3 -c 'import json; d=json.load(open("out/devices.json")); [print(json.dumps({k: x.get(k) for k in ("identifier","deviceProperties","hardwareProperties","connectionProperties")}, ensure_ascii=False)[:1500]) for x in d.get("result",{}).get("devices",[])]'
          echo "== device_pick on it"; python3 ios-measure/device_pick.py out/devices.json; echo "exit $?"
          true
      - name: Launch arguments — run_device.sh's form, then the two fixes
        run: |
          set +e
          bogus=00000000-0000-0000-0000-000000000000
          url=http://192.0.2.1:28310
          echo "== as run_device.sh had it: … io.lumenbrowser.measure -control URL"
          xcrun devicectl device process launch --device $bogus --terminate-existing io.lumenbrowser.measure -control $url 2>&1 | tail -6
          echo "== the address in the environment: --environment-variables {\"LUMEN_CONTROL\": URL}"
          xcrun devicectl device process launch --device $bogus --terminate-existing --environment-variables "{\"LUMEN_CONTROL\": \"$url\"}" io.lumenbrowser.measure 2>&1 | tail -6
          echo "== after --: … io.lumenbrowser.measure -- -control URL"
          xcrun devicectl device process launch --device $bogus --terminate-existing io.lumenbrowser.measure -- -control $url 2>&1 | tail -6
          true
      - name: device_pick's tests (the owner's case, and the list measured above)
        run: python3 ios-measure/test_device_pick.py out/devices.json
      - name: The tools' own checks — red on the tree before the owner's fixes, green on this one
        run: |
          mkdir -p old && git fetch -q --depth=1 origin 15c7ffeb942340b3938aa1b70c4707ab2a121297 && git archive FETCH_HEAD ios-measure | tar -x -C old
          if python3 ios-measure/test_tools.py old/ios-measure; then echo "RED DID NOT FAIL: the checks pass on the tree before the fixes"; exit 1; fi
          echo "RED OK: the checks fail on the tree before the fixes"
          python3 ios-measure/test_tools.py ios-measure
      - name: The bundle id — the iPhone build's Info.plist against the id the script launches
        run: |
          set -u
          command -v xcodegen >/dev/null || brew install xcodegen >/dev/null
          build() { # plist-source label -> exit of check_app.py
            rm -rf "bid-$2" && mkdir -p "bid-$2" && cp -R ios-measure/device ios-measure/app "bid-$2/"
            cp "$1" "bid-$2/app/Info.plist"
            (cd "bid-$2/device" && xcodegen generate --quiet && xcodebuild -project LumenMeasure.xcodeproj -scheme LumenMeasure \
               -configuration Debug -destination "generic/platform=iOS" -derivedDataPath ../dd CODE_SIGNING_ALLOWED=NO \
               PRODUCT_BUNDLE_IDENTIFIER=io.lumenbrowser.measure.TEAMTEST build >../build.txt 2>&1) || { tail -20 "bid-$2/build.txt"; return 2; }
            python3 ios-measure/check_app.py "$(find "bid-$2/dd/Build/Products" -maxdepth 2 -name LumenMeasure.app | head -1)" io.lumenbrowser.measure.TEAMTEST
          }
          if build old/ios-measure/app/Info.plist old; then echo "RED DID NOT FAIL: the old Info.plist passes"; exit 1; fi
          echo "RED OK: with the old Info.plist the built app is not the one the script launches"
          build ios-measure/app/Info.plist new
      - name: The driver on a simulator calling this Mac's network address — App Transport Security and its status screen
        run: |
          set -u
          LAN="$(ipconfig getifaddr en0 || ipconfig getifaddr en1)"; echo "this Mac: $LAN"
          # The image has runtimes but no simulators made: make one on the newest iOS and boot it.
          read -r runtime type <<<"$(xcrun simctl list -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          rs = sorted((r for r in d["runtimes"] if r.get("platform", "iOS") == "iOS" and r.get("isAvailable", True)),
                      key=lambda r: tuple(int(x) for x in r["version"].split(".")), reverse=True)
          r = rs[0]; names = {t["identifier"]: t["name"] for t in d["devicetypes"]}
          ok = [t["identifier"] for t in r.get("supportedDeviceTypes", [])] or list(names)
          pick = next((i for n in ("iPhone 17 Pro", "iPhone 16 Pro") for i in ok if names.get(i) == n), [i for i in ok if "iPhone" in names.get(i, "")][-1])
          print(r["identifier"], pick)')"
          udid="$(xcrun simctl create "Lumen tools" "$type" "$runtime")"
          xcrun simctl boot "$udid"; xcrun simctl bootstatus "$udid" -b >/dev/null 2>&1
          echo "simulator $udid ($type, $runtime)"
          trial() { # label plist driver -> "hello: yes|no" and the status file
            local dir="ats-$1"; rm -rf "$dir"; mkdir -p "$dir/src/app"
            cp ios-measure/build_sim_app.sh "$dir/src/"; cp "$2" "$dir/src/app/Info.plist"; cp "$3" "$dir/src/app/Driver.swift"; cp ios-measure/app/main.swift "$dir/src/app/"
            "$dir/src/build_sim_app.sh" "$dir/build" 17.0 >"$dir/build.txt" 2>&1 || { tail -20 "$dir/build.txt"; return 2; }
            xcrun simctl uninstall "$udid" io.lumenbrowser.measure >/dev/null 2>&1; xcrun simctl install "$udid" "$dir/build/LumenMeasure.app"
            python3 ios-measure/control_stub.py 28310 30 >"$dir/stub.txt" &
            local stub=$!; sleep 1
            SIMCTL_CHILD_LUMEN_CONTROL="http://$LAN:28310" xcrun simctl launch "$udid" io.lumenbrowser.measure >/dev/null
            wait $stub
            local data; data="$(xcrun simctl get_app_container "$udid" io.lumenbrowser.measure data)"
            cat "$dir/stub.txt"; echo "status file: $(tr '\n' '|' <"$data/Documents/control-status.txt" 2>/dev/null || echo none)"
            xcrun simctl terminate "$udid" io.lumenbrowser.measure >/dev/null 2>&1
          }
          echo "== ATS red: the old Info.plist (no NSAllowsLocalNetworking), this driver"
          out="$(trial atsred old/ios-measure/app/Info.plist ios-measure/app/Driver.swift)"; echo "$out"
          if echo "$out" | grep -q "hello: yes"; then echo "RED DID NOT FAIL: the old Info.plist got through (ATS does not stop it on the simulator)"; else echo "RED OK: the old Info.plist does not get through"; fi
          echo "== status red: this Info.plist, the old driver (it has no status screen)"
          out="$(trial statusred ios-measure/app/Info.plist old/ios-measure/app/Driver.swift)"; echo "$out"
          if echo "$out" | grep -q "status file: none"; then echo "RED OK: the old driver shows nothing"; else echo "RED DID NOT FAIL: the old driver wrote a status"; fi
          echo "== green: this Info.plist, this driver"
          out="$(trial green ios-measure/app/Info.plist ios-measure/app/Driver.swift)"; echo "$out"
          echo "$out" | grep -q "hello: yes" || { echo "NOT GREEN: the driver did not get through to $LAN"; exit 1; }
          echo "$out" | grep -q "состояние: связь есть" || { echo "NOT GREEN: the status screen does not say it is connected"; exit 1; }
          echo "GREEN: the driver gets through to this Mac's network address and says so"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-tools-${{ github.run_number }}
          path: out
