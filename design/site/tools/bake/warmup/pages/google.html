<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
body{background:#fff;color:#202124;min-height:100vh;display:flex;flex-direction:column}
.top{display:flex;justify-content:flex-end;align-items:center;gap:18px;padding:14px 22px;font-size:14px}
.top .btn{background:#1a73e8;color:#fff;border-radius:6px;padding:9px 22px;font-weight:500}
.top .apps{width:22px;height:22px;display:grid;grid-template-columns:repeat(3,4px);gap:3px}
.top .apps i{width:4px;height:4px;background:#5f6368;border-radius:50%}
main{flex:1;display:flex;flex-direction:column;align-items:center;padding-top:16vh}
.logo{font:500 88px/1 "Liberation Sans",Arial,sans-serif;letter-spacing:-4px;color:#5f6368}
.box{margin-top:30px;width:min(584px,88vw);height:48px;border:1px solid #dfe1e5;border-radius:24px;box-shadow:0 1px 6px rgba(32,33,36,.18)}
.btns{display:flex;gap:12px;margin-top:28px}.btns span{background:#f8f9fa;border:1px solid #f1f3f4;border-radius:4px;padding:10px 16px;font-size:14px;color:#3c4043}
.lang{margin-top:26px;font-size:13px;color:#4d5156}.lang b{color:#1a0dab;font-weight:400}
footer{background:#f2f2f2;color:#70757a;font-size:14px}
footer div{padding:14px 30px;border-bottom:1px solid #dadce0}
footer nav{display:flex;justify-content:space-between;padding:14px 30px}
@media (max-width:600px){.logo{font-size:64px}.btns{display:none}main{padding-top:14vh}}
</style>
