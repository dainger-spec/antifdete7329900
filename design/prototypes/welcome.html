<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumen — welcome</title>
<!--
  The launch screen (WelcomeSplash.swift), frame for frame: the eclipse as LumenHorizon draws it; the
  greeting in Pacifico's own outline (welcome-lettering.js, generated by design/tools/welcome_lettering.py,
  the same data the app gets), revealed by a pen moving along the letters' centrelines; the glass a
  fragment shader makes of it — a height map from the blurred outline, its normals bending the
  horizon's light behind the letters, a narrow highlight along their upper edges and a softer rim
  of the horizon's light below, the edges catching light, a faint caustic inside, a soft glow
  around; the pen's fresh stroke brighter, then one light along the finished word; "LUMEN", the
  first launch's button, and the opening into the lock screen.

  ?lang=ru|en|de|…   the greeting          ?ui=ru|en  the interface (button, lock screen)
  ?first=1           the first launch: the button, no opening by itself
  ?rm=1              Reduce Motion          ?t=1.4     one still frame at 1.4 s (no playing)
  window.__render(t) draws the frame at t seconds (design/tools/record_welcome.mjs records with it).
  A click or a key skips to the opening, as in the app.
-->
<style>
  html, body { margin: 0; height: 100%; background: #08090B; overflow: hidden; }
  #stage { display: block; position: fixed; inset: 0; width: 100vw; height: 100vh; }
  #glass { display: block; position: fixed; left: 0; top: 0; pointer-events: none; }
  .ui { position: fixed; inset: 0; pointer-events: none; z-index: 1;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, sans-serif; }
  #wordmark { position: absolute; left: 0; right: 0; text-align: center; color: rgba(244, 244, 245, 0.46);
              font-weight: 600; text-indent: 0.62em; letter-spacing: 0.62em; }
  #start { position: absolute; left: 50%; transform: translateX(-50%); pointer-events: auto;
           height: 28px; padding: 0 16px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.14);
           background: rgba(22, 23, 27, 0.92); color: #F4F4F5; font: 500 12.5px/26px -apple-system,
           BlinkMacSystemFont, Inter, sans-serif; letter-spacing: 0.01em; cursor: pointer; box-sizing: border-box;
           box-shadow: 0 1px 0 rgba(255, 255, 255, 0.06) inset, 0 6px 18px rgba(0, 0, 0, 0.45); }
  /* The lock screen behind, as the opening reveals it (a stand-in for UnlockView / SetupView). */
  #lock { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
          justify-content: center; color: #F4F4F5; font-family: -apple-system, BlinkMacSystemFont, Inter, sans-serif;
          opacity: 0; transform-origin: 50% 50%; pointer-events: none; z-index: 2; background: #08090B;
          background-image:
            radial-gradient(circle at calc(100% + 330px) -300px, transparent 640px, rgba(236, 240, 248, 0.55) 642px,
                            rgba(236, 240, 248, 0.10) 652px, rgba(236, 240, 248, 0.03) 700px, transparent 760px),
            radial-gradient(circle at -260px calc(100% + 290px), transparent 470px, rgba(236, 240, 248, 0.5) 472px,
                            rgba(236, 240, 248, 0.09) 482px, rgba(236, 240, 248, 0.03) 520px, transparent 580px); }
  #lock .mark { width: 64px; height: 64px; border-radius: 15px; background: #111216;
                box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.10) inset; position: relative; }
  #lock .mark::before, #lock .mark::after { content: ""; position: absolute; left: 13px; top: 13px; width: 38px;
                height: 38px; border-radius: 50%; background: #F4F4F5; }
  #lock .mark::before { clip-path: polygon(0 0, 46% 0, 34% 100%, 0 100%); transform: translate(-1px, 2px); }
  #lock .mark::after { clip-path: polygon(52% 0, 100% 0, 100% 100%, 40% 100%); transform: translate(1px, -2px); }
  #lock h1 { font-size: 32px; font-weight: 700; margin: 28px 0 0; letter-spacing: -0.01em; }
  #lock p { font-size: 15px; color: #A1A1AA; margin: 10px 0 0; }
  #lock .field { width: 352px; height: 48px; margin-top: 36px; border-radius: 12px; background: #0D0E11;
                 box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.5) inset, 0 0 0 4px rgba(255, 255, 255, 0.06); }
  #lock .label { width: 352px; margin-top: 36px; font-size: 13px; font-weight: 600; }
  #lock .label + .field { margin-top: 8px; }
  #lock .button { width: 352px; height: 44px; margin-top: 16px; border-radius: 12px; background: #F4F4F5; color: #08090B;
                  font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
  #lock .corner { position: fixed; border-radius: 50%; pointer-events: none; }
</style>
</head>
<body>
<div id="lock"></div>
<canvas id="stage"></canvas>
<canvas id="glass"></canvas>
<div class="ui"><div id="wordmark">LUMEN</div><button id="start"></button></div>
<script src="welcome-lettering.js"></script>
<script>
'use strict';
const query = new URLSearchParams(location.search);
const ALL = window.WELCOME_LETTERING;
const greeting = ALL.find((g) => g.code === (query.get('lang') || 'ru')) || ALL[0];
const ui = query.get('ui') || (greeting.code === 'ru' || greeting.code === 'uk' ? 'ru' : 'en');
const firstLaunch = query.get('first') === '1';
const reduced = query.get('rm') === '1';
const TEXT = {
  ru: { start: 'Приступить', unlock: 'Хранилище заблокировано', unlockSub: 'Введите мастер-пароль, чтобы продолжить.',
        unlockButton: 'Разблокировать', setup: 'Создайте мастер-пароль', next: 'Продолжить',
        setupSub: 'Он шифрует список профилей, их настройки, пароли, историю и данные сайтов.', password: 'Мастер-пароль' },
  en: { start: 'Get started', unlock: 'Vault locked', unlockSub: 'Enter your master password to continue.',
        unlockButton: 'Unlock', setup: 'Create a master password', next: 'Continue',
        setupSub: 'It encrypts the profile list, their settings, passwords, history and website data.', password: 'Master password' },
}[ui];

// MARK: Timing — the same numbers as WelcomeTiming (WelcomeSplash.swift).
const T = {
  arcIn: 0.5,          // the horizon fades and rises in
  penStart: 0.3,       // the pen starts
  settle: 0.75,        // the light runs along the finished greeting
  wordmarkDelay: 0.15, // "LUMEN" after the greeting, over…
  wordmarkIn: 0.6,
  buttonDelay: 0.35,   // the first launch's button, over…
  buttonIn: 0.5,
  hold: 0.9,           // from the end of the writing to the opening, on a later launch
  opening: 0.6,
  reducedIn: 0.4,      // Reduce Motion: the greeting fades in whole…
  reducedHold: 1.2,    // …stays…
  reducedOpening: 0.4, // …and the screen cross-fades
  trail: 0.14,         // the pen's fresh stroke, brighter
};
const D = greeting.duration;
const writtenAt = T.penStart + D;
let openingAt = firstLaunch ? Infinity : (reduced ? T.reducedIn + T.reducedHold : writtenAt + T.hold);

// MARK: Geometry

function parse(d) {
  const n = d.split(/[\s,]+/).filter((s) => s && !/[MC]/.test(s)).map(Number);
  const segs = [];
  let x = n[0], y = n[1];
  for (let i = 2; i + 5 < n.length + 1; i += 6) {
    segs.push([x, y, n[i], n[i + 1], n[i + 2], n[i + 3], n[i + 4], n[i + 5]]);
    x = n[i + 4]; y = n[i + 5];
  }
  return segs;
}
const strokes = greeting.strokes.map((s) => ({ ...s, segs: parse(s.d), pen: s.p.split(' ').map(Number) }));
const outline = new Path2D(greeting.outline);
const lastEnd = Math.max(...strokes.map((s) => s.t1));

/** The cubic `s` split at `u`: [first part, second part]. */
function split(s, u) {
  const [x0, y0, x1, y1, x2, y2, x3, y3] = s;
  const l = (a, b) => a + (b - a) * u;
  const ax = l(x0, x1), ay = l(y0, y1), bx = l(x1, x2), by = l(y1, y2), cx = l(x2, x3), cy = l(y2, y3);
  const dx = l(ax, bx), dy = l(ay, by), ex = l(bx, cx), ey = l(by, cy);
  const fx = l(dx, ex), fy = l(dy, ey);
  return [[x0, y0, ax, ay, dx, dy, fx, fy], [fx, fy, ex, ey, cx, cy, x3, y3]];
}

/** The stroke between pen positions `a` and `b` (segment index + parameter), in x-heights, into `path`. */
function addSubpath(path, segs, a, b) {
  a = Math.max(0, Math.min(segs.length, a));
  b = Math.max(0, Math.min(segs.length, b));
  if (b - a < 1e-4) return false;
  const from = Math.floor(a), to = Math.min(segs.length - 1, Math.floor(b - 1e-9));
  for (let k = from; k <= to; k++) {
    let s = segs[k];
    const ua = k === from ? a - k : 0, ub = k === to ? b - k : 1;
    if (ub < 1) s = split(s, ub)[0];
    if (ua > 0) s = split(s, ua / ub)[1];
    if (k === from) path.moveTo(s[0], s[1]);
    path.bezierCurveTo(s[2], s[3], s[4], s[5], s[6], s[7]);
  }
  return true;
}

/** Where the pen of `stroke` is at time `t` (writing time, from the first stroke's start). */
function penAt(stroke, t) {
  if (t <= stroke.t0) return 0;
  if (t >= stroke.t1) return stroke.segs.length;
  const f = (t - stroke.t0) * 120;
  const i = Math.floor(f);
  const pen = stroke.pen;
  if (i + 1 >= pen.length) return pen[pen.length - 1];
  return pen[i] + (pen[i + 1] - pen[i]) * (f - i);
}

/** What the pen has written by `t`, and the last `span` seconds of its way (null when nothing). */
function written(t) {
  const path = new Path2D();
  let any = false;
  for (const s of strokes) any = addSubpath(path, s.segs, 0, penAt(s, t)) || any;
  return any ? path : null;
}
function trail(t, span) {
  const path = new Path2D();
  let any = false;
  for (const s of strokes) {
    if (t > s.t0 && t < s.t1 + span) any = addSubpath(path, s.segs, penAt(s, t - span), penAt(s, t)) || any;
  }
  return any ? path : null;
}

// MARK: Layout — WelcomeLayout (WelcomeSplash.swift)

function layout(W, H) {
  const radius = W * 0.78, top = H * 0.54;
  const b = greeting.bounds;
  // The x-height: the mock's (6.8 % of the height); a short greeting larger, up to 9.5 %, so that it
  // spans about 44 % of the width; never wider than 86 % of the window.
  const words = b[2] - b[0];
  let xh = Math.min(Math.max(H * 0.068, (W * 0.44) / words), H * 0.095);
  xh = Math.min(xh, (W * 0.86) / words);
  const baseline = top + 0.62 * xh;
  const descent = Math.max(0, b[3]);
  const stroke = greeting.reveal / 1.22 * xh;   // the font's widest stroke, points
  // The glass's own frame: what the greeting covers, with room for its glow.
  const pad = stroke * 1.6;
  const rect = { x: W / 2 + b[0] * xh - pad, y: baseline + b[1] * xh - pad,
                 w: (b[2] - b[0]) * xh + 2 * pad, h: (b[3] - b[1]) * xh + 2 * pad };
  return { W, H, radius, top, xh, baseline, stroke, rect, cx: W / 2, cy: top + radius,
           wordmarkY: baseline + Math.max(0.95, descent + 0.42) * xh };
}

// MARK: The horizon — LumenHorizon.draw (VMWallpaper's eclipse), with the launch screen's haze

function drawHorizon(ctx, L, haze = true) {
  const { W, H, radius, top } = L;
  ctx.fillStyle = '#08090B';
  ctx.fillRect(0, 0, W, H);
  const lift = ctx.createRadialGradient(W * 0.5, H * 0.62, 0, W * 0.5, H * 0.62, W * 0.75);
  lift.addColorStop(0, 'rgba(255,255,255,0.045)');
  lift.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = lift;
  ctx.fillRect(0, 0, W, H);
  const cx = W * 0.5, cy = top + radius;
  const lightRadius = radius * 0.992;
  const ly = cy - (radius - lightRadius) - radius * 0.0035;
  const from = 0.90, to = 1.22, at = (f) => (f - from) / (to - from);
  const glow = ctx.createRadialGradient(cx, ly, lightRadius * from, cx, ly, lightRadius * to);
  [[0, 0], [at(0.985), 0], [at(0.9995), 0.95], [at(1.0), 0.62], [at(1.006), 0.34], [at(1.02), 0.17],
   [at(1.06), 0.07], [at(1.13), 0.022], [1, 0]].forEach(([o, a]) => glow.addColorStop(o, `rgba(255,255,255,${a})`));
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);
  if (haze) {
    const wide = ctx.createRadialGradient(cx, ly, lightRadius * 0.99, cx, ly, lightRadius * 1.12);
    [[0, 0], [0.04, 0.11], [0.2, 0.05], [0.5, 0.015], [1, 0]].forEach(([o, a]) => wide.addColorStop(o, `rgba(255,255,255,${a})`));
    ctx.fillStyle = wide;
    ctx.fillRect(0, 0, W, H);
  }
  const disc = ctx.createRadialGradient(cx, cy, radius * 0.9, cx, cy, radius);
  disc.addColorStop(0, 'rgba(8,9,11,1)');
  disc.addColorStop(0.999, 'rgba(8,9,11,1)');
  disc.addColorStop(1, 'rgba(8,9,11,0)');
  ctx.fillStyle = disc;
  ctx.fillRect(0, 0, W, H);
}

// MARK: The glass — the same maths as the app's Metal shader (WelcomeGlass.swift), in WebGL

const layers = {};
function layer(name, w, h) {
  let c = layers[name];
  if (!c) c = layers[name] = document.createElement('canvas');
  if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
  const g = c.getContext('2d');
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; g.filter = 'none';
  g.clearRect(0, 0, w, h);
  return [c, g];
}

const VERTEX = `attribute vec2 aPos; varying vec2 vUV;
void main() { vUV = vec2(aPos.x * 0.5 + 0.5, 0.5 - aPos.y * 0.5); gl_Position = vec4(aPos, 0.0, 1.0); }`;
const FRAGMENT = `precision highp float;
varying vec2 vUV;
uniform sampler2D uMask, uSoft, uSharp, uGlow, uTrail, uGlint, uHorizon, uHorizonSoft;
uniform vec2 uSize, uOrigin, uView;
uniform float uStroke, uSoftSlope, uSharpSlope, uSoftStep, uSharpStep, uAlpha;
float a(sampler2D t, vec2 uv) { return texture2D(t, uv).a; }
// The height map's slope over a baseline of a few pixels (not one: its 8 bits would show as ripples),
// four taps a side.
vec3 normalOf(sampler2D t, vec2 uv, float slope, float step) {
  vec2 px = step / uSize;
  vec2 d = px * 0.5;
  float r = a(t, uv + vec2(px.x, 0.0)) + a(t, uv + vec2(px.x, d.y)) + a(t, uv + vec2(px.x, -d.y)) + a(t, uv + vec2(px.x * 0.5, 0.0));
  float l = a(t, uv - vec2(px.x, 0.0)) + a(t, uv - vec2(px.x, d.y)) + a(t, uv - vec2(px.x, -d.y)) + a(t, uv - vec2(px.x * 0.5, 0.0));
  float b = a(t, uv + vec2(0.0, px.y)) + a(t, uv + vec2(d.x, px.y)) + a(t, uv + vec2(-d.x, px.y)) + a(t, uv + vec2(0.0, px.y * 0.5));
  float u = a(t, uv - vec2(0.0, px.y)) + a(t, uv - vec2(d.x, px.y)) + a(t, uv - vec2(-d.x, px.y)) + a(t, uv - vec2(0.0, px.y * 0.5));
  vec2 g = vec2(r - l, b - u) / (4.0 * step * 0.875);
  return normalize(vec3(-g * slope, 1.0));
}
void main() {
  vec2 uv = vUV;
  float m = a(uMask, uv);
  float glow = a(uGlow, uv);
  vec2 pos = uOrigin + uv * uSize;
  if (m < 0.002) {
    float g = glow * 0.07;
    gl_FragColor = vec4(vec3(g), g) * uAlpha;
    return;
  }
  float h = a(uSoft, uv);
  vec3 n = normalOf(uSoft, uv, uSoftSlope, uSoftStep);
  vec3 ns = normalOf(uSharp, uv, uSharpSlope, uSharpStep);
  vec3 cool = vec3(0.90, 0.94, 1.0);
  // What is behind, seen through the rod: pulled toward its middle, as a convex rod bends it.
  // A touch of dispersion: red bends least, blue most.
  vec2 bend = n.xy * uStroke;
  vec3 behind = vec3(texture2D(uHorizonSoft, (pos - bend * 0.44) / uView).r,
                     texture2D(uHorizonSoft, (pos - bend * 0.45) / uView).g,
                     texture2D(uHorizonSoft, (pos - bend * 0.465) / uView).b);
  // The horizon's light under the letter: it lights the glass from below and behind.
  float below = dot(texture2D(uHorizonSoft, (pos + vec2(0.0, uStroke * 1.1)) / uView).rgb, vec3(0.3333));
  // Clear body: what is behind, darkened a touch where the glass is thickest, a breath of cool white.
  vec3 color = behind * (0.9 - 0.14 * h) + cool * (0.012 + 0.03 * h);
  // Toward its edges the rod gathers the light around it (a soft bevel), and the very edge catches
  // it (Fresnel): light lines, never a dark one.
  float bevel = 1.0 - n.z;
  color += cool * bevel * 0.28;
  float fresnel = pow(1.0 - ns.z, 4.0);
  color += cool * fresnel * 0.30;
  // The key light, above and in front: a crisp narrow highlight along the upper edges, and its bloom.
  vec3 key = normalize(vec3(-0.22, -0.82, 0.53));
  vec3 halfway = normalize(key + vec3(0.0, 0.0, 1.0));
  float spec = pow(max(dot(ns, halfway), 0.0), 48.0) * 2.1 + pow(max(dot(n, halfway), 0.0), 16.0) * 0.10;
  // …and the thin bright line the whole upper edge catches from it.
  float upper = fresnel * smoothstep(0.1, 0.8, -ns.y / max(length(ns.xy), 1e-3));
  color += vec3(1.0) * (spec + upper * 0.55);
  // The horizon behind and below: a rim along the lower edges, brighter where its light is.
  vec3 rimLight = normalize(vec3(0.0, 0.94, 0.25));
  float rim = pow(max(dot(ns, rimLight), 0.0), 3.0) * 0.9 + pow(max(dot(n, rimLight), 0.0), 2.0) * 0.25;
  color += cool * rim * (0.12 + 1.1 * below);
  // A faint caustic: that light gathered inside, near the rod's top.
  float caustic = smoothstep(0.6, 0.9, h) * smoothstep(0.05, 0.4, -n.y) * (0.06 + 0.4 * below);
  color += cool * caustic * 0.45;
  // The pen's fresh stroke, and the light that runs along the finished word.
  float tr = a(uTrail, uv);
  float gl = a(uGlint, uv);
  color += cool * (tr * 0.22 + gl * 0.36) + vec3(1.0) * spec * (tr * 0.45 + gl * 0.9);
  // Highlights roll off above 0.82 instead of clipping.
  vec3 over = max(color - 0.82, 0.0);
  color = min(color, vec3(0.82)) + 0.18 * (vec3(1.0) - exp(-over / 0.18));
  float g = glow * 0.07 * (1.0 - m);
  gl_FragColor = vec4(color * m + vec3(g), m + g) * uAlpha;
}`;

const glassCanvas = document.getElementById('glass');
const gl = glassCanvas.getContext('webgl', { premultipliedAlpha: true, alpha: true, antialias: false,
                                             preserveDrawingBuffer: true });
function compile(type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));
  return shader;
}
const program = gl.createProgram();
gl.attachShader(program, compile(gl.VERTEX_SHADER, VERTEX));
gl.attachShader(program, compile(gl.FRAGMENT_SHADER, FRAGMENT));
gl.linkProgram(program);
gl.useProgram(program);
const quad = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quad);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(program, 'aPos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
const TEXTURES = ['uMask', 'uSoft', 'uSharp', 'uGlow', 'uTrail', 'uGlint', 'uHorizon', 'uHorizonSoft'];
const textures = TEXTURES.map((name, unit) => {
  const texture = gl.createTexture();
  gl.activeTexture(gl.TEXTURE0 + unit);
  gl.bindTexture(gl.TEXTURE_2D, texture);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.uniform1i(gl.getUniformLocation(program, name), unit);
  return texture;
});
function upload(unit, source) {
  gl.activeTexture(gl.TEXTURE0 + unit);
  gl.bindTexture(gl.TEXTURE_2D, textures[unit]);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, source);
}
const uniform = (name) => gl.getUniformLocation(program, name);
let horizonUploaded = null;

/** The glass of what is written: masks drawn here (x-heights mapped to the glass's pixels), the
 *  shader over them. */
function drawGlass(L, scale, revealed, trailPath, glintPath, alpha, lift, full) {
  const r = L.rect;
  const w = Math.max(1, Math.round(r.w * scale)), h = Math.max(1, Math.round(r.h * scale));
  if (glassCanvas.width !== w || glassCanvas.height !== h) { glassCanvas.width = w; glassCanvas.height = h; }
  glassCanvas.style.width = `${w / scale}px`;
  glassCanvas.style.height = `${h / scale}px`;
  glassCanvas.style.transform = `translate(${r.x}px, ${r.y + lift}px)`;
  const k = L.xh * scale, ox = (L.W / 2 - r.x) * scale, oy = (L.baseline - r.y) * scale;
  const reveal = greeting.reveal;
  // The outline, revealed by the pen: round-capped, a little wider than the font's strokes.
  const [mask, mg] = layer('mask', w, h);
  mg.setTransform(k, 0, 0, k, ox, oy);
  mg.fillStyle = '#fff';
  mg.fill(outline, 'nonzero');
  if (!full) {
    mg.globalCompositeOperation = 'destination-in';
    mg.lineCap = 'round'; mg.lineJoin = 'round'; mg.lineWidth = reveal; mg.strokeStyle = '#fff';
    if (revealed) mg.stroke(revealed); else mg.clearRect(-1e4, -1e4, 2e4, 2e4);
  }
  const outlineCut = (name, path, width) => {
    const [c, g] = layer(name, w, h);
    if (path) {
      g.setTransform(k, 0, 0, k, ox, oy);
      g.lineCap = 'round'; g.lineJoin = 'round'; g.lineWidth = width; g.strokeStyle = '#fff';
      g.stroke(path);
      g.setTransform(1, 0, 0, 1, 0, 0);
      g.globalCompositeOperation = 'destination-in';
      g.drawImage(mask, 0, 0);
    }
    return c;
  };
  const trailMask = outlineCut('trail', trailPath, reveal * 1.1);
  const glintMask = outlineCut('glint', glintPath, reveal * 1.4);
  const sw = L.stroke * scale;
  const blurred = (name, sigma) => {
    const [c, g] = layer(name, w, h);
    g.filter = `blur(${sigma.toFixed(2)}px)`;
    g.drawImage(mask, 0, 0);
    return c;
  };
  const softSigma = sw * 0.26, sharpSigma = Math.max(1.2, sw * 0.08);
  const soft = blurred('soft', softSigma), sharp = blurred('sharp', sharpSigma), glow = blurred('glow', sw * 0.9);
  // Trail and glint a little soft.
  const [trailSoft, tg] = layer('trailSoft', w, h); tg.filter = `blur(${(sw * 0.18).toFixed(2)}px)`; tg.drawImage(trailMask, 0, 0);
  const [glintSoft, gg] = layer('glintSoft', w, h); gg.filter = `blur(${(sw * 0.3).toFixed(2)}px)`; gg.drawImage(glintMask, 0, 0);
  gl.viewport(0, 0, w, h);
  gl.clearColor(0, 0, 0, 0);
  gl.clear(gl.COLOR_BUFFER_BIT);
  [mask, soft, sharp, glow, trailSoft, glintSoft].forEach((c, unit) => upload(unit, c));
  if (horizonUploaded !== layers.horizon) {
    upload(6, layers.horizon);
    // What the glass bends, a little softened (the app blurs its copy once per size too: WelcomeGlassCanvas).
    const [softened, sg] = layer('horizonSoft', layers.horizon.width, layers.horizon.height);
    sg.filter = `blur(${(sw * 0.07).toFixed(2)}px)`;
    sg.drawImage(layers.horizon, 0, 0);
    upload(7, softened);
    horizonUploaded = layers.horizon;
  }
  gl.uniform2f(uniform('uSize'), w, h);
  gl.uniform2f(uniform('uOrigin'), r.x * scale, (r.y + lift) * scale);
  gl.uniform2f(uniform('uView'), L.W * scale, L.H * scale);
  gl.uniform1f(uniform('uStroke'), sw);
  // Slopes per pixel scaled so a rod's edge tilts about 70°.
  gl.uniform1f(uniform('uSoftSlope'), softSigma * 3.6);
  gl.uniform1f(uniform('uSharpSlope'), sharpSigma * 3.9);
  gl.uniform1f(uniform('uSoftStep'), Math.max(1.5, softSigma * 0.45));
  gl.uniform1f(uniform('uSharpStep'), Math.max(1.2, sharpSigma * 0.6));
  gl.uniform1f(uniform('uAlpha'), alpha);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

// MARK: One frame

const canvas = document.getElementById('stage');
const wordmark = document.getElementById('wordmark');
const startButton = document.getElementById('start');
const lock = document.getElementById('lock');
startButton.textContent = TEXT.start;
lock.innerHTML = firstLaunch
  ? `<div class="mark"></div><h1>${TEXT.setup}</h1><p>${TEXT.setupSub}</p><div class="label">${TEXT.password}</div><div class="field"></div><div class="button">${TEXT.next}</div>`
  : `<div class="mark"></div><h1>${TEXT.unlock}</h1><p>${TEXT.unlockSub}</p><div class="field"></div><div class="button">${TEXT.unlockButton}</div>`;

const ease = {
  out: (x) => 1 - Math.pow(1 - x, 3),
  inOut: (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
  // The design's entry curve, cubic-bezier(.16, 1, .3, 1) (Motion.entry).
  entry: (x) => bezier(0.16, 1, 0.3, 1, x),
};
function bezier(x1, y1, x2, y2, x) {
  let lo = 0, hi = 1, t = x;
  for (let i = 0; i < 30; i++) {
    t = (lo + hi) / 2;
    const bx = 3 * (1 - t) * (1 - t) * t * x1 + 3 * (1 - t) * t * t * x2 + t * t * t;
    if (bx < x) lo = t; else hi = t;
  }
  return 3 * (1 - t) * (1 - t) * t * y1 + 3 * (1 - t) * t * t * y2 + t * t * t;
}
const clamp01 = (x) => Math.max(0, Math.min(1, x));
const progress = (t, start, length) => clamp01((t - start) / length);

function render(t) {
  const W = innerWidth, H = innerHeight, scale = devicePixelRatio || 1;
  if (canvas.width !== Math.round(W * scale) || canvas.height !== Math.round(H * scale)) {
    canvas.width = Math.round(W * scale); canvas.height = Math.round(H * scale);
  }
  const L = layout(W, H);
  const ctx = canvas.getContext('2d');
  ctx.setTransform(1, 0, 0, 1, 0, 0);

  // The opening: the splash eases up 30 pt and fades; the window's content scales in from 0.98.
  const opening = reduced ? progress(t, openingAt, T.reducedOpening) : progress(t, openingAt, T.opening);
  const leave = ease.inOut(opening);
  const lift = reduced ? 0 : -30 * leave;
  const splashAlpha = 1 - leave;
  const content = reduced ? opening : ease.entry(opening);
  lock.style.opacity = content.toFixed(4);
  lock.style.transform = reduced ? 'none' : `scale(${(0.98 + 0.02 * content).toFixed(5)})`;

  // The horizon, drawn once per size (the app keeps its picture: WelcomeSplashCache).
  let horizon = layers.horizon;
  if (!horizon || horizon.width !== canvas.width || horizon.height !== canvas.height) {
    const [made, hg] = layer('horizon', canvas.width, canvas.height);
    hg.setTransform(scale, 0, 0, scale, 0, 0);
    drawHorizon(hg, L);
    horizon = made;
  }
  const arcIn = reduced ? progress(t, 0, T.reducedIn) : ease.out(progress(t, 0, T.arcIn));
  ctx.fillStyle = '#08090B';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.globalAlpha = arcIn * splashAlpha;
  ctx.drawImage(horizon, 0, (reduced ? 0 : (1 - arcIn) * 10 * scale) + lift * scale);
  ctx.globalAlpha = 1;

  // The greeting.
  const writing = reduced ? Infinity : t - T.penStart;
  const greetingAlpha = (reduced ? ease.out(progress(t, 0, T.reducedIn)) : 1) * splashAlpha;
  const full = writing >= lastEnd;
  const revealed = full ? null : written(writing);
  const fresh = reduced ? null : trail(writing, T.trail);
  // The settle: one light along the finished greeting, in the order it was written, faster.
  const sweep = reduced ? -1 : (t - writtenAt) / T.settle;
  const glint = sweep > 0 && sweep < 1.2 ? trail(ease.inOut(clamp01(sweep)) * D + (sweep > 1 ? (sweep - 1) * D : 0), 0.32) : null;
  drawGlass(L, scale, revealed, fresh, glint, greetingAlpha, lift, full);

  // "LUMEN", then (first launch) the button.
  const wordIn = reduced ? progress(t, 0, T.reducedIn) : ease.out(progress(t, writtenAt + T.wordmarkDelay, T.wordmarkIn));
  wordmark.style.fontSize = `${Math.max(11, 0.24 * L.xh).toFixed(2)}px`;
  wordmark.style.top = `${(L.wordmarkY + lift).toFixed(2)}px`;
  wordmark.style.opacity = (wordIn * splashAlpha).toFixed(4);
  const buttonIn = !firstLaunch ? 0
    : reduced ? progress(t, 0, T.reducedIn) : ease.out(progress(t, writtenAt + T.buttonDelay, T.buttonIn));
  startButton.style.top = `${(H - Math.max(64, H * 0.11) - 14 + lift).toFixed(2)}px`;
  startButton.style.opacity = (buttonIn * splashAlpha).toFixed(4);
  startButton.style.visibility = buttonIn > 0 ? 'visible' : 'hidden';
}

// MARK: Playing

let clockStart = null, frozen = query.has('t') ? Number(query.get('t')) : null;
function skip(now) {
  if (openingAt !== Infinity && now >= openingAt) return;
  openingAt = now;
}
window.__render = (t) => { frozen = t; render(t); };
window.__skipAt = (t) => { openingAt = t; };
window.__info = () => ({ duration: D, writtenAt, openingAt, end: openingAt + (reduced ? T.reducedOpening : T.opening) });
function tick(now) {
  if (frozen !== null) return render(frozen);
  if (clockStart === null) clockStart = now;
  render((now - clockStart) / 1000);
  requestAnimationFrame(tick);
}
addEventListener('pointerdown', () => skip((performance.now() - (clockStart ?? 0)) / 1000));
addEventListener('keydown', () => skip((performance.now() - (clockStart ?? 0)) / 1000));
addEventListener('resize', () => frozen !== null && render(frozen));
window.__ready = true;
requestAnimationFrame(tick);
</script>
</body>
</html>
