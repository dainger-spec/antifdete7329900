<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumen — welcome</title>
<!--
  The launch screen (WelcomeSplash.swift), frame for frame: the eclipse as VMWallpaper / LumenHorizon
  draw it, the greeting written along the paths and timing of welcome-lettering.js (generated by
  design/tools/welcome_lettering.py, the same data the app gets), the glass tube as the app draws it
  before macOS 26 (on 26 the app puts SwiftUI's own Liquid Glass on the same shape), the settle
  sweep, "LUMEN", the first launch's button, and the opening into the lock screen.

  ?lang=ru|en|de|…   the greeting          ?ui=ru|en  the interface (button, lock screen)
  ?first=1           the first launch: the button, no opening by itself
  ?rm=1              Reduce Motion          ?t=1.4     one still frame at 1.4 s (no playing)
  window.__render(t) draws the frame at t seconds (design/tools/record_welcome.mjs records with it).
  A click or a key skips to the opening, as in the app.
-->
<style>
  html, body { margin: 0; height: 100%; background: #08090B; overflow: hidden; }
  canvas { display: block; position: fixed; inset: 0; width: 100vw; height: 100vh; }
  .ui { position: fixed; inset: 0; pointer-events: none; z-index: 1;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, sans-serif; }
  #wordmark { position: absolute; left: 0; right: 0; text-align: center; color: rgba(244, 244, 245, 0.46);
              font-weight: 600; text-indent: 0.62em; letter-spacing: 0.62em; }
  #start { position: absolute; left: 50%; transform: translateX(-50%); pointer-events: auto;
           height: 28px; padding: 0 16px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.14);
           background: rgba(22, 23, 27, 0.92); color: #F4F4F5; font: 500 12.5px/26px -apple-system,
           BlinkMacSystemFont, Inter, sans-serif; letter-spacing: 0.01em; cursor: pointer; box-sizing: border-box;
           box-shadow: 0 1px 0 rgba(255, 255, 255, 0.06) inset, 0 6px 18px rgba(0, 0, 0, 0.45); }
  /* The lock screen behind, as the opening reveals it (a stand-in for UnlockView / SetupView). */
  #lock { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
          justify-content: center; color: #F4F4F5; font-family: -apple-system, BlinkMacSystemFont, Inter, sans-serif;
          opacity: 0; transform-origin: 50% 50%; pointer-events: none; z-index: 2; background: #08090B;
          background-image:
            radial-gradient(circle at calc(100% + 330px) -300px, transparent 640px, rgba(236, 240, 248, 0.55) 642px,
                            rgba(236, 240, 248, 0.10) 652px, rgba(236, 240, 248, 0.03) 700px, transparent 760px),
            radial-gradient(circle at -260px calc(100% + 290px), transparent 470px, rgba(236, 240, 248, 0.5) 472px,
                            rgba(236, 240, 248, 0.09) 482px, rgba(236, 240, 248, 0.03) 520px, transparent 580px); }
  #lock .mark { width: 64px; height: 64px; border-radius: 15px; background: #111216;
                box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.10) inset; position: relative; }
  #lock .mark::before, #lock .mark::after { content: ""; position: absolute; left: 13px; top: 13px; width: 38px;
                height: 38px; border-radius: 50%; background: #F4F4F5; }
  #lock .mark::before { clip-path: polygon(0 0, 46% 0, 34% 100%, 0 100%); transform: translate(-1px, 2px); }
  #lock .mark::after { clip-path: polygon(52% 0, 100% 0, 100% 100%, 40% 100%); transform: translate(1px, -2px); }
  #lock h1 { font-size: 32px; font-weight: 700; margin: 28px 0 0; letter-spacing: -0.01em; }
  #lock p { font-size: 15px; color: #A1A1AA; margin: 10px 0 0; }
  #lock .field { width: 352px; height: 48px; margin-top: 36px; border-radius: 12px; background: #0D0E11;
                 box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.5) inset, 0 0 0 4px rgba(255, 255, 255, 0.06); }
  #lock .label { width: 352px; margin-top: 36px; font-size: 13px; font-weight: 600; }
  #lock .label + .field { margin-top: 8px; }
  #lock .button { width: 352px; height: 44px; margin-top: 16px; border-radius: 12px; background: #F4F4F5; color: #08090B;
                  font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
  #lock .corner { position: fixed; border-radius: 50%; pointer-events: none; }
</style>
</head>
<body>
<div id="lock"></div>
<canvas id="stage"></canvas>
<div class="ui"><div id="wordmark">LUMEN</div><button id="start"></button></div>
<script src="welcome-lettering.js"></script>
<script>
'use strict';
const query = new URLSearchParams(location.search);
const ALL = window.WELCOME_LETTERING;
const greeting = ALL.find((g) => g.code === (query.get('lang') || 'ru')) || ALL[0];
const ui = query.get('ui') || (greeting.code === 'ru' || greeting.code === 'uk' ? 'ru' : 'en');
const firstLaunch = query.get('first') === '1';
const reduced = query.get('rm') === '1';
const TEXT = {
  ru: { start: 'Приступить', unlock: 'Хранилище заблокировано', unlockSub: 'Введите мастер-пароль, чтобы продолжить.',
        unlockButton: 'Разблокировать', setup: 'Создайте мастер-пароль',
        setupSub: 'Он шифрует список профилей, их настройки, пароли, историю и данные сайтов.', password: 'Мастер-пароль' },
  en: { start: 'Get started', unlock: 'Vault locked', unlockSub: 'Enter your master password to continue.',
        unlockButton: 'Unlock', setup: 'Create a master password',
        setupSub: 'It encrypts the profile list, their settings, passwords, history and website data.', password: 'Master password' },
}[ui];

// MARK: Timing — the same numbers as WelcomeTiming (WelcomeSplash.swift).
const T = {
  arcIn: 0.5,          // the horizon fades and rises in
  penStart: 0.3,       // the pen starts
  settle: 0.7,         // the light runs along the glass once the greeting is written
  wordmarkDelay: 0.15, // "LUMEN" after the greeting, over…
  wordmarkIn: 0.6,
  buttonDelay: 0.35,   // the first launch's button, over…
  buttonIn: 0.5,
  hold: 0.85,          // from the end of the writing to the opening, on a later launch
  opening: 0.6,
  reducedIn: 0.4,      // Reduce Motion: the greeting fades in whole…
  reducedHold: 1.2,    // …stays…
  reducedOpening: 0.4, // …and the screen cross-fades
};
const D = greeting.duration;
const writtenAt = T.penStart + D;
let openingAt = firstLaunch ? Infinity : (reduced ? T.reducedIn + T.reducedHold : writtenAt + T.hold);

// MARK: Geometry

function parse(d) {
  const n = d.split(/[\s,]+/).filter((s) => s && !/[MC]/.test(s)).map(Number);
  const segs = [];
  let x = n[0], y = n[1];
  for (let i = 2; i + 5 < n.length + 1; i += 6) {
    segs.push([x, y, n[i], n[i + 1], n[i + 2], n[i + 3], n[i + 4], n[i + 5]]);
    x = n[i + 4]; y = n[i + 5];
  }
  return segs;
}
const strokes = greeting.strokes.map((s) => ({ ...s, segs: parse(s.d), pen: s.p.split(' ').map(Number) }));

/** The cubic `s` split at `u`: [first part, second part]. */
function split(s, u) {
  const [x0, y0, x1, y1, x2, y2, x3, y3] = s;
  const l = (a, b) => a + (b - a) * u;
  const ax = l(x0, x1), ay = l(y0, y1), bx = l(x1, x2), by = l(y1, y2), cx = l(x2, x3), cy = l(y2, y3);
  const dx = l(ax, bx), dy = l(ay, by), ex = l(bx, cx), ey = l(by, cy);
  const fx = l(dx, ex), fy = l(dy, ey);
  return [[x0, y0, ax, ay, dx, dy, fx, fy], [fx, fy, ex, ey, cx, cy, x3, y3]];
}

/** The stroke between pen positions `a` and `b` (segment index + parameter), as a Path2D. */
function subpath(segs, a, b, map) {
  const path = new Path2D();
  a = Math.max(0, Math.min(segs.length, a));
  b = Math.max(0, Math.min(segs.length, b));
  if (b - a < 1e-4) return null;
  let first = true;
  const from = Math.floor(a), to = Math.min(segs.length - 1, Math.floor(b - 1e-9));
  for (let k = from; k <= to; k++) {
    let s = segs[k];
    const ua = k === from ? a - k : 0, ub = k === to ? b - k : 1;
    if (ub < 1) s = split(s, ub)[0];
    if (ua > 0) s = split(s, ua / ub)[1];
    const p = s.map((v, i) => (i % 2 ? map.y(v) : map.x(v)));
    if (first) { path.moveTo(p[0], p[1]); first = false; }
    path.bezierCurveTo(p[2], p[3], p[4], p[5], p[6], p[7]);
  }
  return path;
}

/** Where the pen of `stroke` is at time `t` (writing time, from the first stroke's start). */
function penAt(stroke, t) {
  if (t <= stroke.t0) return 0;
  if (t >= stroke.t1) return stroke.segs.length;
  const f = (t - stroke.t0) * 120;
  const i = Math.floor(f);
  const pen = stroke.pen;
  if (i + 1 >= pen.length) return pen[pen.length - 1];
  return pen[i] + (pen[i + 1] - pen[i]) * (f - i);
}

// MARK: Layout — WelcomeLayout (WelcomeSplash.swift)

function layout(W, H) {
  const radius = W * 0.78, top = H * 0.54;
  const b = greeting.bounds;
  // The x-height: the mock's (6.8 % of the height); a short greeting larger, up to 9.5 %, so that it
  // spans about 44 % of the width; never wider than 86 % of the window.
  const words = b[2] - b[0];
  let xh = Math.min(Math.max(H * 0.068, (W * 0.44) / words), H * 0.095);
  xh = Math.min(xh, (W * 0.86) / words);
  const baseline = top + 0.62 * xh;
  const tube = xh * 0.2;
  const descent = Math.max(0, b[3]);
  return { W, H, radius, top, xh, baseline, tube, cx: W / 2, cy: top + radius,
           wordmarkY: baseline + Math.max(0.95, descent + 0.42) * xh,
           map: { x: (v) => W / 2 + v * xh, y: (v) => baseline + v * xh } };
}

// MARK: The horizon — LumenHorizon.draw (VMWallpaper's eclipse)

function drawHorizon(ctx, L, haze = true) {
  const { W, H, radius, top } = L;
  ctx.fillStyle = '#08090B';
  ctx.fillRect(0, 0, W, H);
  const lift = ctx.createRadialGradient(W * 0.5, H * 0.62, 0, W * 0.5, H * 0.62, W * 0.75);
  lift.addColorStop(0, 'rgba(255,255,255,0.045)');
  lift.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = lift;
  ctx.fillRect(0, 0, W, H);
  const cx = W * 0.5, cy = top + radius;
  const lightRadius = radius * 0.992;
  const ly = cy - (radius - lightRadius) - radius * 0.0035;
  const from = 0.90, to = 1.22, at = (f) => (f - from) / (to - from);
  const glow = ctx.createRadialGradient(cx, ly, lightRadius * from, cx, ly, lightRadius * to);
  [[0, 0], [at(0.985), 0], [at(0.9995), 0.95], [at(1.0), 0.62], [at(1.006), 0.34], [at(1.02), 0.17],
   [at(1.06), 0.07], [at(1.13), 0.022], [1, 0]].forEach(([o, a]) => glow.addColorStop(o, `rgba(255,255,255,${a})`));
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);
  if (haze) {
    // The launch screen's own: a wider haze over the rim, as in the owner's mock.
    const wide = ctx.createRadialGradient(cx, ly, lightRadius * 0.99, cx, ly, lightRadius * 1.12);
    [[0, 0], [0.04, 0.11], [0.2, 0.05], [0.5, 0.015], [1, 0]].forEach(([o, a]) => wide.addColorStop(o, `rgba(255,255,255,${a})`));
    ctx.fillStyle = wide;
    ctx.fillRect(0, 0, W, H);
  }
  const disc = ctx.createRadialGradient(cx, cy, radius * 0.9, cx, cy, radius);
  disc.addColorStop(0, 'rgba(8,9,11,1)');
  disc.addColorStop(0.999, 'rgba(8,9,11,1)');
  disc.addColorStop(1, 'rgba(8,9,11,0)');
  ctx.fillStyle = disc;
  ctx.fillRect(0, 0, W, H);
}

// MARK: The glass tube — WelcomeGlass (before macOS 26)

const layers = {};
function layer(name, w, h) {
  let c = layers[name];
  if (!c) { c = layers[name] = document.createElement('canvas'); }
  if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
  const g = c.getContext('2d');
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, w, h);
  g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; g.filter = 'none';
  return [c, g];
}

function strokeAll(g, paths, width, style, dx = 0, dy = 0) {
  if (paths.length > 1) {
    // One path: a composite operation such as destination-in applies to the whole shape at once.
    const all = new Path2D();
    paths.forEach((p) => all.addPath(p));
    paths = [all];
  }
  g.save();
  g.translate(dx, dy);
  g.lineCap = 'round'; g.lineJoin = 'round';
  g.lineWidth = width; g.strokeStyle = style;
  paths.forEach((p) => g.stroke(p));
  g.restore();
}

function drawGlass(ctx, L, paths, horizon, scale, extras) {
  const w = L.tube;
  const cw = ctx.canvas.width, ch = ctx.canvas.height;
  // Halo and the shadow under the glass.
  ctx.save();
  ctx.filter = `blur(${1.1 * w * scale}px)`;
  strokeAll(ctx, paths, w * 1.5, 'rgba(255,255,255,0.06)');
  ctx.filter = `blur(${0.35 * w * scale}px)`;
  strokeAll(ctx, paths, w, 'rgba(0,0,0,0.55)', 0, 0.2 * w);
  ctx.restore();
  // The tube, drawn into its own layer and cut to its shape.
  const [tube, g] = layer('tube', cw, ch);
  g.setTransform(scale, 0, 0, scale, 0, 0);
  // Edges darker than the core: a round rod.
  strokeAll(g, paths, w, 'rgb(74,77,85)');
  g.filter = `blur(${0.16 * w * scale}px)`;
  strokeAll(g, paths, w * 0.74, 'rgb(158,162,171)');
  g.filter = 'none';
  // What is behind, bent by the glass: the horizon's light inside the letters, a little higher.
  g.save();
  g.globalAlpha = 0.85;
  g.globalCompositeOperation = 'screen';
  g.setTransform(1, 0, 0, 1, 0, -0.9 * w * scale);
  g.drawImage(horizon, 0, 0);
  g.restore();
  g.setTransform(scale, 0, 0, scale, 0, 0);
  g.filter = `blur(${0.22 * w * scale}px)`;
  strokeAll(g, paths, w * 0.42, 'rgba(255,255,255,0.20)');
  // The light on the glass: a bright line along its upper side, a softer one below.
  g.filter = `blur(${0.05 * w * scale}px)`;
  strokeAll(g, paths, w * 0.2, 'rgba(255,255,255,0.92)', -0.1 * w, -0.25 * w);
  g.filter = `blur(${0.09 * w * scale}px)`;
  strokeAll(g, paths, w * 0.14, 'rgba(255,255,255,0.38)', 0.06 * w, 0.29 * w);
  g.filter = 'none';
  extras && extras(g, w, scale);
  // Cut to the tube.
  g.globalCompositeOperation = 'destination-in';
  strokeAll(g, paths, w, '#fff');
  g.globalCompositeOperation = 'source-over';
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(tube, 0, 0);
  ctx.restore();
}

// MARK: One frame

const canvas = document.getElementById('stage');
const wordmark = document.getElementById('wordmark');
const startButton = document.getElementById('start');
const lock = document.getElementById('lock');
startButton.textContent = TEXT.start;
lock.innerHTML = firstLaunch
  ? `<div class="mark"></div><h1>${TEXT.setup}</h1><p>${TEXT.setupSub}</p><div class="label">${TEXT.password}</div><div class="field"></div><div class="button">${TEXT.unlockButton === 'Unlock' ? 'Continue' : 'Продолжить'}</div>`
  : `<div class="mark"></div><h1>${TEXT.unlock}</h1><p>${TEXT.unlockSub}</p><div class="field"></div><div class="button">${TEXT.unlockButton}</div>`;

const ease = {
  out: (x) => 1 - Math.pow(1 - x, 3),
  inOut: (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
  // The design's entry curve, cubic-bezier(.16, 1, .3, 1) (Motion.entry).
  entry: (x) => bezier(0.16, 1, 0.3, 1, x),
};
function bezier(x1, y1, x2, y2, x) {
  let lo = 0, hi = 1, t = x;
  for (let i = 0; i < 30; i++) {
    t = (lo + hi) / 2;
    const bx = 3 * (1 - t) * (1 - t) * t * x1 + 3 * (1 - t) * t * t * x2 + t * t * t;
    if (bx < x) lo = t; else hi = t;
  }
  return 3 * (1 - t) * (1 - t) * t * y1 + 3 * (1 - t) * t * t * y2 + t * t * t;
}
const clamp01 = (x) => Math.max(0, Math.min(1, x));
const progress = (t, start, length) => clamp01((t - start) / length);

function render(t) {
  const W = innerWidth, H = innerHeight, scale = devicePixelRatio || 1;
  if (canvas.width !== Math.round(W * scale) || canvas.height !== Math.round(H * scale)) {
    canvas.width = Math.round(W * scale); canvas.height = Math.round(H * scale);
  }
  const L = layout(W, H);
  const ctx = canvas.getContext('2d');
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // The opening: the splash eases up and fades; the window's content scales in from 0.98.
  const opening = reduced ? progress(t, openingAt, T.reducedOpening) : progress(t, openingAt, T.opening);
  const leave = ease.inOut(opening);
  // The whole screen moves up 30 pt as it fades (RootView's transition).
  const lift = reduced ? 0 : -30 * leave;
  const splashAlpha = 1 - leave;
  const content = reduced ? opening : ease.entry(opening);
  lock.style.opacity = content.toFixed(4);
  lock.style.transform = reduced ? 'none' : `scale(${(0.98 + 0.02 * content).toFixed(5)})`;
  document.body.style.background = '#08090B';

  // The horizon: in at the start, out with the opening.
  // Drawn once per size, as the app keeps its picture (WelcomeHorizonPicture).
  let horizon = layers.horizon;
  if (!horizon || horizon.width !== canvas.width || horizon.height !== canvas.height) {
    const [made, hg] = layer('horizon', canvas.width, canvas.height);
    hg.setTransform(scale, 0, 0, scale, 0, 0);
    drawHorizon(hg, L);
    horizon = made;
  }
  const arcIn = reduced ? progress(t, 0, T.reducedIn) : ease.out(progress(t, 0, T.arcIn));
  ctx.save();
  ctx.fillStyle = '#08090B';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.globalAlpha = arcIn * splashAlpha;
  ctx.drawImage(horizon, 0, (reduced ? 0 : (1 - arcIn) * 10 * scale) + lift * scale);
  ctx.restore();

  // The greeting.
  const written = reduced ? Infinity : t - T.penStart;
  const greetingAlpha = (reduced ? ease.out(progress(t, 0, T.reducedIn)) : 1) * splashAlpha;
  if (greetingAlpha > 0.001) {
    const map = { x: L.map.x, y: (v) => L.map.y(v) + lift };
    const paths = [], tips = [];
    for (const s of strokes) {
      const p = penAt(s, written);
      const path = subpath(s.segs, 0, p, map);
      if (path) paths.push(path);
      if (!reduced && written > s.t0 && written < s.t1 + 0.12) {
        const tip = subpath(s.segs, penAt(s, written - 0.12), p, map);
        if (tip) tips.push(tip);
      }
    }
    // The settle: a light runs along the glass in the order it was written, faster.
    const sweep = reduced ? -1 : (t - writtenAt) / T.settle;
    const glints = [];
    if (sweep > 0 && sweep < 1.15) {
      const along = sweep * D;
      for (const s of strokes) {
        if (along > s.t0 && along < s.t1 + 0.25) {
          const g = subpath(s.segs, penAt(s, along - 0.25), penAt(s, along), map);
          if (g) glints.push(g);
        }
      }
    }
    ctx.save();
    ctx.globalAlpha = greetingAlpha;
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    if (paths.length) {
      drawGlass(ctx, L, paths, horizon, scale, (g, w, sc) => {
        g.filter = `blur(${0.25 * w * sc}px)`;
        strokeAll(g, tips, w * 0.55, 'rgba(255,255,255,0.55)');
        strokeAll(g, glints, w * 0.7, 'rgba(255,255,255,0.75)');
        g.filter = 'none';
      });
    }
    ctx.restore();
  }

  // "LUMEN", then (first launch) the button.
  const wordIn = reduced ? progress(t, 0, T.reducedIn) : ease.out(progress(t, writtenAt + T.wordmarkDelay, T.wordmarkIn));
  wordmark.style.fontSize = `${Math.max(11, 0.24 * L.xh).toFixed(2)}px`;
  wordmark.style.top = `${(L.wordmarkY + lift).toFixed(2)}px`;
  wordmark.style.opacity = (wordIn * splashAlpha).toFixed(4);
  const buttonIn = !firstLaunch ? 0
    : reduced ? progress(t, 0, T.reducedIn) : ease.out(progress(t, writtenAt + T.buttonDelay, T.buttonIn));
  startButton.style.top = `${(H - Math.max(64, H * 0.11) - 14 + lift).toFixed(2)}px`;
  startButton.style.opacity = (buttonIn * splashAlpha).toFixed(4);
  startButton.style.visibility = buttonIn > 0 ? 'visible' : 'hidden';
}

// MARK: Playing

let clockStart = null, frozen = query.has('t') ? Number(query.get('t')) : null;
function skip(now) {
  if (openingAt !== Infinity && now >= openingAt) return;
  openingAt = now;
}
window.__render = (t) => { frozen = t; render(t); };
window.__skipAt = (t) => { openingAt = t; };
window.__info = () => ({ duration: D, writtenAt, openingAt, end: openingAt + (reduced ? T.reducedOpening : T.opening) });
function tick(now) {
  if (frozen !== null) return render(frozen);
  if (clockStart === null) clockStart = now;
  render((now - clockStart) / 1000);
  requestAnimationFrame(tick);
}
addEventListener('pointerdown', () => skip((performance.now() - (clockStart ?? 0)) / 1000));
addEventListener('keydown', () => skip((performance.now() - (clockStart ?? 0)) / 1000));
addEventListener('resize', () => frozen !== null && render(frozen));
window.__ready = true;
requestAnimationFrame(tick);
</script>
</body>
</html>
